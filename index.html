<!DOCTYPE html>
<!--
========================================================================
JOVEM PARLAMENTAR · Câmara Municipal de Campinas
========================================================================
Jogo sobre o caminho de um projeto de lei na Câmara: o jogador
assume um mandato, protocola um projeto e o leva do Protocolo à Sanção do
Prefeito respondendo a perguntas sobre as regras reais da tramitação.

Feito só com HTML, CSS e JavaScript, num único arquivo, sem servidor e
sem framework. Funciona sem internet depois da primeira visita (sw.js).
Documentação completa: README.md e a pasta doc/ (decisões em ADRs).

MAPA DESTE ARQUIVO (procure pelos títulos em MAIÚSCULAS)
  1. ESTILOS          <style>  aparência de todas as telas
  2. PÁGINA           <body>   cabeçalho com o logo, área #app e rodapé
  3. CONTEÚDO         <script> perguntas, imprevistos, cartas e regras
                               ← é a única parte a editar para mudar
                                 o conteúdo do jogo
  4. MOTOR            <script> regras, telas e botões
  5. IMAGENS          <script> ícones, ilustrações e logo (não editar)
  6. APLICATIVO       <script> registra o sw.js (uso sem internet)

COMO O JOGO FUNCIONA
  Boas-vindas → Gabinete (nome, projeto, Vereadora/Vereador) → 7 etapas,
  21 casas → às vezes, veto do Prefeito → Sanção ou promulgação (vitória),
  ou derrota (sem vidas, ou erro com o mandato zerado).
  - Acertar faz o peão andar. Estrelas: 3 de primeira, 2 na 2ª tentativa,
    1 na 3ª (no máximo 1 se só restava uma alternativa). Na Sanção, +1
    estrela por vida que sobrou.
  - Errar abre um pop-up que explica por que AQUELA alternativa está
    errada (instrução ramificada de Norman Crowder); só o OK fecha, e o
    jogador tenta de novo a mesma pergunta, com a errada riscada.
  - O 1º erro de cada pergunta custa 1 vida (de 5; nos imprevistos, não);
    cada etapa nova devolve 1 vida. Acerto gasta 1 mês do mandato (de 48)
    e erro, 2. Acertos e cartas nunca encerram a partida.
  - Imprevistos (casas com !) trazem uma pergunta; cartas trazem sorte
    ou azar. A Procuradoria pode ser consultada 3 vezes, de graça, e
    esconde uma alternativa errada (ADR-017).
  - Em 1 de cada 3 partidas o Prefeito veta, e a Câmara derruba o veto
    respondendo uma pergunta (ADR-016).
  - Nada é enviado para fora do aparelho: só o recorde e o último nome
    ficam guardados no navegador, e o jogador pode apagá-los.

RELAÇÃO COM O REGIMENTO INTERNO (RI) E A LEI ORGÂNICA (LOM)
  O tabuleiro segue a ordem da tramitação: protocolo (RI, arts. 125 a
  128); assessoramento jurídico (LOM, art. 59); Constituição e Legalidade
  (RI, art. 40); comissões de mérito (RI, arts. 39 e 42 a 56-E); Finanças
  e Orçamento (RI, art. 41); duas discussões no Plenário (RI, art. 160);
  autógrafo (RI, art. 159); sanção ou veto (LOM, arts. 50 e 51). O mandato
  de 48 meses vem da legislatura de 4 anos (LOM, art. 6º, § 1º).
  Simplificação assumida: um projeto real nem sempre passa por todas as
  comissões, mas a ordem das etapas e as regras citadas são as do texto.
========================================================================
-->

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

@font-face {
  font-family: "Bebas Neue";
  src: url("./fontes/bebas-neue.woff2") format("woff2");
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: Montserrat;
  src: url("./fontes/montserrat.woff2") format("woff2");
  font-weight: 300 800;
  font-display: swap;
}

/* ======================================================================
   CORES, FONTES E MEDIDAS
   Para mudar o visual do jogo, comece por aqui: todo o resto do CSS
   usa estas variáveis. Cor oficial da Câmara: anil #323380.
   ====================================================================== */
:root {
  --anil: #323380; /* anil oficial da Câmara: botão principal, casas feitas, barras */
  --anil-escuro: #26276a; /* anil do botão principal com o mouse em cima */
  --tecla-anil: #1c1d55; /* base da "tecla" do botão principal */
  --anil-medio: #4a4db3; /* anil médio (carta de sorte) */
  --titulo: #323380; /* cor dos títulos */
  --faixa: #323380; /* faixa da etapa */
  --texto-faixa: #fff; /* texto sobre a faixa */
  --sobre-anil: #fff; /* texto sobre fundo anil */
  --fundo: #f6f6fc; /* fundo da página (o tom mais claro do anil) */
  --painel: #ffffff; /* cartões e painéis (branco) */
  --claro: #ececf8; /* caixas claras: balão do Legis, etiquetas, realce */
  --claro2: #d9daf2; /* anil bem claro (borda do realce) */
  --borda: #e1e2ef; /* bordas finas dos cartões */
  --linha: #e9eaf3; /* linhas finas */
  --borda-botao: #cdcfe3; /* borda dos botões brancos */
  --tecla-clara: #b9bcd8; /* base da "tecla" dos botões brancos */
  --texto: #1d1f33; /* texto principal */
  --texto2: #545773; /* texto secundário (cinza azulado) */
  --vermelho: #c4242a; /* erros, vidas e alertas */
  --ouro: #c98a00; /* estrelas */
  --veu: rgba(26, 27, 70, 0.62); /* véu escuro atrás do pop-up */
  --fonte-titulo: "Bebas Neue", "Arial Narrow", Arial, sans-serif; /* títulos: Bebas Neue (como o informativo Notícias da Casa) */
  --fonte-texto: Montserrat, Arial, Helvetica, sans-serif; /* texto: Montserrat */
  --raio-cartao: 14px; /* cantos arredondados dos cartões */
  --raio-botao: 10px; /* cantos arredondados dos botões */
  --tecla: 4px; /* altura da borda de baixo dos botões (efeito de tecla) */
  --casa: clamp(34px, 5.4vh, 50px); /* tamanho das casas do tabuleiro (acompanha a altura da tela) */
  --linha-tab: clamp(8px, 1.5vh, 14px); /* espaço entre as linhas do tabuleiro */
  color-scheme: light;
}

/* ======================================================================
   BASE
   Página, textos, foco do teclado e ícones
   ====================================================================== */
img {
  max-width: 100%;
}
* {
  box-sizing: border-box;
}
html::-webkit-scrollbar, body::-webkit-scrollbar {
  display: none;
}
h1, h2, p, ul {
  margin: 0;
}
h1, h2 {
  text-wrap: balance;
}
:focus-visible {
  outline: 3px solid var(--vermelho);
  outline-offset: 2px;
}
.sub {
  color: var(--texto2);
  font-size: 14px;
}
h1 {
  color: var(--titulo);
}
.t, h1, h2 {
  font-family: var(--fonte-titulo);
  font-weight: 400;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.cen {
  text-align: center;
}
html, body {
  background: var(--fundo);
}
html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  scrollbar-width: none;
  min-height: 100%;
  overscroll-behavior-y: none;
}
body {
  margin: 0;
  color: var(--texto);
  font: 500 16px/1.45 var(--fonte-texto);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  border-top: 4px solid var(--anil);
}
.ico {
  width: 1.15em;
  height: 1.15em;
  flex: none;
  vertical-align: -0.2em;
}
.ico.vida {
  color: var(--vermelho);
  width: 18px;
  height: 18px;
}
.ico.vida.perdida {
  color: #b9bbd3;
}
.ico.est {
  color: var(--ouro);
  margin-right: 4px;
}
.sr {
  position: absolute !important;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ======================================================================
   CABEÇALHO, ÁREA DO JOGO E RODAPÉ
   Logo e botão Início no topo; #app é onde o motor desenha as telas
   ====================================================================== */
.lg {
  min-width: 0;
}
.lg img {
  display: block;
  object-fit: contain;
}
.home #mn {
  display: none;
}
.home #top {
  display: none;
}
#app {
  max-width: 560px;
  margin: 0 auto;
  padding-inline: 16px;
  flex: 1 0 auto;
  width: 100%;
}
.home {
  background: var(--fundo);
}
#top {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  padding: 10px max(16px, calc((100% - 1180px) / 2));
  background: var(--painel);
  border-bottom: 1px solid var(--borda);
  width: 100%;
  align-self: stretch;
}
#mn .ico {
  margin: 0;
}
#mn:hover {
  background: var(--claro);
}
#rod {
  position: relative;
  overflow: hidden;
  text-align: center;
  padding: 8px 16px;
  background: var(--painel);
  color: var(--texto2);
  border-top: 1px solid var(--borda);
  font: 500 12px var(--fonte-texto);
  letter-spacing: 0.5px;
  margin-top: 24px;
  flex: none;
}
#rod .sky {
  position: absolute;
  left: max(12px, calc((100% - 1180px) / 2));
  bottom: 0;
  height: 100%;
  border-right: 1px solid var(--borda);
  padding-right: 14px;
  color: #c4c6e4;
}
#mn {
  width: auto;
  text-align: center;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--anil);
  font: 600 14px var(--fonte-texto);
  padding: 8px 14px;
  min-height: 44px;
  border-width: 2px;
}

/* ======================================================================
   BOTÕES
   Principal (.go, anil), secundário (.sec2, borda), link (.lk) e
   consulta (.lf). Os botões são "teclas de votação": uma borda
   inferior mais grossa que afunda ao apertar
   ====================================================================== */
button:disabled {
  opacity: 0.7;
  cursor: default;
}
.go {
  text-align: center;
}
.bt {
  display: grid;
  gap: 10px;
}
.lk .cel {
  width: 18px;
  height: 18px;
  vertical-align: -4px;
  margin-right: 4px;
}
.bt1 {
  display: grid;
  gap: 10px;
}
.bt1 button {
  font-size: 18px;
  padding: 15px 10px;
}
.bt2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.bt2 button {
  font-size: 17px;
  padding: 14px 10px;
}
button .ico, .lk .ico {
  margin-right: 8px;
}
button {
  font: 700 16px var(--fonte-texto);
  color: var(--texto);
  background: var(--painel);
  border: 1px solid var(--borda-botao);
  padding: 12px;
  cursor: pointer;
  text-align: left;
  border-radius: var(--raio-botao);
  transition: background-color 0.12s, border-color 0.12s, transform 0.08s;
}
button:active:not(:disabled) {
  transform: translateY(1px);
}
button:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 3px solid #8f91d6;
}
.go, .boas .bt1 .go {
  background: var(--anil);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}
.go:hover:not(:disabled), .boas .bt1 .go:hover {
  background: var(--anil-escuro);
  border-color: var(--anil-escuro);
}
.sec2 {
  border: 1px solid var(--borda-botao);
  display: flex;
  align-items: center;
  justify-content: center;
}
.sec2:hover {
  background: var(--claro);
  border-color: var(--claro2);
}
.lf:hover:not(:disabled) {
  background: var(--claro);
}
.lf:disabled {
  color: var(--texto2);
  opacity: 0.75;
}
.go, .boas .bt1 .go {
  min-height: 52px;
  border: 0;
  border-bottom: var(--tecla) solid var(--tecla-anil);
  border-radius: 12px;
  font-size: 17px;
  letter-spacing: 0.2px;
  padding: 12px 18px;
  transition: transform 0.08s, border-bottom-width 0.08s, background-color 0.12s;
}
.go:active:not(:disabled) {
  transform: translateY(calc(var(--tecla) - 1px));
  border-bottom-width: 1px;
}
.sec2, .bt button:not(.go), .ov .card button:not(.go) {
  min-height: 52px;
  color: var(--anil);
  border: 2px solid var(--borda-botao);
  border-bottom: var(--tecla) solid var(--tecla-clara);
  border-radius: 12px;
  text-align: center;
  transition: transform 0.08s, border-bottom-width 0.08s, background-color 0.12s;
}
.sec2:active, .bt button:not(.go):active, .ov .card button:not(.go):active {
  transform: translateY(calc(var(--tecla) - 2px));
  border-bottom-width: 2px;
}
.lf {
  width: auto;
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  color: var(--anil);
  border-radius: 999px;
  font: 600 14.5px var(--fonte-texto);
  min-height: 44px;
  padding: 6px 16px 6px 6px;
  border: 2px solid var(--borda-botao);
}
.lf .ico {
  width: 30px;
  height: 30px;
  padding: 6px;
  border-radius: 50%;
  background: var(--claro);
}
.lk {
  width: auto;
  background: none;
  border: 0;
  font: 600 14px var(--fonte-texto);
  text-decoration: underline;
  text-underline-offset: 3px;
  text-align: center;
  display: inline-flex;
  align-items: center;
  color: var(--anil);
  min-height: 44px;
  padding: 8px 10px;
}
.go:focus-visible, .sec2:focus-visible, #o button:focus-visible, .lf:focus-visible, .sg button:focus-visible, .ex button:focus-visible {
  outline: 3px solid #f2c300;
  outline-offset: 3px;
}

/* ======================================================================
   CARTÕES, ETIQUETAS E BARRAS
   Peças repetidas em várias telas: cartão branco, etiqueta do cargo,
   barras, fonte legal e etiquetas de efeito (+3 estrelas...)
   ====================================================================== */
.card {
  padding: 16px;
}
.bx i {
  display: block;
  height: 100%;
  transition: width 0.4s;
}
.fx {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.card, .pl, .boas-lado, .gab, .como, .cr, .lei, .rv {
  background: var(--painel);
  border: 1px solid var(--borda);
  border-radius: var(--raio-cartao);
}
.rb {
  background: var(--claro);
  color: var(--anil);
  border: 0;
  border-radius: 999px;
  font: 600 12px var(--fonte-texto);
  padding: 3px 10px;
}
.bx {
  background: var(--claro);
  border-radius: 999px;
  height: 8px;
  overflow: hidden;
}
.bx i, .bx.mes i {
  background: var(--anil);
  border-radius: 999px;
}
.fx span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border-radius: 999px;
  font: 600 13px var(--fonte-texto);
  padding: 4px 10px;
  background: var(--claro);
}
.fx .ico {
  width: 14px;
  height: 14px;
  margin: 0;
}
.fx .up {
  background: #dcfae5;
  color: #04250e;
}
.fx .dn {
  background: #ffedea;
  color: #831c1e;
}
.fx .nv {
  border-color: var(--sobre-anil);
  color: var(--anil);
}
.rf {
  margin-top: 6px;
  font-size: 12.5px;
  padding: 1px 8px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 999px;
  border: 1px solid var(--borda);
  color: var(--texto2);
  font-weight: 600;
}
.rf .ico {
  width: 13px;
  height: 13px;
}

/* ======================================================================
   LEGIS E BALÃO DE FALA
   O mascote narra o jogo; xh = feliz (pula), xs = triste (inclina)
   ====================================================================== */
.ms {
  display: flex;
  gap: 10px;
  align-items: center;
}
.ms img {
  flex: none;
}
.mc {
  animation: bo 2.2s ease-in-out infinite;
  transform-origin: 50% 100%;
}
.mc.xh {
  animation: pu 0.6s ease-out 2;
}
.mc.xs {
  animation: tl 0.5s ease-out 1;
  transform: rotate(-8deg);
}
.bb {
  flex: 1;
  min-width: 0;
  font-size: 15px;
}
.bb, .st .bb {
  position: relative;
  background: var(--claro);
  border-radius: 12px;
  padding: 12px 14px;
}
.ms.so-texto .bb::before {
  display: none; /* balão sem o Legis ao lado: sem o rabinho */
}
.ms .bb::before {
  content: "";
  position: absolute;
  left: -8px;
  top: 50%;
  margin-top: -8px;
  border-style: solid;
  border-width: 8px 8px 8px 0;
  border-color: transparent var(--claro) transparent transparent;
}

/* ======================================================================
   TELA DE BOAS-VINDAS
   Cena do Legis na tribuna, título, Iniciar, Como jogar e instalar
   ====================================================================== */
.boas, .como, .gab {
  max-width: 560px;
  margin: 0 auto;
}
.boas {
  display: grid;
  gap: 14px;
  padding-top: 8px;
}
.boas-foto img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 36% 32%;
}
.boas-lado {
  display: contents;
}
.boas .tit {
  order: 1;
}
.boas .tbox .je, .boas .tbox h1 {
  border: 0;
}
.boas .tbox h1 {
  margin: 6px 0 0;
  font: 800 clamp(34px, 10vw, 64px) / 0.98 var(--fonte-texto);
  letter-spacing: -0.5px;
  color: #fff;
}
.boas .tbox h1 span {
  display: block;
  color: #8cc4f5;
}
.boas-txt {
  order: 3;
  text-align: center;
  font-size: 15px;
  color: var(--texto2);
}
.boas .bt1, .boas .inst, .boas .cen {
  order: 4;
}
.tit {
  text-align: center;
}
.tit .lgm {
  width: min(100%, 320px);
  display: block;
  margin: 0 auto 14px;
}
.inst {
  text-align: center;
  display: grid;
  gap: 4px;
  justify-items: center;
}
/* aviso de privacidade (LGPD, ADR-014): texto pequeno, abaixo das ações */
.priv {
  order: 5;
  display: grid;
  justify-items: center;
  gap: 2px;
  padding-top: 12px;
  border-top: 1px solid var(--borda);
  text-align: center;
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--texto2);
}
.priv p {
  max-width: 46ch;
}
.priv .ico {
  color: var(--anil);
  margin-right: 5px;
}
.priv .ok {
  color: #1e6b3a;
  font-weight: 600;
  padding-top: 6px;
}
.priv .lk {
  font-size: 13px;
}
.boas-foto {
  order: 2;
  overflow: hidden;
  height: 250px;
  border-radius: var(--raio-cartao);
}
.boas .tbox {
  padding: 14px 12px 16px;
  color: #fff;
  background: var(--anil);
  border-radius: var(--raio-cartao);
}
.boas .tbox .je {
  display: block;
  font: 600 14px var(--fonte-texto);
  letter-spacing: 0.5px;
  opacity: 0.85;
}
.boas .bt1 button {
  border-radius: var(--raio-botao);
}

/* ======================================================================
   TELA COMO JOGAR
   Um cartão por vez, com pontinhos de progresso
   ====================================================================== */
.como {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-top: 8px;
  min-height: min(560px, calc(100vh - 60px));
}
.cc1 h1 {
  font-size: 34px;
  line-height: 1;
}
.cc1 p {
  font-size: 17px;
  max-width: 38ch;
}
.pts {
  display: flex;
  justify-content: center;
  gap: 8px;
}
.pts i {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--borda);
}
.pts i.on {
  background: var(--anil);
  width: 26px;
  border-radius: 5px;
}
.cc1 {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 10px;
  background: var(--claro);
  padding: 0 18px 24px;
  overflow: hidden;
  animation: fl 0.35s ease-out;
  border-radius: 12px;
}
/* ilustração da etapa (a mesma faixa do jogo), com o ícone por cima */
.cc1-img {
  position: relative;
  align-self: stretch;
  height: clamp(150px, 30vh, 220px);
  margin: 0 -18px 26px;
}
.cc1-img svg {
  display: block;
  width: 100%;
  height: 100%;
}
.cc1 .ic {
  position: absolute;
  left: 50%;
  bottom: -28px;
  transform: translateX(-50%);
  display: grid;
  place-items: center;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 3px solid var(--claro);
  background: var(--painel);
  color: var(--anil);
  font-size: 0;
}
.cc1 .ic .ico {
  width: 30px;
  height: 30px;
}
.cabc {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--borda);
}
.cabc .ce {
  font: 600 14px var(--fonte-texto);
  color: var(--texto2);
}

/* ======================================================================
   TELA DO GABINETE
   Cena do Legis atrás da mesa, balão e ficha do mandato (formulário)
   ====================================================================== */
.fm {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}
.lb {
  font-weight: 700;
  font-size: 14px;
  display: block;
  margin-bottom: 4px;
}
input::placeholder, textarea::placeholder {
  color: var(--texto2);
  opacity: 0.75;
}
.sg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.on {
  color: var(--sobre-anil);
}
.ex {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  font-size: 13.5px;
  color: var(--texto2);
}
.ex span {
  flex-basis: 100%;
}
.er {
  color: var(--vermelho);
  font-weight: 700;
  font-size: 14px;
  min-height: 1.4em;
}
.gabw {
  display: grid;
  gap: 14px;
  max-width: 1000px;
  margin: 4px auto 0;
}
.gabw .gab {
  max-width: none;
}
.gabl h1 {
  color: #fff;
  text-align: center;
  font-size: 38px;
  line-height: 1;
  padding: 12px 10px 8px;
}
.palco-gab {
  position: relative;
  flex: 1;
  min-height: 300px;
}
.cena-gab {
  position: absolute;
  width: 100%;
  height: 100%;
}
.balao {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: max-content;
  max-width: 84%;
  text-align: center;
  background: #fff;
  border: 3px solid #1f2133;
  border-radius: 22px;
  padding: 9px 16px;
  font: 800 15px/1.2 var(--fonte-texto);
  z-index: 1;
}
.balao::before, .balao::after {
  content: "";
  position: absolute;
  left: 50%;
  border-style: solid;
}
.balao::before {
  bottom: -17px;
  margin-left: -11px;
  border-width: 17px 11px 0 11px;
  border-color: #1f2133 transparent transparent transparent;
}
.balao::after {
  bottom: -11px;
  margin-left: -7px;
  border-width: 12px 7px 0 7px;
  border-color: #fff transparent transparent transparent;
}
input, textarea {
  font: 500 17px/1.35 var(--fonte-texto);
  color: var(--texto);
  padding: 10px 12px;
  width: 100%;
  resize: none;
  display: block;
  border: 1px solid var(--borda-botao);
  border-radius: var(--raio-botao);
}
.ex button:hover {
  background: var(--claro);
}
.fm h2.t {
  font-size: 34px;
  color: var(--anil);
  padding-bottom: 2px;
  border-bottom: 2px solid var(--claro2);
}
.gabl {
  display: flex;
  flex-direction: column;
  border-radius: var(--raio-cartao);
  overflow: hidden;
  background: #e8e1d3;
}
.sg button {
  padding: 10px;
  text-align: center;
  min-height: 48px;
  border-width: 2px;
}
.sg .on {
  background: var(--anil);
  border-color: var(--anil);
  border-bottom: var(--tecla) solid var(--tecla-anil);
}
.ex button {
  width: auto;
  font-size: 13px;
  border-radius: 999px;
  font-weight: 500;
  min-height: 44px;
  padding: 8px 14px;
  line-height: 1.25;
}

/* ======================================================================
   PARTIDA: PAINEL DO MANDATO
   Duas colunas no computador (.pl painel, .st palco); nome, vidas,
   cargo, estrelas e mandato
   ====================================================================== */
.jg {
  display: flex;
  flex-direction: column;
}
.st {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.hud {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hj {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.hn {
  min-width: 0;
}
.hn span {
  display: block;
  font-size: 13px;
  color: var(--texto2);
  overflow-wrap: anywhere;
}
.hc {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.hc .bx {
  flex: 1;
  min-width: 60px;
}
.md {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 6px;
  font-size: 13px;
  min-width: 0;
}
.md b {
  font-variant-numeric: tabular-nums;
}
.md .bx {
  grid-column: 1/-1;
  height: 10px;
}
.md.lo b, .md.lo span {
  color: var(--vermelho);
}
.md.lo .bx i {
  background: var(--vermelho);
}
.mdm {
  grid-column: 1 / -1;
}
.pl {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 16px;
  gap: 14px;
}
.hn b {
  display: block;
  line-height: 1.2;
  overflow-wrap: anywhere;
  font-size: 17px;
}
.hv {
  flex: none;
  font-size: 15px;
  letter-spacing: 1px;
  white-space: nowrap;
  display: flex;
  gap: 2px;
}
.xv {
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  font-size: 15px;
}
.md span {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--texto2);
}
.md .ico {
  width: 14px;
  height: 14px;
}

/* ======================================================================
   PARTIDA: TABULEIRO
   No celular, uma faixa fina de progresso por etapa; no computador,
   uma serpente de casas
   ====================================================================== */
.tab {
  display: flex;
  gap: 5px;
}
.et {
  flex: 3;
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}
.et.fim {
  flex: 1.6;
}
.en {
  text-align: center;
  font-size: 15px;
  line-height: 1.2;
  opacity: 0.45;
}
.en span {
  display: none;
}
.et.atual .en, .et.feita .en {
  opacity: 1;
}
.tr {
  display: flex;
  gap: 2px;
}
.cs img, .cs .n {
  display: none;
}
.cs {
  flex: 1;
  height: 14px;
  font-size: 0;
  font-style: normal;
  position: relative;
  border: 1px solid var(--borda-botao);
  border-radius: 8px;
  background: var(--painel);
  color: var(--texto2);
}
.cs .ico {
  width: 16px;
  height: 16px;
  vertical-align: middle;
}
.cs.ok {
  background: var(--anil);
  border-color: var(--anil);
  color: #fff;
}
.cs.aqui {
  background: var(--claro);
  border: 2px solid var(--anil);
}
.cs.sn {
  background: var(--fundo);
  font-family: var(--fonte-titulo);
  letter-spacing: 1px;
  color: var(--anil);
}
.en b {
  font-weight: 400;
  color: var(--texto2);
}
.en b .ico {
  width: 16px;
  height: 16px;
}
.et.atual .en b {
  color: var(--anil);
}
.et.atual .en span {
  background: var(--claro);
  color: var(--anil);
  border-radius: 999px;
  font-weight: 700;
}

/* ======================================================================
   PARTIDA: FAIXA DA ETAPA
   Ilustração da etapa (com o Legis) e os textos Etapa / nome / Casa
   ====================================================================== */
.cena > div {
  min-width: 0;
}
.ce, .cc {
  display: block;
  font-size: 12.5px;
}
.ce {
  opacity: 0.85;
}
.cena h1 {
  color: #fff;
  font-size: 32px;
  line-height: 1;
  margin: 4px 0 2px;
}
.cena.ilus {
  position: relative;
  overflow: hidden;
  min-height: 118px;
}
.cena.ilus.gr {
  min-height: 150px;
}
.cena-ilus {
  position: absolute;
  top: 0;
  bottom: 0;
  right: 0;
  left: 36%;
}
.cena-ilus svg {
  display: block;
  width: 100%;
  height: 100%;
}
.cena-ilus::after {
  content: "";
  position: absolute;
  inset: 0;
  /* véu anil sob o texto, para ler sobre a ilustração: a única exceção
     à regra "sem degradê" (ADR-011) */
  background: linear-gradient(90deg, var(--faixa) 0%, rgba(50, 51, 128, 0.55) 14%, rgba(50, 51, 128, 0) 34%); /* taste-skill-ignore */
}
.cena.ilus .cena-tx {
  position: relative;
  z-index: 1;
  max-width: 58%;
}
.cena {
  color: var(--texto-faixa);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  background: var(--faixa);
  border-radius: var(--raio-cartao);
}
.cena .ce {
  font: 600 12px var(--fonte-texto);
  letter-spacing: 0.3px;
  opacity: 0.9;
}
.cena .cc {
  font-weight: 600;
}

/* ======================================================================
   PARTIDA: PERGUNTA E ALTERNATIVAS
   Imprevisto, enunciado, alternativas com letras A–D (riscadas quando
   erradas) e o botão de continuar
   ====================================================================== */
#o .hid {
  opacity: 0.35;
  text-decoration: line-through;
}
#o .x::after {
  font-weight: 500;
  font-size: 13px;
}
.evb {
  display: flex;
  gap: 10px;
  padding: 8px 12px;
  font-size: 14.5px;
  background: var(--claro);
  border-radius: var(--raio-cartao);
  align-items: center;
}
.evb b {
  display: block;
  font: 700 14px var(--fonte-texto);
  color: var(--anil);
}
.evb i {
  font-size: 28px;
  font-style: normal;
  flex: none;
  color: var(--anil);
  display: grid;
  place-items: center;
}
.evb i .ico {
  width: 26px;
  height: 26px;
}
.qc {
  line-height: 1.3;
  font-weight: 700;
}
.qc:focus {
  outline: none; /* recebe o foco depois do OK do pop-up, sem moldura */
}
#o button:hover:not(:disabled) {
  border-color: var(--anil);
}
#o {
  display: grid;
  counter-reset: alt;
}
#o button {
  line-height: 1.3;
  position: relative;
  display: flex;
  align-items: center;
  min-height: 56px;
  padding: 10px 14px 10px 54px;
  border: 2px solid var(--borda-botao);
  border-bottom: var(--tecla) solid var(--tecla-clara);
  border-radius: 14px;
  font-weight: 600;
  transition: transform 0.08s, border-bottom-width 0.08s, border-color 0.12s,
          background-color 0.12s;
}
#o button::before {
  counter-increment: alt;
  content: counter(alt, upper-alpha);
  position: absolute;
  left: 10px;
  top: 50%;
  margin-top: -16px;
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: var(--claro);
  color: var(--anil);
  font: 400 20px/1 var(--fonte-titulo);
  letter-spacing: 0.5px;
}
#o button:active:not(:disabled) {
  transform: translateY(calc(var(--tecla) - 2px));
  border-bottom-width: 2px;
}
#o .okb {
  background: #e3f2e8 !important;
  border-color: #247b50 !important;
  color: #0f3d24 !important;
  border-bottom: var(--tecla) solid #1a5c3a !important;
}
#o .okb::before {
  background: #247b50;
  color: #fff;
}
#o .x {
  text-decoration: line-through;
  background: #fbeeee;
  border-color: #efc9c9;
  color: #8b2b2b;
  opacity: 1;
  transform: translateY(calc(var(--tecla) - 2px));
  border-bottom-width: 2px;
}
#o .x::before {
  background: #f3d6d6;
  color: #8b2b2b;
}
#o .hid::before {
  opacity: 0.5;
}

/* ======================================================================
   PARTIDA: CARTAS DE SORTE OU AZAR
   A carta gira ao aparecer
   ====================================================================== */
.cr {
  padding: 20px 16px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  animation: fl 0.45s ease-out;
}
.cr.bom .tp {
  color: var(--anil-medio);
}
.cr.mau .tp {
  color: var(--vermelho);
}
.cr .fx {
  justify-content: center;
}
.cr h2 {
  color: var(--titulo);
  font-size: 30px;
}
.cr .tp {
  font: 700 13px var(--fonte-texto);
}
.cr .ic {
  font-size: 52px;
  line-height: 1;
  display: grid;
  place-items: center;
  width: 64px;
  height: 64px;
  margin: 6px auto 0;
  border-radius: 50%;
  background: var(--claro);
  color: var(--anil);
}
.cr.mau .ic {
  background: #fbeeee;
  color: #8b2b2b;
}
.cr .ic .ico {
  width: 32px;
  height: 32px;
}

/* ======================================================================
   POP-UP DE ERRO E AVISOS
   Véu escuro (.ov) e o pop-up de Crowder (.corr); .shk faz a tela
   tremer no erro
   ====================================================================== */
.shk {
  animation: sk 0.25s;
}
.ov {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  background: var(--veu);
  display: flex;
  padding: 16px;
  z-index: 20;
  overflow-y: auto;
}
.ov > * {
  margin: auto;
}
.ov .card {
  max-width: 380px;
  width: 100%;
  display: grid;
  gap: 12px;
  text-align: center;
}
.corr .tt b {
  display: block;
  font: 400 30px/1 var(--fonte-titulo);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.corr .cp {
  padding: 16px 18px 18px;
  display: grid;
  gap: 12px;
}
.corr .esc {
  display: grid;
  gap: 3px;
}
.corr .esc s {
  font-weight: 600;
  font-size: 15px;
  color: #8f1f15;
  text-decoration-color: var(--vermelho);
  text-decoration-thickness: 2px;
}
.corr .por small {
  color: var(--anil);
}
.corr #pd {
  font-size: 16.5px;
}
.corr .rf {
  justify-self: start;
  margin: 0;
  background: var(--painel);
}
.corr .go {
  font-size: 18px;
  padding: 14px;
  border-radius: 6px;
}
.corr {
  max-width: 460px;
  background: var(--painel);
  overflow: hidden;
  animation: pin 0.25s ease-out;
  border-radius: var(--raio-cartao);
  box-shadow: 0 16px 40px rgba(29, 31, 51, 0.22); /* o pop-up flutua: único lugar com sombra (taste-skill-ignore) */
}
.corr .tt {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  background: #ffedea;
  color: #831c1e;
  border-bottom: 1px solid #f6cfc9;
}
.corr .tt small {
  display: block;
  color: #831c1e;
}
.corr .xx {
  flex: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font: 900 22px/1 var(--fonte-texto);
  background: var(--vermelho);
  color: #fff;
}
.corr .xx .ico {
  width: 22px;
  height: 22px;
}
.corr small {
  font: 700 13px var(--fonte-texto);
  color: var(--texto2);
}
.corr .por {
  display: grid;
  gap: 6px;
  background: var(--claro);
  padding: 12px 14px;
  border-left: 0;
  border-radius: 12px;
}

/* ======================================================================
   TELA FINAL
   Resultado, certificado da lei, números da partida e Para rever
   ====================================================================== */
.lei {
  outline: 2px solid var(--borda);
  outline-offset: -10px;
  padding: 26px 22px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
}
.lei .lt {
  font: 400 20px var(--fonte-titulo);
  letter-spacing: 2px;
  color: var(--titulo);
}
.lei q {
  font-size: 19px;
  font-weight: 700;
  line-height: 1.3;
  quotes: "“" "”";
  overflow-wrap: anywhere;
}
.lei .au {
  font-size: 14.5px;
  color: var(--texto2);
  overflow-wrap: anywhere;
}
.sel {
  align-self: center;
  font: 400 15px var(--fonte-titulo);
  letter-spacing: 2px;
  color: var(--vermelho);
  border: 1px solid var(--vermelho);
  border-radius: 8px;
  padding: 3px 12px;
  transform: rotate(-5deg);
  margin-top: 4px;
}
.rv {
  display: grid;
  gap: 8px;
}
.rv h2 {
  color: var(--titulo);
}
.rv div {
  background: var(--painel);
  border: 1px solid var(--borda);
  border-radius: 4px;
  padding: 8px 12px;
  font-size: 14px;
}
.rv b {
  display: block;
}
.fimg {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.fimg > div {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}
.big {
  font: 400 48px/1.1 var(--fonte-titulo);
  letter-spacing: 1px;
  text-align: center;
}
.rs {
  display: grid;
  grid-template-columns: repeat(3, 1fr); /* estrelas, vidas e meses */
  gap: 0;
  background: var(--painel);
  border: 1px solid var(--borda);
  border-radius: var(--raio-cartao);
  overflow: hidden;
}
.rs div {
  text-align: center;
  font-size: 13px;
  border-left: 1px solid var(--linha);
  color: var(--texto2);
  padding: 12px 8px;
}
.rs div:first-child {
  border-left: 0;
}
.rs b {
  font: 700 22px var(--fonte-texto);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--texto);
}

/* ======================================================================
   CELULAR (até 859 px): uma coluna, tudo mais compacto
   ====================================================================== */
@media (max-width: 859px) {

  /* --- Cabeçalho, área do jogo e rodapé --- */
  #rod .sky {
    display: none;
  }
  #app {
    padding-block: 8px 16px;
  }
  #top {
    gap: 12px;
    padding-inline: 16px;
  }
  #top .lg {
    display: flex;
    justify-content: flex-start;
  }
  #top .lg img {
    height: 48px;
  }
  #top #mn {
    flex: none;
  }

  /* --- Tela do gabinete --- */
  #proj {
    min-height: 5.6em;
  }

  /* --- Partida: painel do mandato --- */
  .jg, .st {
    gap: 8px;
  }
  .hud {
    gap: 6px;
  }
  .hn span {
    font-size: 12px;
  }
  .md {
    font-size: 12.5px;
  }
  .md .bx {
    height: 7px;
  }

  /* --- Partida: tabuleiro --- */
  .cs .ico {
    display: none;
  }
  .cs {
    border-radius: 4px;
  }
  .cs.aqui {
    border-width: 1px;
    background: var(--anil);
  }

  /* --- Partida: faixa da etapa --- */
  .cena.ilus {
    min-height: 96px;
  }
  .cena.ilus.gr {
    min-height: 112px;
  }
  .cena-ilus {
    left: 50%;
  }
  .cena.ilus .cena-tx {
    max-width: 54%;
  }
  .cena {
    padding: 8px 12px;
    scroll-margin-top: 8px;
  }
  .cena .cc {
    font-size: 11px;
  }

  .cena h1 {
    font-size: 27px;
  }
  .cena.gr {
    padding: 14px 12px;
  }
  .cena.gr h1 {
    font-size: 22px;
  }

  /* --- Partida: pergunta e alternativas --- */
  .st .ms img {
    height: 58px !important;
  }
  .st .bb {
    font-size: 14px;
  }
  .qc {
    font-size: 16.5px;
    padding: 10px 12px;
  }
  #o {
    gap: 7px;
  }
  #o button {
    font-size: 15px;
  }
  .st > .go {
    padding: 12px;
  }
  .evb {
    padding: 6px 10px;
    font-size: 13.5px;
  }
  .evb i {
    font-size: 22px;
  }

  /* --- Pop-up de erro e avisos --- */
  .corr .tt {
    padding: 10px 14px;
  }
  .corr .xx {
    width: 32px;
    height: 32px;
    font-size: 18px;
  }
  .corr .tt b {
    font-size: 25px;
  }
  .corr .cp {
    padding: 12px 14px 14px;
    gap: 10px;
  }
  .corr #pd {
    font-size: 15px;
  }
  .ov {
    padding: 10px;
  }
}

/* ======================================================================
   COMPUTADOR E TABLET DEITADO (a partir de 860 px): duas colunas
   ====================================================================== */
@media (min-width: 860px) {

  /* --- Cabeçalho, área do jogo e rodapé --- */
  .lg img, .home .lg img {
    height: clamp(50px, 7.5vh, 78px);
  }
  #app {
    max-width: 1100px;
    padding-block: clamp(12px, 2.4vh, 24px) 20px;
    padding-inline: 20px;
  }
  #rod {

    <script>

   Listas deste bloco:
     ETAPAS      as 7 etapas da tramitação

/* ----------------------------------------------------------------------

const CASAS = [

const Q = {
protocolo:[

["Quem pode apresentar um projeto de lei na Câmara de Campinas?","Vereadores, comissões, Mesa, Prefeito e população","Somente o Prefeito e os secretários municipais","Somente os vereadores e os líderes de bancada","Somente a Mesa da Câmara e as comissões","A iniciativa é dos vereadores, das comissões, da Mesa, do Prefeito e da população.","RI, art. 143, parágrafo único","O Prefeito tem iniciativa, mas não para tudo. E secretários municipais não apresentam projetos à Câmara.","Vereadores podem propor, mas não são os únicos: comissões, Mesa, Prefeito e a própria população também podem.","Mesa e comissões têm iniciativa, mas os vereadores, o Prefeito e a população também têm."],

["O que é um projeto de lei, segundo o Regimento Interno?","Proposição sujeita à sanção do Prefeito","Uma sugestão ao Prefeito, sem votação","Um pedido de informação","Uma homenagem aprovada pela Mesa","Projeto de lei regula matéria de competência da Câmara e é sujeito à sanção do Prefeito.","RI, art. 143","Sugestão ao Prefeito é a indicação, outro tipo de proposição (RI, art. 129). O projeto de lei é votado e vai à sanção.","Pedido de informação serve para obter dados da administração. Não cria lei e não vai à sanção.","Projeto de lei não é homenagem nem é aprovado só pela Mesa: passa pelas comissões e pelo Plenário e vai à sanção."],

["Projetos de vereadores passam por revisão de técnica legislativa e de português. Em quanto tempo?","Até 5 dias úteis","Até 24 horas","Até 45 dias","Até 6 meses","A revisão leva até 5 dias úteis, contados do dia seguinte ao despacho de admissibilidade.","RI, art. 125, § 8º","24 horas é o prazo de parecer em regime de urgência (RI, art. 79, I), não o da revisão de texto.","45 dias é tempo demais para uma revisão de redação. O Regimento fixa até 5 dias úteis.","Seis meses travariam a tramitação. A revisão é rápida: até 5 dias úteis."]
],
procuradoria:[
["Qual é o papel da Procuradoria e Consultoria da Câmara?","Representação judicial e assessoramento jurídico","Votar os projetos no lugar dos vereadores","Sancionar as leis aprovadas pela Câmara","Organizar as eleições municipais","Ela exerce a representação judicial, a consultoria e o assessoramento técnico-jurídico do Legislativo.","LOM, art. 59","Só os vereadores votam. A Procuradoria orienta juridicamente, mas não decide no lugar deles.","Sancionar é ato do Prefeito (LOM, art. 50). A Procuradoria assessora a Câmara, não sanciona leis.","Eleições são organizadas pela Justiça Eleitoral, não por órgãos da Câmara."],
["Seu projeto cria cargos na Prefeitura e fixa os salários. De quem é a iniciativa dessa matéria?","Exclusiva do Prefeito","De qualquer vereador","Da Mesa da Câmara","De qualquer cidadão","Criar e extinguir cargos na administração e fixar a remuneração é iniciativa exclusiva do Prefeito.","LOM, art. 45, I","Vereadores propõem muitas leis, mas criar cargos na Prefeitura é reservado ao Prefeito. Projeto de vereador sobre isso teria vício de iniciativa.","A iniciativa da Mesa diz respeito à organização da própria Câmara. Os cargos da Prefeitura pertencem ao Executivo.","A iniciativa popular existe, mas exige 5% do eleitorado (LOM, art. 46). E as matérias reservadas ao Prefeito continuam sendo dele."],
["Um projeto cria uma Secretaria Municipal e define suas atribuições. Um vereador pode ser o autor?","Não: a iniciativa é exclusiva do Prefeito","Sim: qualquer vereador pode ser o autor","Sim, com apoio de 1/3 da Câmara","Sim, desde que seja líder de bancada","Criação, estruturação e atribuições das Secretarias são de iniciativa exclusiva do Prefeito.","LOM, art. 45, II","A estrutura das Secretarias é assunto do Executivo. Projeto de vereador sobre isso teria vício de iniciativa.","Apoio de colegas não corrige o vício de iniciativa. Mesmo com muitas assinaturas, a matéria continua sendo do Prefeito.","Ser líder de bancada não dá iniciativa sobre matérias reservadas ao Prefeito."],
["Sobre o que o Município pode legislar?","Assuntos de interesse local","Qualquer assunto, até direito penal","Só o que o Estado autorizar","Somente impostos","O Município legisla sobre o interesse local e pode suplementar a legislação federal e estadual.","LOM, art. 4º","Direito penal é competência da União. O Município legisla sobre assuntos de interesse local.","O Município tem autonomia: não precisa de autorização do Estado para legislar sobre interesse local.","Impostos são só uma parte. O Município legisla sobre todos os assuntos de interesse local."],
["Seu projeto copia o teor de uma lei federal que já existe. O que diz o Regimento?","A proposição não é admitida","É aprovada automaticamente","Vai direto ao Plenário","Basta a assinatura do Prefeito","Não se admite proposição com o mesmo teor de lei estadual ou federal existente.","RI, art. 128, VII","Nenhuma proposição é aprovada automaticamente. E esta nem chega a ser admitida.","Proposição não admitida não tramita, portanto não chega ao Plenário.","A assinatura do Prefeito não resolve o problema: a proposição repete lei existente e não é admitida."],
["Zoneamento urbano e Código de Obras são matérias de qual tipo de lei?","Lei complementar","Lei ordinária","Decreto legislativo","Resolução","São matérias de lei complementar, aprovada por maioria absoluta dos membros da Câmara.","LOM, art. 41","A LOM reserva esses temas à lei complementar, que exige maioria absoluta. As regras da lei ordinária não bastam.","Decreto legislativo não trata de zoneamento nem de Código de Obras. Essas matérias exigem lei complementar.","Resolução cuida de assuntos internos da Câmara. Zoneamento e Código de Obras pedem lei complementar."],
["Quantos eleitores precisam assinar um projeto de lei de iniciativa popular?","No mínimo 5% do eleitorado","No mínimo 1% do eleitorado","No mínimo 100 moradores","Metade da população da cidade","A iniciativa popular exige a assinatura de pelo menos 5% do eleitorado do Município.","LOM, art. 46","1% do eleitorado é o número para requerer audiência pública (RI, art. 85, § 2º), não para propor lei.","O critério é proporcional ao eleitorado, não um número fixo de moradores.","Metade da população inviabilizaria a iniciativa popular. A LOM exige 5% do eleitorado."],
["A proposição é manifestamente inconstitucional. O que o Regimento prevê?","Não é admitida e volta ao autor","Tramita normalmente","É votada em regime de urgência","Vai direto ao Prefeito","O Presidente restitui a proposição ao autor com justificativa fundamentada por escrito.","RI, art. 128, I e § 1º","Proposição manifestamente inconstitucional não deve tramitar. O Presidente a devolve ao autor.","A urgência não corrige inconstitucionalidade. A proposição nem é admitida.","O Prefeito só recebe projetos aprovados. Esta proposição é barrada antes de tramitar."],
["Depois do despacho do Presidente, a classificação do projeto ainda pode mudar?","Só com parecer da Procuradoria Legislativa","Sim, sempre que o autor do projeto quiser","Não: a classificação nunca pode mudar","Só por decisão do Prefeito, por decreto","A mudança depende de parecer justificado da Procuradoria Legislativa, acatado pela Presidência.","RI, art. 125, § 7º","O autor não altera sozinho a classificação. É preciso parecer justificado da Procuradoria Legislativa.","A classificação pode mudar, sim, desde que haja parecer justificado acatado pela Presidência.","Decreto do Prefeito não interfere na tramitação interna da Câmara."],
["Regime jurídico e aposentadoria dos servidores: quem pode propor lei sobre isso?","Somente o Prefeito","Qualquer vereador","Qualquer comissão","Somente a Mesa da Câmara","É matéria de iniciativa exclusiva do Prefeito.","LOM, art. 45, III","Regime jurídico dos servidores é matéria reservada ao Prefeito. Projeto de vereador teria vício de iniciativa.","Comissões têm iniciativa, mas não sobre matérias reservadas ao Prefeito.","A Mesa cuida da organização da própria Câmara. O regime dos servidores municipais é iniciativa do Prefeito."]
],
ccl:[
["Quantos membros tem a Comissão de Constituição e Legalidade?","7","5","3","11","Todas as comissões permanentes têm 5 membros, exceto a de Constituição e Legalidade, que tem 7.","RI, art. 39","5 é o número das demais comissões permanentes. A de Constituição e Legalidade é a exceção, com 7.","Nenhuma comissão permanente tem 3 membros. A CCL tem 7.","11 é mais do que o Regimento prevê. A CCL tem 7 membros."],
["O que a Comissão de Constituição e Legalidade examina nas proposições?","Aspectos constitucional, legal, regimental e formal","Apenas o custo do projeto para o Município","A popularidade do autor entre os eleitores","Somente a ortografia e a gramática do texto","Ela opina sobre os aspectos constitucional, legal, regimental e formal das proposições.","RI, art. 40, I, a","O custo é tema da Comissão de Finanças e Orçamento (RI, art. 41). A CCL examina a constitucionalidade e a legalidade.","Comissões não avaliam pessoas: a CCL analisa o texto da proposição à luz da Constituição, das leis e do Regimento.","A revisão de português é feita logo após o despacho (RI, art. 125, § 8º). A CCL examina aspectos jurídicos e formais."],
["O projeto precisa de parecer da CCL e da Comissão de Finanças. Em que ordem elas são ouvidas?","CCL primeiro, Finanças por último","Finanças primeiro, CCL por último","As duas ao mesmo tempo, sempre","A ordem é decidida por sorteio","Constituição e Legalidade é ouvida em primeiro lugar e Finanças e Orçamento em último.","RI, art. 76, § 2º","É o contrário: primeiro se verifica se o projeto é jurídico, e só no fim se olha o orçamento.","As comissões são ouvidas em ordem, não ao mesmo tempo.","A ordem é fixada pelo Regimento, não sorteada."],
["Em tramitação ordinária, qual é o prazo da comissão para emitir parecer?","10 dias","24 horas","45 dias","6 meses","São 10 dias na tramitação ordinária, contados da entrada do processo na comissão.","RI, art. 79, II e § 1º","24 horas é o prazo para matérias em regime de urgência (RI, art. 79, I).","45 dias não é o prazo regimental de parecer. Na tramitação ordinária, são 10 dias.","Seis meses travariam a tramitação. O prazo ordinário é de 10 dias."],
["A CCL concluiu que o projeto é inconstitucional. O que acontece?","Vai ao arquivo, salvo recurso de 1/3 dos vereadores","Segue normalmente para a votação em Plenário","O Prefeito decide se o projeto continua","Volta ao protocolo para receber novo número","A proposição vai ao arquivo, salvo recurso de 1/3 dos vereadores em até 10 dias.","RI, art. 170, § 1º","O parecer pela inconstitucionalidade interrompe a tramitação. O projeto só chega ao Plenário se 1/3 dos vereadores recorrer.","A tramitação dentro da Câmara é decidida pela própria Câmara. O Prefeito só se manifesta depois da aprovação.","O projeto não é renumerado nem recomeça. Sem recurso, ele vai ao arquivo."],
["Para o Plenário rejeitar um parecer contrário da CCL, quantos votos são necessários?","2/3 dos membros da Câmara","Maioria dos presentes","Apenas o voto do Presidente","Unanimidade","O parecer só é rejeitado com o voto contrário de 2/3 dos membros da Câmara.","RI, art. 170, § 3º","Maioria dos presentes não basta: rejeitar o parecer da CCL exige quórum mais alto, 2/3 dos membros.","Um voto só não derruba o parecer de uma comissão. É preciso 2/3 dos membros da Câmara.","Não é preciso unanimidade: 2/3 dos membros bastam."],
["Quais são as três partes de um parecer de comissão?","Relatório, voto do relator e decisão da comissão","Título, ementa e assinatura dos vereadores","Abertura, debate e encerramento da reunião","Protocolo, despacho do Presidente e autógrafo","O parecer tem relatório, voto fundamentado do relator e decisão da comissão.","RI, art. 78, § 1º","Título e ementa são partes do projeto, não do parecer.","Abertura, debate e encerramento descrevem uma reunião, não a estrutura de um parecer.","Protocolo, despacho e autógrafo são momentos da tramitação, não partes do parecer."],
["Em regime de urgência, qual é o prazo da comissão para dar parecer?","24 horas","10 dias","5 dias úteis","30 dias","Nas matérias em regime de urgência, as comissões têm 24 horas para o parecer.","RI, art. 79, I","10 dias é o prazo da tramitação ordinária. Na urgência, cai para 24 horas.","5 dias úteis é o prazo da revisão de texto (RI, art. 125, § 8º), não do parecer em urgência.","30 dias não seria urgência. O prazo é de 24 horas."],
["Qual comissão apresenta o texto final das proposições que receberam emendas?","Constituição e Legalidade","Finanças e Orçamento","Política Urbana","Legislação Participativa","Em regra, cabe à Comissão de Constituição e Legalidade apresentar o texto final.","RI, art. 40, II","Finanças faz a redação final da lei orçamentária (RI, art. 41, II), mas, em regra, o texto final cabe à CCL.","Política Urbana analisa o mérito de temas urbanos (RI, art. 42), não o texto final das proposições.","Legislação Participativa não é a responsável pelo texto final. Em regra, é a CCL."],
["O parecer do relator não foi acolhido pela comissão. O que ele passa a ser?","Voto em separado","Veto da comissão","Emenda supressiva","Moção de repúdio","O parecer não acolhido pela comissão constitui voto em separado.","RI, art. 80, § 2º","Veto é ato do Prefeito (LOM, art. 51), não das comissões.","Emenda supressiva retira parte de um texto (RI, art. 148). O parecer vencido não vira emenda.","Moção é uma manifestação da Câmara, não o destino de um parecer rejeitado."]
],
tematicas:[
["Quantas comissões permanentes a Câmara de Campinas tem?","22","5","10","33","O Regimento lista 22 comissões permanentes, de Constituição e Legalidade a Cultura.","RI, art. 39","5 é o número de membros da maioria das comissões, não o número de comissões.","São mais de 10: o Regimento lista 22 comissões permanentes.","33 é o número de vereadores de Campinas (LOM, art. 6º), não de comissões."],
["Seu projeto trata de saúde pública. Qual comissão opina sobre o mérito?","Política Social e Saúde","Política Urbana","Educação e Esporte","Relações Internacionais","Saúde pública e assistência social são temas da Comissão de Política Social e Saúde.","RI, art. 43, a","Política Urbana cuida de zoneamento, uso do solo e urbanização (RI, art. 42).","Educação e Esporte cuida de ensino, esporte e nomes de logradouros (RI, art. 45).","Relações Internacionais não trata de saúde pública. O tema é da Comissão de Política Social e Saúde."],
["Um projeto para dar nome a uma praça vai para qual comissão?","Educação e Esporte","Finanças e Orçamento","Meio Ambiente","Segurança Pública","A denominação de próprios, vias e logradouros públicos cabe à Comissão de Educação e Esporte.","RI, art. 45, a, e art. 189","Dar nome a uma praça não altera receita nem despesa, então não depende de Finanças.","Mesmo sendo uma praça, a denominação de logradouros não é tema da Comissão de Meio Ambiente.","Segurança Pública não trata de nomes de logradouros."],
["Como as comissões tomam suas decisões?","Por maioria simples de votos","Por unanimidade","Por sorteio","Por decisão do Prefeito","As comissões deliberam por maioria simples. No empate, o presidente da comissão tem voto de qualidade.","RI, art. 74, §§ 1º e 2º","Não é preciso unanimidade. Basta maioria simples, e no empate o presidente da comissão desempata.","Decisões de comissão são votadas, não sorteadas.","As comissões são órgãos da Câmara. O Prefeito não decide por elas."],
["A comissão perdeu o prazo e não deu parecer. O que você, autor, pode pedir?","Um relator especial","A aprovação automática do projeto","Um parecer do Prefeito","A extinção da comissão","Esgotado o prazo sem parecer, o Presidente da Câmara designa relator especial.","RI, art. 81","Prazo perdido não aprova o projeto. O Presidente designa um relator especial para dar o parecer.","O Prefeito não emite pareceres nas comissões da Câmara.","Atraso não extingue a comissão. A solução é o relator especial."],
["Um membro da comissão pede vista do projeto, em tramitação ordinária. Por quanto tempo, no máximo?","5 dias","60 dias","6 meses","Não há limite","A vista nas comissões é de até 5 dias para os membros e de até 20 dias para o autor.","RI, art. 77","60 dias seria um atraso enorme. A vista nas comissões é de até 5 dias para os membros.","Seis meses travariam a comissão. O prazo é de até 5 dias.","Há limite, sim: até 5 dias para os membros e até 20 dias para o autor."],
["O projeto foi a mais de uma comissão de mérito e recebeu apenas pareceres contrários. E agora?","É considerado rejeitado e arquivado","Vai direto à votação no Plenário","É enviado ao Prefeito para decidir","Volta ao protocolo com novo número","Proposição que só recebe parecer contrário das comissões de mérito é rejeitada e arquivada.","RI, art. 145","Com parecer contrário de todas as comissões de mérito, o projeto não segue ao Plenário: é arquivado.","O Prefeito não decide sobre a tramitação dentro da Câmara.","Não há novo número: o projeto é considerado rejeitado e arquivado."],
["As reuniões das comissões são:","Públicas","Secretas","Restritas aos líderes","Fechadas à imprensa","As reuniões das comissões são públicas.","RI, art. 71","O Regimento determina que as reuniões das comissões sejam públicas.","Qualquer pessoa pode acompanhar: as reuniões são públicas, não restritas aos líderes.","A imprensa pode acompanhar, porque as reuniões são públicas."],
["Para qual destes projetos a audiência pública é obrigatória?","Plano Diretor","Nome de rua","Data comemorativa","Título de cidadania","Plano Diretor, orçamento, zoneamento e transportes públicos estão entre os casos obrigatórios.","RI, art. 85","Nome de rua não está entre os casos de audiência pública obrigatória.","Data comemorativa não exige audiência pública obrigatória.","Título de cidadania é homenagem e não exige audiência pública."],
["Com quantos membros presentes começa uma reunião de comissão?","A maioria dos membros","Todos os membros","Apenas o presidente","Qualquer número","As reuniões das comissões são iniciadas com a presença da maioria de seus membros.","RI, art. 73","Não é preciso que todos estejam presentes: basta a maioria.","O presidente sozinho não abre a reunião. É preciso a maioria dos membros.","Há quórum mínimo: a maioria dos membros."],
["Um projeto sobre zoneamento e uso do solo vai para qual comissão?","Política Urbana","Política Social e Saúde","Educação e Esporte","Da Mulher","Urbanização, zoneamento e uso e ocupação do solo são temas da Comissão de Política Urbana.","RI, art. 42, I, a","Política Social e Saúde cuida de saúde e assistência social (RI, art. 43).","Educação e Esporte cuida de ensino, esporte e nomes de logradouros (RI, art. 45).","A Comissão da Mulher não analisa zoneamento e uso do solo."]

financas:[
["Quais projetos passam pela Comissão de Finanças e Orçamento?","Os que alteram despesa ou receita do Município","Somente os projetos de autoria do Prefeito","Os que dão nome a ruas, praças e prédios","Os que criam datas comemorativas na cidade","Ela opina sobre matérias tributárias e as que alterem a despesa ou a receita do Município.","RI, art. 41, I, a","O critério é o efeito financeiro, não o autor. Projeto de vereador que mexe com despesa também passa por Finanças.","Nome de rua não altera receita nem despesa. Vai à Comissão de Educação e Esporte (RI, art. 45).","Datas comemorativas, em regra, não mexem com o orçamento."],
["Seu projeto cria despesa nova. Sem o quê a Mesa não pode aceitá-lo?","Indicação dos recursos disponíveis","Assinatura de todos os vereadores","Aprovação prévia do Prefeito","Parecer do Tribunal de Contas","Projeto que cria ou aumenta despesa precisa indicar os recursos para os novos encargos.","LOM, art. 48","Não é preciso a assinatura de todos os vereadores. O que falta é dizer de onde virá o dinheiro.","Não há aprovação prévia do Prefeito. A exigência é indicar os recursos para a nova despesa.","O Tribunal de Contas fiscaliza as contas, mas não dá parecer prévio para admitir projetos."],
["Quem elabora a redação final do projeto da lei orçamentária?","A Comissão de Finanças e Orçamento","A Comissão de Educação e Esporte","A Procuradoria","O gabinete do autor","A redação final da lei orçamentária cabe à Comissão de Finanças e Orçamento.","RI, art. 41, II, a","Educação e Esporte não cuida do orçamento.","A Procuradoria assessora juridicamente (LOM, art. 59), mas a redação final do orçamento cabe à Comissão de Finanças.","O autor não redige sozinho a redação final. Ela é da Comissão de Finanças e Orçamento."],
["A legislação tributária do Município é matéria de qual tipo de lei?","Lei complementar","Lei ordinária","Decreto legislativo","Resolução","Legislação tributária é matéria de lei complementar.","LOM, art. 41, parágrafo único, I","A LOM reserva a legislação tributária à lei complementar.","Decreto legislativo não serve para criar ou alterar tributos.","Resolução cuida de assuntos internos da Câmara, não de tributos."],
["Em regra, a Câmara pode aumentar a despesa prevista em projeto de iniciativa exclusiva do Prefeito?","Não","Sim, sem limite","Sim, até o dobro","Só com urgência aprovada","Não se admite aumento da despesa nos projetos de iniciativa exclusiva do Prefeito, salvo exceções do orçamento.","LOM, art. 47","Não há liberdade para aumentar: nos projetos de iniciativa exclusiva do Prefeito, a Câmara não pode criar despesa maior.","Nenhum percentual é permitido como regra. O aumento é vedado, salvo exceções do orçamento.","A urgência só acelera a tramitação. Não libera aumento de despesa."],
["Além dos projetos, o que mais a Comissão de Finanças e Orçamento analisa?","Os balancetes da Prefeitura e da Câmara","Os nomes das ruas e praças da cidade","Os títulos de cidadania campineira","As atas das reuniões do Plenário","Ela analisa o balancete dos órgãos da administração municipal e da Câmara.","RI, art. 41, III","Nomes de ruas são tema da Comissão de Educação e Esporte (RI, art. 45).","Títulos de cidadania são homenagens, sem relação com contas públicas.","As atas são aprovadas em Plenário, não analisadas pela Comissão de Finanças."],
["Projetos que fixam salários e benefícios dos servidores recebem parecer de qual comissão?","Finanças e Orçamento","Educação e Esporte","Meio Ambiente","Relações Internacionais","A Comissão de Finanças e Orçamento opina sobre salários, vantagens e benefícios dos servidores.","RI, art. 41, I, c","Salários e benefícios mexem com a despesa. Por isso, a comissão é a de Finanças.","Meio Ambiente não trata de remuneração de servidores.","Relações Internacionais não trata de salários de servidores."],
["Plano Plurianual, Diretrizes Orçamentárias e Orçamento anual exigem, na tramitação:","Pelo menos uma audiência pública","Plebiscito com todos os eleitores","Votação secreta no Plenário","Aprovação por unanimidade","A audiência pública é obrigatória para esses projetos.","RI, art. 85, II a IV","Plebiscito não é etapa obrigatória do orçamento. O que se exige é audiência pública.","Votação secreta não é regra do orçamento. A exigência é ouvir a população em audiência.","Unanimidade não é exigida. O que o Regimento obriga é pelo menos uma audiência pública."],
["Quando a matéria depende da CCL e de Finanças, em que momento Finanças opina?","Por último","Em primeiro lugar","Antes do protocolo","Depois da sanção","A Comissão de Finanças e Orçamento é ouvida em último lugar.","RI, art. 76, § 2º","Quem é ouvida primeiro é a CCL. Finanças fecha a sequência.","Antes do protocolo, o projeto nem existe na Câmara.","Depois da sanção, o projeto já virou lei. As comissões atuam antes."],
["A Câmara decide sobre isenções e anistias fiscais do Município?","Sim, cabe a ela autorizar","Não, só o Prefeito decide","Não, só o Estado decide","Só em ano eleitoral","Cabe à Câmara legislar sobre o sistema tributário e autorizar isenções e anistias fiscais.","LOM, art. 7º, II","O Prefeito propõe e executa, mas autorizar isenções e anistias é atribuição da Câmara.","Os tributos municipais são do Município. O Estado não decide sobre eles.","Não há relação com ano eleitoral. É uma atribuição permanente da Câmara."]
],
