{bom:1,ic:'coracao',nome:'Assessoria reforçada',txt:'Sua equipe revisou tudo com cuidado. Ganhe 1 vida.',fx:{vida:1}},
{bom:1,ic:'avancar',nome:'Pauta livre',txt:'A pauta andou rápido nesta semana. Ganhe 3 meses de mandato.',fx:{mes:3}},
{bom:0,ic:'pausa',nome:'Pedido de vista',txt:'Um colega pediu vista do processo (RI, art. 166). Perca 3 meses de mandato.',fx:{mes:-3}},
{bom:0,ic:'duvida',nome:'Questionamento jurídico',txt:'Surgiu uma dúvida sobre a legalidade. Responda uma pergunta extra.',fx:{extra:1}},
{bom:0,ic:'sol',nome:'Recesso parlamentar',txt:'Durante o recesso (LOM, art. 52), o projeto fica parado, mas o mandato continua correndo. Perca 2 meses de mandato.',fx:{mes:-2}},
{bom:0,ic:'jornal',nome:'Manchete negativa',txt:'Um jornal criticou o projeto sem ouvir você, e a polêmica atrasou a pauta. Perca 2 meses de mandato.',fx:{mes:-2}},
{bom:0,ic:'cadeira',nome:'Falta de quórum',txt:'Sem quórum, a reunião foi encerrada (RI, art. 172, § 2º). Perca 2 meses de mandato.',fx:{mes:-2}}
];


/* ----------------------------------------------------------------------
   CARGOS: [estrelas mínimas, nome masculino, nome feminino], em ordem
   crescente. Vale o último degrau já alcançado. Uma partida perfeita
   rende cerca de 57 estrelas (17 acertos × 3 + bônus das vidas).
   ---------------------------------------------------------------------- */
const CARGOS = [[0,'Vereador Iniciante','Vereadora Iniciante'],[8,'Vereador Experiente','Vereadora Experiente'],[18,'Presidente de Comissão','Presidente de Comissão'],[30,'Líder de Bancada','Líder de Bancada'],[42,'Presidente da Câmara','Presidente da Câmara'],[52,'Mestre do Processo Legislativo','Mestra do Processo Legislativo']];


/* ----------------------------------------------------------------------
   REGRAS: os números do jogo
     vidas          vidas no início (e o máximo)
     meses          meses de mandato (a legislatura dura 4 anos)
     custoAcerto    meses gastos numa resposta certa
     custoErro      meses gastos numa resposta errada
     consultas      consultas à Procuradoria por partida
     custoConsulta  meses gastos em cada consulta (0 = grátis)
     estrelas       estrelas do acerto na 1ª, 2ª, 3ª e 4ª tentativas
   ---------------------------------------------------------------------- */
const REGRAS = {vidas:5,meses:48,custoAcerto:1,custoErro:2,consultas:3,custoConsulta:0,estrelas:[3,2,1,0]};


/* ----------------------------------------------------------------------
   COMO_JOGAR: um cartão por assunto: ic (ícone), img (faixa de FAIXAS usada
     como ilustração), t (título), txt (texto curto)
   EXEMPLOS: projetos sugeridos no gabinete, para quem não quer digitar
   ---------------------------------------------------------------------- */
const COMO_JOGAR = [
{ic:'camara',img:'protocolo',t:'Leve sua lei até o fim',txt:'Seu projeto passa por 7 etapas, do Protocolo até a sanção do Prefeito.'},
{ic:'confere',img:'procuradoria',t:'Acerte para andar',txt:'Cada acerto leva o Legis uma casa à frente. Errou? Leia a explicação e tente de novo. Na dúvida, a Procuradoria esconde uma alternativa errada.'},
{ic:'estrela',img:'tematicas',t:'Estrelas e vidas',txt:'Acertou de primeira, ganha 3 estrelas. O primeiro erro de cada pergunta custa 1 vida. A cada etapa nova, você recupera uma.'},
{ic:'ampulheta',img:'plenario',t:'O tempo corre',txt:'O mandato tem 48 meses: cada acerto gasta 1 mês e cada erro, 2. Sem vidas, ou errando sem tempo, a partida acaba.'}
];

/* ----------------------------------------------------------------------
   VETO: em 1 de cada 3 partidas o Prefeito veta o projeto, e a Câmara
   derruba o veto respondendo uma destas perguntas. Hoje reaproveita as
   perguntas da Prefeitura que falam de veto; para usar perguntas próprias,
   troque por uma lista no mesmo formato de Q.
   ---------------------------------------------------------------------- */
const VETO = Q.prefeitura.filter(q => /vet/i.test(q[0]));

const EXEMPLOS = ['Institui a Semana Municipal da Leitura nas escolas','Cria o programa Praça Viva de cuidado com as praças','Institui o Dia Municipal do Skate'];
    </script>

    <!-- 4. MOTOR ========================================================== -->
    <script>
/* ======================================================================
   MOTOR DO JOGO
   ----------------------------------------------------------------------
   Lê o CONTEÚDO (bloco anterior) e aplica as regras. Para trocar
   perguntas, eventos ou cartas NÃO é preciso mexer aqui.

   Como o motor funciona, em uma frase: tudo o que a partida precisa
   lembrar fica no objeto G; cada clique chama uma ação (ACT), a ação
   muda G e render() redesenha a tela inteira a partir de G.

   Blocos deste script, na ordem:
     1. Ferramentas      pequenas funções usadas em todo lugar
     2. Caderneta (P)    o que fica salvo no aparelho
     3. Comanda (G)      o estado da partida
     4. Pergunta atual   sorteio da pergunta e das alternativas
     5. Efeitos          estrelas, vidas, meses e derrota
     6. Fluxo da partida iniciar → entrar → desafio → responder → continuar
     7. Telas            funções v...() que devolvem o HTML de cada tela
     8. Ações e eventos  o que cada botão faz
   ====================================================================== */


/* ======================================================================
   1. FERRAMENTAS
   ====================================================================== */

// $('#id') encontra um elemento; app é a área onde o jogo é desenhado.
const $ = s => document.querySelector(s),
  app = $('#app');

// Segurança: troca & < > " ' por códigos de HTML, para que um texto
// digitado (nome, projeto) nunca vire código na página.
const esc = s =>
  String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

// Sorteio: rnd(n) dá um inteiro de 0 a n − 1; sh(lista) devolve uma
// cópia embaralhada (método de Fisher-Yates).
const rnd = n => Math.floor(Math.random() * n);
const sh = a => {
  a = [...a];
  for (let i = a.length - 1; i > 0; i--) {
    const j = rnd(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

// Posição da Sanção: logo depois da última casa (21). Se casas forem
// acrescentadas em CASAS, a Sanção se ajusta sozinha.
const FIM = CASAS.length;

// Bipe curto feito pelo próprio navegador (f = frequência, d = duração),
// sem arquivos de som: agudo no acerto, grave no erro.
let AC;
const beep = (f, d = 0.1) => {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(),
      g = AC.createGain();
    o.frequency.value = f;
    o.type = 'square';
    g.gain.value = 0.05;
    o.connect(g);
    g.connect(AC.destination);
    o.start();
    o.stop(AC.currentTime + d);
  } catch (e) {}
};

// Põe o foco num elemento logo depois de redesenhar (uso pelo teclado).
const focar = sel =>
  setTimeout(() => {
    const el = $(sel);
    if (el) el.focus();
  }, 0);


/* ======================================================================
   2. CADERNETA DO APARELHO (P): o que fica salvo
   ----------------------------------------------------------------------
   Guarda SÓ: recorde de estrelas (bestE), leis sancionadas (leis) e o
   último nome digitado (nome). Fica no próprio
   navegador (localStorage, chave "jv1") e nunca é enviada para fora.
   O try/catch deixa o jogo funcionar mesmo com o armazenamento bloqueado
   (janela anônima). apagarDados() atende ao botão "Apagar meus dados".
   ====================================================================== */
const P_VAZIA = { leis: 0, nome: '' };
let P = { ...P_VAZIA };
try {
  Object.assign(P, JSON.parse(localStorage.getItem('jv1') || '{}'));
} catch (e) {}
const save = () => {
  try {
    localStorage.setItem('jv1', JSON.stringify(P));
  } catch (e) {}
};


/* ======================================================================
   3. COMANDA DA PARTIDA (G): o estado do jogo
   ----------------------------------------------------------------------
   Fora da partida, G só tem os dados das telas de entrada:
     tela   'inicio', 'como', 'menu', 'jogo' ou 'fim'
     passo  cartão do Como jogar (0 a 3)
     trat   'a' = Vereadora, 'o' = Vereador, '' = ainda não escolheu
     nome, proj, err   formulário do gabinete e a mensagem de erro dele
   Durante a partida, iniciar() cria a comanda completa:
     num, ano            número fictício do projeto (PL nº num/ano)
     pos                 casa atual (0 = primeira; FIM = Sanção)
     vidas, mes, estrelas, cons   indicadores (cons = consultas restantes)
     fase                'etapa' (apresentação), 'q' (pergunta aberta),
                         'resp' (acertou) ou 'carta'
     q                   pergunta atual: origem (src), lista (pool) ou
                         evento (ev), posição (k), ordem das alternativas
                         (ops), tentativas (tent), erradas já escolhidas
                         (desc) e a entrada em Para rever (err)
     hid                 alternativas escondidas pela consulta
     corr                pop-up de erro aberto (só o OK fecha)
     resp                dados do acerto (alternativa, tentativa, efeitos)
     carta, cartaFx      carta sorteada e seus efeitos reais
     mov                 casas a andar ao continuar (0 ou 1)
     veto, vetoDerrubado o Prefeito vai vetar? (sorteado no início) e se
                         a Câmara já derrubou o veto
     vidaEtapa           vida recuperada ao entrar na etapa (efeitos)
     perdeu              motivo da derrota [título, texto] ou null
     subiu               índice do novo cargo, ou -1
     vistos              perguntas já sorteadas, por lista
     evUsados, ctUsadas  eventos e cartas já sorteados
     etapaVista          última etapa já apresentada
     acertos, perguntas  acertos de 1ª e perguntas respondidas
     erros               lista Para rever: [enunciado, certa, fonte, [marcadas]]
     sair                aviso "Sair da partida?" aberto
     win, motivo, bonus, novoRecorde   dados da tela final
   ====================================================================== */
let G = { tela: 'inicio', passo: 0, trat: '', nome: P.nome || '', proj: '', err: '' };

// Atalhos de leitura da comanda.
const tit = () => (G.trat == 'a' ? 'Vereadora' : 'Vereador');
const casa = () => CASAS[Math.min(G.pos, FIM - 1)]; // Math.min: na Sanção, lê a última casa
const etapa = () => ETAPAS[casa().e];
// Cargo atual = último degrau de CARGOS cujo mínimo de estrelas já foi alcançado.
const cargo = (e = G.estrelas) => {
  let i = 0;
  CARGOS.forEach((r, k) => {
    if (e >= r[0]) i = k;
  });
  return i;
};
const nomeCargo = i => CARGOS[i][G.trat == 'a' ? 2 : 1];
// Estrelas do acerto conforme a tentativa: 1ª = 3, 2ª = 2, 3ª = 1, depois 0.
const estrelasDaTentativa = t => REGRAS.estrelas[Math.min(t, REGRAS.estrelas.length) - 1];


/* ======================================================================
   4. PERGUNTA ATUAL
   ----------------------------------------------------------------------
   novaPergunta(origem) escolhe a pergunta e prepara a comanda:
     'etapa'  → lista da etapa em Q
     'extra'  → lista procuradoria ou ccl (carta Questionamento jurídico)
     'evento' → lista qs do evento sorteado
     'veto'   → lista VETO (quando o Prefeito veta)
   sorteia() não repete pergunta até a lista acabar. A ordem das
   alternativas é embaralhada uma vez e mantida nas novas tentativas.
   ====================================================================== */
function cur() {
  const q = G.q;
  return q.src == 'evento' ? EVENTOS[q.ev].qs[q.k] : q.src == 'veto' ? VETO[q.k] : Q[q.pool][q.k];
}
function sorteia(chave, total) {
  const v = G.vistos[chave] || (G.vistos[chave] = []); // índices já sorteados desta lista
  if (v.length >= total) v.length = 0; // todos já saíram: recomeça
  const livres = [...Array(total).keys()].filter(i => !v.includes(i));
  const k = livres[rnd(livres.length)];
  v.push(k);
  return k;
}
function novaPergunta(src, ev) {
  if (src == 'etapa') {
    const pool = etapa().id;
    G.q = { src, pool, k: sorteia(pool, Q[pool].length) };
  } else if (src == 'extra') {
    const pool = rnd(2) ? 'procuradoria' : 'ccl';
    G.q = { src, pool, k: sorteia(pool, Q[pool].length) };
  } else if (src == 'veto') G.q = { src, k: sorteia('veto', VETO.length) };
  else G.q = { src, ev, k: sorteia('ev' + ev, EVENTOS[ev].qs.length) };
  // 1 = certa; 2, 3 e 4 = erradas
  Object.assign(G.q, { ops: sh([1, 2, 3, 4]), tent: 0, desc: [], err: null });
  Object.assign(G, { hid: [], resp: null, corr: null, fase: 'q' });
}


/* ======================================================================
   5. EFEITOS E DERROTA
   ----------------------------------------------------------------------
   aplicar(fx) soma na comanda uma ficha de efeitos, por exemplo
   { estrela: 3, mes: -2 }, respeitando os limites (nada fica negativo;
   vidas no máximo REGRAS.vidas) e devolve o que REALMENTE mudou, para as
   etiquetas da tela baterem com o painel. Também detecta subida de cargo.
   derrota() devolve o motivo [título, texto] ou null.
   chips() desenha as etiquetas de efeito (+3 estrelas, −1 vida...).
   ====================================================================== */
function aplicar(fx) {
  const antes = cargo(),
    e0 = G.estrelas,
    m0 = G.mes,
    v0 = G.vidas;
  if (fx.estrela) G.estrelas = Math.max(0, G.estrelas + fx.estrela);
  if (fx.mes) G.mes = Math.max(0, G.mes + fx.mes);
  if (fx.vida) G.vidas = Math.max(0, Math.min(REGRAS.vidas, G.vidas + fx.vida));
  G.subiu = cargo() > antes ? cargo() : -1;
  return { estrela: G.estrelas - e0, mes: G.mes - m0, vida: G.vidas - v0, cheio: fx.vida > 0 && G.vidas == v0 };
}
function derrota() {
  if (G.vidas <= 0)
    return ['SEM VIDAS', 'Seu gabinete errou demais e perdeu o fôlego. O projeto ficou parado na casa ' + (G.pos + 1) + '.'];
  if (G.mes <= 0)
    return ['FIM DO MANDATO', 'O tempo do mandato acabou antes da sanção: são 48 meses, porque a legislatura dura quatro anos (LOM, art. 6º, § 1º).'];
  return null;
}
function chips(fx) {
  const o = [],
    s = v => (v > 0 ? '+' : '−') + Math.abs(v), // número com sinal: +3, −2
    c = v => (v > 0 ? 'up' : 'dn'), // verde (ganho) ou vermelho (perda)
    pl = (v, um, varios) => (Math.abs(v) == 1 ? um : varios);
  if (fx.estrela) o.push(`<span class="${c(fx.estrela)}">${ico('estrela', 'est')}${s(fx.estrela)} ${pl(fx.estrela, 'estrela', 'estrelas')}</span>`);
  if (fx.vida) o.push(`<span class="${c(fx.vida)}">${ico('coracao', 'vida')}${s(fx.vida)} ${pl(fx.vida, 'vida', 'vidas')}</span>`);
  if (fx.cheio) o.push(`<span>${ico('coracao', 'vida')}vidas já estão cheias</span>`);
  if (fx.mes) o.push(`<span class="${c(fx.mes)}">${ico('ampulheta')}${s(fx.mes)} ${pl(fx.mes, 'mês', 'meses')}</span>`);
  if (G.subiu >= 0) o.push(`<span class="nv">Novo cargo: ${nomeCargo(G.subiu)}</span>`);
  return `<div class="fx">${o.join('')}</div>`;
}


/* ======================================================================
   6. FLUXO DA PARTIDA
   ----------------------------------------------------------------------
     iniciar()     confere o formulário e cria a comanda (e sorteia se
        ↓          o Prefeito vai vetar)
        ↓
     entrar()      chegou a uma casa: Sanção? etapa nova? senão, desafio
        ↓
     desafio()     o que a casa traz: pergunta, evento ou carta
        ↓
     responder()   corrige (modelo de Crowder: erro abre o pop-up e a
        ↓          mesma pergunta continua; acerto dá estrelas)
     continuar()   anda com o peão e volta a entrar()
        ↓
     depois da última casa: veto? → pergunta do veto → vitória
     vitoria() ou derrota  →  fimDeJogo()  →  tela final
   consultar() pode ser usada com uma pergunta aberta.
   ====================================================================== */

// Começo da partida: nome com 2+ letras e projeto com 5+ letras.
function iniciar() {
  const nome = G.nome.trim().replace(/\s+/g, ' '),
    proj = G.proj.trim().replace(/\s+/g, ' ');
  if (!G.trat) {
    G.err = 'Escolha se você será Vereadora ou Vereador.';
    return render();
  }
  if (nome.length < 2) {
    G.err = 'Escreva o seu nome para assumir o mandato.';
    return render();
  }
  if (proj.length < 5) {
    G.err = 'Escreva o seu projeto de lei ou toque em um exemplo.';
    return render();
  }
  P.nome = nome; // lembra o nome para a próxima visita
  save();
  G = {
    tela: 'jogo', trat: G.trat, nome, proj,
    num: 1 + rnd(300), ano: new Date().getFullYear(),
    veto: rnd(3) == 0, // em 1 de cada 3 partidas o Prefeito veta
    pos: 0, vidas: REGRAS.vidas, mes: REGRAS.meses, estrelas: 0, cons: REGRAS.consultas,
    vistos: {}, evUsados: [], ctUsadas: [], etapaVista: -1,
    acertos: 0, perguntas: 0, erros: [], corr: null, subiu: -1, sair: false,
  };
  beep(520);
  entrar();
}

// Chegada a uma casa.
function entrar() {
  if (G.pos >= FIM) {
    // passou da última casa: o Prefeito sanciona ou, às vezes, veta
    if (G.veto && !G.vetoDerrubado) {
      G.fase = 'veto';
      return render();
    }
    return vitoria();
  }
  if (casa().e > G.etapaVista) {
    // etapa nova: o Legis apresenta antes (botão Entrar → ACT.abrir);
    // a partir da 2ª etapa, o jogador recupera 1 vida
    G.vidaEtapa = casa().e > 0 ? aplicar({ vida: 1 }) : null;
    G.fase = 'etapa';
    return render();
  }
  desafio();
}

// Sorteia um item ainda não usado na partida (eventos e cartas); quando
// todos já saíram, libera a lista de novo.
function sorteiaNaoUsado(lista, usados) {
  let l = lista.map((x, i) => i).filter(i => !usados.includes(i));
  if (!l.length) {
    usados.length = 0;
    l = lista.map((x, i) => i);
  }
  const k = l[rnd(l.length)];
  usados.push(k);
  return k;
}

// O que a casa traz (campo t de CASAS): 'q' pergunta, 'ev' evento, 'ct' carta.
function desafio() {
  const c = casa();
  if (c.t == 'q') novaPergunta('etapa');
  else if (c.t == 'ev') novaPergunta('evento', sorteiaNaoUsado(EVENTOS, G.evUsados));
  else {
    // carta: o efeito vale na hora
    const k = sorteiaNaoUsado(CARTAS, G.ctUsadas),
      fx = CARTAS[k].fx;
    G.carta = k;
    G.cartaFx = aplicar(fx);
    G.mov = fx.extra ? 0 : 1; // pergunta extra: só anda depois de respondê-la
    G.perdeu = null; // carta nunca encerra a partida: só um erro com o tempo zerado
    G.fase = 'carta';
    beep(CARTAS[k].bom ? 700 : 200, 0.18);
  }
  render();
}

// Correção da resposta i (a certa é sempre a 1). Modelo de Crowder:
//   ERRO   1º erro da pergunta: etapa/extra perde 1 vida; evento aplica o
//          campo "no" dele. Cada erro gasta REGRAS.custoErro meses (e
//          cada acerto, REGRAS.custoAcerto). A errada fica riscada, entra em Para rever e o pop-up
//          mostra o comentário DELA (posição i + 5). O jogador tenta de
//          novo a MESMA pergunta.
//   ACERTO estrelas pela tentativa (se só restava uma alternativa, no
//          máximo 1) e o peão anda 1 casa. Acertar nunca faz perder: com
//          o mandato zerado, o jogador segue enquanto acertar.
function responder(i) {
  if (G.fase != 'q' || G.corr) return; // só com a pergunta aberta e sem pop-up
  const q = cur(),
    src = G.q.src;
  G.q.tent++;
  if (G.q.tent == 1) G.perguntas++;
  if (i != 1) {
    let fx = {};
    const primeiroErro = !G.q.desc.length;
    if (primeiroErro) {
      fx = src == 'evento' ? { ...EVENTOS[G.q.ev].no } : { vida: -1 };
      G.q.err = [q[0], q[1], q[6], []];
      G.erros.push(G.q.err);
    }
    G.q.desc.push(i);
    G.q.err[3].push(q[i]);
    fx.mes = (fx.mes || 0) - REGRAS.custoErro;
    G.corr = { i, fx: aplicar(fx), primeiroErro };
    G.perdeu = derrota();
    beep(150, 0.25);
    render();
    app.classList.add('shk'); // a tela treme por um instante
    setTimeout(() => app.classList.remove('shk'), 260);
    focar('#okp');
    return;
  }
  if (G.q.tent == 1) G.acertos++;
  const sobra = G.q.ops.filter(k => !G.q.desc.includes(k) && !G.hid.includes(k)).length == 1;
  let est = estrelasDaTentativa(G.q.tent);
  if (sobra) est = Math.min(est, 1); // resposta "sozinha" vale no máximo 1 estrela
  G.mov = src == 'veto' ? 0 : 1; // o veto não anda casa: a lei vai à promulgação
  if (src == 'veto') G.vetoDerrubado = true;
  G.resp = { i, ok: true, fx: aplicar({ estrela: est, mes: -REGRAS.custoAcerto }), tent: G.q.tent, sobra };
  G.perdeu = null; // acerto nunca faz perder
  G.fase = 'resp';
  beep(660, 0.1);
  render();
}

// Botão OK do pop-up (o único jeito de fechá-lo): derrota → tela final;
// senão volta à mesma pergunta, com a errada riscada.
function fecharPop() {
  if (!G.corr) return;
  G.corr = null;
  if (G.perdeu) return fimDeJogo(false, G.perdeu);
  render();
  focar('.qc'); // foco no enunciado, e não numa alternativa (não parecer dica)
}

// Depois do acerto ou da carta: tela final, pergunta extra ou próxima casa.
function continuar() {
  if (G.perdeu) return fimDeJogo(false, G.perdeu);
  if (G.fase == 'carta' && CARTAS[G.carta].fx.extra) {
    novaPergunta('extra');
    return render();
  }
  G.pos += G.mov;
  entrar();
}

// Consulta à Procuradoria: esconde UMA errada ainda não tentada
// (só quando sobram duas ou mais, para nunca entregar a resposta). Grátis, 3 por partida, uma vez por pergunta.
// motivoSemConsulta() diz no botão por que ele está desativado.
const escondiveis = () => [2, 3, 4].filter(i => !G.q.desc.includes(i));
const motivoSemConsulta = () =>
  G.cons <= 0 ? 'as 3 consultas já foram usadas' : G.hid.length ? 'já usada nesta pergunta' : escondiveis().length < 2 ? 'restam poucas alternativas' : '';
const podeConsultar = () => G.fase == 'q' && !G.corr && !motivoSemConsulta();
function consultar() {
  if (!podeConsultar()) return;
  G.cons--;
  G.mes = Math.max(0, G.mes - REGRAS.custoConsulta);
  const l = escondiveis();
  G.hid = sh(l).slice(0, 1);
  beep(440);
  render();
}

// Sanção: +1 estrela por vida que sobrou e +1 lei na caderneta.
function vitoria() {
  G.bonus = G.vidas;
  G.estrelas += G.bonus;
  P.leis = (P.leis || 0) + 1;
  fimDeJogo(true);
}

// Fim da partida: guarda o recorde e mostra a tela final.
function fimDeJogo(win, motivo) {
  Object.assign(G, { tela: 'fim', win, motivo: motivo || null, novoRecorde: G.estrelas > (P.bestE || 0) });
  if (G.novoRecorde) P.bestE = G.estrelas;
  save();
  beep(win ? 880 : 120, win ? 0.3 : 0.4);
  render();
}


/* ======================================================================
   7. TELAS
   ----------------------------------------------------------------------
   Cada função v...() devolve o HTML de uma tela, como texto; cada ${...}
   insere um valor da comanda. render() escolhe a tela pelo G.tela.
     vInicio   boas-vindas (Legis na tribuna, Iniciar, Como jogar,
               instalar e aviso de privacidade da LGPD)
     vComo     cartões do Como jogar
     vMenu     gabinete: ficha do mandato (nome, projeto)
     vJogo     partida = hud (painel) + tab (tabuleiro) + vPalco (desafio,
               ou o veto do Prefeito)
               + vPop (pop-up de erro) + aviso de saída
     vFim      resultado, certificado da lei e Para rever
   ====================================================================== */

// Balão de fala do Legis. Na partida, o Legis já aparece de terno na faixa
// da etapa, então o balão vem só com o texto (fala). Na tela final, o
// balão vem com o Legis de terno (legis). Humor: n normal, h feliz, s triste.
const fala = t => `<div class="ms so-texto"><div class="bb">${t}</div></div>`;
const legis = (t, m = 'n') =>
  `<div class="ms"><img class="mc x${m}" src="${PATO_TERNO}" alt="" style="height:94px"><div class="bb">${t}</div></div>`;

// Recortes (viewBox) das cenas desenhadas: no computador mostra a cena
// inteira; no celular, só a parte do meio, em volta do Legis.
const largo = () => matchMedia('(min-width: 860px)').matches;
const vbGabinete = () => (largo() ? '25 -40 350 560' : '-60 40 520 440');
const vbFaixa = () => (largo() ? '250 0 350 150' : '305 0 230 150');

// --- Boas-vindas ---
function vInicio() {
  const rec = P.bestE
    ? `Recorde neste aparelho: ${P.bestE} estrelas · ${P.leis || 0} ${P.leis == 1 ? 'lei sancionada' : 'leis sancionadas'}`
    : '';
  return `<div class="boas"><div class="boas-foto"><img src="${CENA_INICIO}" alt="Legis, o mascote, discursa na tribuna do Plenário da Câmara Municipal de Campinas"></div>
<div class="boas-lado"><div class="tit"><img class="lgm" src="${$('#logo').src}" alt="Câmara Municipal de Campinas"><div class="tbox"><span class="je">Jogo</span><h1>JOVEM <span>PARLAMENTAR</span></h1></div></div>
<p class="boas-txt">Você ganhou um mandato! Leve o seu projeto de lei do Protocolo até a sanção do Prefeito.</p>
<div class="bt1"><button class="go" data-a="iniciar">${ico('jogar')}Iniciar</button><button class="sec2" data-a="como">${ico('duvida')}Como jogar</button></div>
${rec ? `<p class="sub cen">${rec}</p>` : ''}${vInstalar()}${vPrivacidade()}</div></div>`;
}

// Aviso de privacidade (LGPD): diz exatamente o que fica guardado e deixa
// o jogador apagar. Aparece mesmo com o jogo já instalado (veja ADR-014).
function vPrivacidade() {
  const temDados = P.nome || P.bestE || P.leis;
  const acao = G.apagou
    ? '<p class="ok" role="status">Pronto: os dados deste aparelho foram apagados.</p>'
    : temDados
      ? '<button class="lk" data-a="apagar">Apagar meus dados</button>'
      : '';
  return `<div class="priv"><p>${ico('escudo')}Este jogo não coleta nem envia dados pessoais. Só o seu recorde e o seu nome ficam guardados neste aparelho, e você pode apagá-los quando quiser. Respeitamos a LGPD (Lei nº 13.709/2018).</p>${acao}</div>`;
}

// Link discreto "Instalar o jogo no celular" (PWA). Aparece só no celular
// e no tablet, e some quando o jogo já está instalado. Com o pedido do navegador (Android/Chrome), abre a
// instalação; senão (iPhone e outros), mostra como instalar pelo menu.
let pedidoInstalar = null;
const instalado = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
// Só em celular e tablet (o iPad novo se apresenta como Mac com toque).
const celular = () => /android|iphone|ipad|ipod|mobi/i.test(navigator.userAgent) || (/macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
function vInstalar() {
  if (instalado() || !celular()) return '';
  const dica = /iphone|ipad|ipod/i.test(navigator.userAgent)
    ? 'No Safari, toque em Compartilhar (quadrado com seta) e depois em <b>Adicionar à Tela de Início</b>.'
    : 'No menu ⋮ do navegador, toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.';
  return `<p class="inst"><button class="lk" data-a="instalar">${ico('celular', 'cel')}Instalar o jogo no celular</button>${G.dicaInst ? `<span class="sub">${dica}</span>` : ''}</p>`;
}
addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  pedidoInstalar = e;
});
addEventListener('appinstalled', () => {
  pedidoInstalar = null;
  render();
});

// --- Como jogar: um cartão de COMO_JOGAR por vez ---
function vComo() {
  const n = COMO_JOGAR.length,
    k = G.passo,
    c = COMO_JOGAR[k],
    ult = k == n - 1;
  return `<div class="como card"><div class="cabc"><span class="ce">Como jogar · ${k + 1} de ${n}</span><button class="lk" data-a="iniciar">Pular</button></div>
<div class="cc1" aria-live="polite"><div class="cc1-img" aria-hidden="true"><svg viewBox="176 0 400 150" preserveAspectRatio="xMidYMid slice">${FAIXAS[c.img].replace(/@L/g, PATO_TERNO)}</svg><span class="ic">${ico(c.ic)}</span></div><h1 class="t">${c.t}</h1><p>${c.txt}</p></div>
<div class="pts" aria-hidden="true">${COMO_JOGAR.map((_, i) => `<i class="${i == k ? 'on' : ''}"></i>`).join('')}</div>
<div class="bt2">${k ? '<button class="sec2" data-a="passo" data-v="-1">Voltar</button>' : '<button class="sec2" data-a="inicio">Início</button>'}<button class="go" data-a="${ult ? 'iniciar' : 'passo'}" data-v="1">${ult ? 'Começar' : 'Próximo'}</button></div></div>`;
}

// --- Gabinete: cena do Legis atrás da mesa + ficha do mandato ---
// A cena é um SVG só (fundo, Legis e mesa), para as peças nunca desalinharem.
const CENA_GABINETE = fala =>
  `<div class="palco-gab"><svg class="cena-gab" data-vb="gab" viewBox="${vbGabinete()}" preserveAspectRatio="xMidYMax slice" aria-hidden="true">${GAB_FUNDO}<image class="legis" href="${PATO_TERNO}" x="112" y="192" width="176" height="299"/>${GAB_FRENTE}<text x="200" y="436" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="10" fill="#3b2a08">VER. LEGIS</text></svg><p class="balao">${fala}</p></div>`;
function vMenu() {
  const sg = (v, t) => `<button type="button" data-a="trat" data-v="${v}" class="${G.trat == v ? 'on' : ''}" aria-pressed="${G.trat == v}">${t}</button>`;
  return `<div class="gabw"><aside class="gabl"><h1 class="sr">Seu gabinete</h1>${CENA_GABINETE('Vamos montar o seu gabinete!')}</aside>
<form class="card fm gab" id="fm" novalidate><h2 class="t">Ficha do mandato</h2>
<div><span class="lb">Você será</span><div class="sg">${sg('a', 'Vereadora')}${sg('o', 'Vereador')}</div></div>
<div><label class="lb" for="nome">Seu nome</label><input id="nome" maxlength="40" autocomplete="off" placeholder="Ex: Bruna Rafaela" value="${esc(G.nome)}"></div>
<div><label class="lb" for="proj">Seu projeto de lei</label><textarea id="proj" maxlength="90" rows="2" placeholder="Ex: Institui a Semana Municipal da Leitura nas escolas">${esc(G.proj)}</textarea></div>
<div class="ex"><span>Sem ideia? Toque em um exemplo:</span>${EXEMPLOS.map((x, i) => `<button type="button" data-a="exemplo" data-v="${i}">${x}</button>`).join('')}</div>
<p class="er" role="alert">${G.err || ''}</p>
<button class="go" type="submit">${ico('documento')}Protocolar o projeto</button>
<p class="sub cen"><button type="button" class="lk" data-a="como">${ico('duvida')}Como jogar</button></p></form></div>`;
}

// --- Painel do mandato: nome, projeto, vidas, cargo, estrelas e mandato ---
function hud() {
  const c = cargo(),
    nx = CARGOS[c + 1],
    pc = nx ? ((G.estrelas - CARGOS[c][0]) / (nx[0] - CARGOS[c][0])) * 100 : 100, // barra até o próximo cargo
    pm = (G.mes / REGRAS.meses) * 100;
  return `<div class="hud"><div class="hj"><div class="hn"><b>${esc(tit() + ' ' + G.nome)}</b><span>PL nº ${G.num}/${G.ano} · ${esc(G.proj)}</span></div><div class="hv" role="img" aria-label="${G.vidas} de ${REGRAS.vidas} vidas">${ico('coracao', 'vida').repeat(G.vidas)}${ico('coracao', 'vida perdida').repeat(REGRAS.vidas - G.vidas)}</div></div>
<div class="hc"><span class="rb">${nomeCargo(c)}</span><div class="bx" title="${nx ? `Faltam ${nx[0] - G.estrelas} estrelas para ${nomeCargo(c + 1)}` : 'Cargo máximo'}"><i style="width:${pc}%"></i></div><span class="xv">${ico('estrela', 'est')}${G.estrelas}</span></div>
<div class="md mdm ${G.mes <= 12 ? 'lo' : ''}"><span>${ico('ampulheta')}Mandato</span><b>${G.mes} ${G.mes == 1 ? 'mês' : 'meses'}</b><div class="bx mes"><i style="width:${pm}%"></i></div></div></div>`;
}

// --- Tabuleiro: uma linha por etapa; casas feitas (✓), atual (cabeça do
// Legis) e futuras. Casas de imprevisto e carta mostram o ícone e o número.
function tab() {
  const at = casa().e;
  const marca = (c, i) =>
    i == G.pos ? `<img src="${CABECA}" alt="">` : i < G.pos ? ico('certo') : c.t == 'ev' ? ico('alerta') + `<small class="n">${i + 1}</small>` : c.t == 'ct' ? ico('carta') + `<small class="n">${i + 1}</small>` : i + 1;
  const linhas = ETAPAS.map(
    (et, e) =>
      `<div class="et ${G.pos >= FIM || e < at ? 'feita' : e == at ? 'atual' : ''}"><div class="en"><b>${ico(et.ic)}</b><span>${et.nome}</span></div><div class="tr">${CASAS.map((c, i) => (c.e != e ? '' : `<i class="cs ${i == G.pos ? 'aqui' : i < G.pos ? 'ok' : ''}" title="${c.n}">${marca(c, i)}</i>`)).join('')}</div></div>`,
  );
  return `<div class="tab" role="img" aria-label="Tabuleiro: casa ${Math.min(G.pos, FIM) + 1} de ${FIM + 1}">${linhas.join('')}<div class="et fim ${G.pos >= FIM ? 'atual' : ''}"><div class="en"><b>${ico('assinatura')}</b><span>Sanção do Prefeito</span></div><div class="tr"><i class="cs sn ${G.pos >= FIM ? 'aqui' : ''}">SANÇÃO</i></div></div></div>`;
}

// --- Faixa da etapa: ilustração (FAIXAS, com o Legis no lugar de @L) + textos ---
function cena(gr) {
  const et = etapa(),
    ilus = FAIXAS[et.id];
  const fig = ilus
    ? `<div class="cena-ilus" aria-hidden="true"><svg data-vb="faixa" viewBox="${vbFaixa()}" preserveAspectRatio="xMidYMid slice">${ilus.replace(/@L/g, PATO_TERNO)}</svg></div>`
    : '';
  return `<div class="cena ${gr ? 'gr' : ''} ${ilus ? 'ilus' : ''}">${fig}<div class="cena-tx"><span class="ce">Etapa ${casa().e + 1} de ${ETAPAS.length} · ${et.local}</span><h1 class="t">${et.nome}</h1><span class="cc">${G.pos >= FIM ? 'Decisão do Prefeito' : `Casa ${G.pos + 1} de ${FIM} · ${casa().n}`}</span></div></div>`;
}

// --- Palco: o centro da partida, conforme G.fase ---
//   'etapa' apresentação do Legis e botão Entrar
//   'carta' carta de Sorte ou Azar e seus efeitos
//   'q'     pergunta, alternativas (as erradas já tentadas ficam riscadas)
//           e o botão de consulta
//   'resp'  depois do acerto: certa em verde, explicação, fonte e efeitos
//   'veto'  o Prefeito vetou: aviso e botão para responder a pergunta do veto
function vPalco() {
  if (G.fase == 'etapa')
    return (
      cena(1) +
      fala(etapa().intro) +
      (G.vidaEtapa && G.vidaEtapa.vida > 0 ? `<div class="fx"><span class="up">${ico('coracao', 'vida')}+1 vida pela etapa nova</span></div>` : '') +
      `<button class="go" data-a="abrir">${G.pos == 0 ? 'Começar a tramitação' : 'Entrar'}</button>`
    );
  if (G.fase == 'veto')
    return (
      cena() +
      `<div class="cr mau"><span class="tp">Decisão do Prefeito</span><span class="ic">${ico('alerta')}</span><h2 class="t">Veto!</h2><p>O Prefeito vetou o seu projeto. A Câmara pode derrubar o veto pelo voto da maioria absoluta dos vereadores (LOM, art. 51). Responda certo para derrubá-lo.</p></div><button class="go" data-a="veto">Responder</button>`
    );
  if (G.fase == 'carta') {
    const c = CARTAS[G.carta];
    return (
      cena() +
      `<div class="cr ${c.bom ? 'bom' : 'mau'}"><span class="tp">${c.bom ? 'Carta de sorte' : 'Carta de azar'}</span><span class="ic">${ico(c.ic)}</span><h2 class="t">${c.nome}</h2><p>${c.txt}</p>${chips(G.cartaFx)}</div><button class="go" data-a="continuar">${G.perdeu ? 'Ver resultado' : c.fx.extra ? 'Responder' : 'Continuar'}</button>`
    );
  }
  const q = cur(),
    r = G.resp,
    src = G.q.src,
    desc = G.q.desc,
    ev = src == 'evento' ? EVENTOS[G.q.ev] : null;
  // fala do Legis
  const texto = r
    ? `<b>Isso mesmo!</b> ${r.tent > 1 ? `Você acertou na ${r.tent}ª tentativa. ` : ''}${r.sobra && r.tent > 1 ? 'Como só restava esta alternativa, ela vale 1 estrela. ' : ''}${esc(q[5])}<br><span class="rf">${esc(q[6])}</span>`
    : G.mes <= 0
      ? 'O tempo do mandato acabou: continue acertando, porque um erro agora encerra a partida.'
      : desc.length
        ? `Você já descartou ${desc.length == 1 ? 'uma alternativa' : desc.length + ' alternativas'}. Releia a pergunta e tente de novo.`
        : src == 'evento'
          ? '' // o quadro do imprevisto já explica tudo (sem balão repetido)
          : src == 'extra'
            ? 'Questionamento jurídico! Responda para o projeto seguir.'
            : src == 'veto'
              ? 'Derrube o veto: acerte para a Câmara promulgar a lei.'
              : 'Acerte para avançar uma casa.';
  // alternativa: certa (após o acerto), riscada (já tentada) ou escondida (consulta)
  const classe = i => (r && i == 1 ? 'okb' : desc.includes(i) ? 'x' : G.hid.includes(i) ? 'hid' : '');
  const travada = i => r || G.corr || desc.includes(i) || G.hid.includes(i);
  return (
    cena() +
    (ev ? `<div class="evb"><i>${ico(ev.ic)}</i><div><b>Casa de imprevisto: ${ev.nome}</b>${ev.txt} Aqui, errar não tira vida.</div></div>` : '') +
    (texto ? fala(texto) : '') +
    `<div class="card qc" tabindex="-1">${esc(q[0])}</div>
<div id="o">${G.q.ops.map(i => `<button data-a="resp" data-v="${i}" ${travada(i) ? 'disabled' : ''} class="${classe(i)}">${esc(q[i])}</button>`).join('')}</div>` +
    (r
      ? chips(r.fx) +
        `<button class="go" data-a="continuar">${src == 'veto' ? 'Promulgar a lei' : G.pos + G.mov >= FIM ? 'Ver a decisão do Prefeito' : 'Avançar'}</button>`
      : `<button class="lf" data-a="consultar" ${podeConsultar() ? '' : 'disabled'}>${ico('lampada')}${motivoSemConsulta() ? `Consultar a Procuradoria: ${motivoSemConsulta()}` : `Consultar a Procuradoria (${G.cons})`}</button>`)
  );
}

// --- Pop-up de erro (Crowder): alternativa escolhida, comentário dela,
// fonte, efeitos e o botão OK, o único que fecha. Se faltar o comentário,
// usa a explicação geral (posição 5).
function vPop() {
  const q = cur(),
    p = G.corr,
    com = q[p.i + 5] || q[5];
  return `<div class="ov" role="dialog" aria-modal="true" aria-labelledby="pt" aria-describedby="pd"><div class="corr">
<div class="tt"><span class="xx" aria-hidden="true">${ico('fechar')}</span><div><small>Resposta errada</small><b id="pt">Não foi desta vez</b></div></div>
<div class="cp"><div class="esc"><small>Você escolheu</small><s>${esc(q[p.i])}</s></div>
<div class="por"><small>Por que não?</small><p id="pd">${esc(com)}</p><span class="rf">${ico('fonte')}Fonte da pergunta: ${esc(q[6])}</span></div>
${chips(p.fx)}
<button class="go" id="okp" data-a="ok">${G.perdeu ? 'Ver resultado' : 'OK'}</button></div></div></div>`;
}

// --- Partida: painel e tabuleiro à esquerda, palco à direita ---
function vJogo() {
  return (
    `<div class="jg"><aside class="pl">${hud()}${tab()}</aside><section class="st">${vPalco()}</section></div>` +
    (G.corr ? vPop() : '') +
    (G.sair
      ? `<div class="ov"><div class="card"><b>Sair da partida?</b><span class="sub">O andamento do projeto será perdido.</span><button class="go" data-a="ficar">Continuar jogando</button><button data-a="sair">Sair para o início</button></div></div>`
      : '')
  );
}

// --- Tela final: certificado (vitória) ou motivo (derrota), números e Para rever ---
function vFim() {
  // números da partida: só valores simples, sem frações (nada de "15/17")
  const res = `<div class="rs"><div><b>${ico('estrela', 'est')}${G.estrelas}</b>estrelas${G.novoRecorde ? ' · recorde!' : ''}</div><div><b>${ico('coracao', 'vida')}${G.vidas}</b>${G.vidas == 1 ? 'vida sobrou' : 'vidas sobraram'}</div><div><b>${G.mes}</b>${G.mes == 1 ? 'mês restante' : 'meses restantes'}</div></div>`;
  const rev = G.erros.length
    ? `<div class="rv"><h2 class="t">Para rever</h2>${G.erros.map(e => `<div><b>${esc(e[0])}</b>Você marcou: ${e[3].map(esc).join(' · ')}<br>Certa: ${esc(e[1])} <span class="rf">${esc(e[2])}</span></div>`).join('')}</div>`
    : '';
  const bt = `<div class="bt"><button class="go" data-a="denovo">${G.win ? 'Novo mandato' : 'Tentar de novo'}</button><button data-a="sair">Início</button></div>`;
  const cargoFinal = `<span class="rb" style="align-self:flex-start">${nomeCargo(cargo())}</span>`;
  // vitória com veto derrubado: a lei é promulgada (não sancionada)
  const v = G.vetoDerrubado;
  if (G.win)
    return `<div class="fimg"><div><h1 class="big">${v ? 'Promulgada!' : 'Sanção!'}</h1>${legis(v ? 'Parabéns. A Câmara derrubou o veto e seu projeto virou lei municipal.' : 'Parabéns. Seu projeto foi transformado em lei municipal.', 'h')}
<div class="lei"><span class="lt">LEI MUNICIPAL</span><q>${esc(G.proj)}</q><span class="au">Projeto de Lei nº ${G.num}/${G.ano} · Autoria: ${esc(tit() + ' ' + G.nome)}${v ? ' · Veto derrubado pela Câmara' : ''}</span><span class="sel">${v ? 'PROMULGADA' : 'SANCIONADA'}</span></div></div>
<div>${cargoFinal}${res}<p class="sub">Bônus ${v ? 'final' : 'da sanção'}: +${G.bonus} ${G.bonus == 1 ? 'estrela' : 'estrelas'} (uma por vida que sobrou).</p>${bt}${rev}</div></div>`;
  return `<div class="fimg"><div><h1 class="big dr">${G.motivo[0]}</h1>${legis(G.motivo[1] + ' Todo projeto pode ser reapresentado: tente outra vez!', 's')}
<div class="card"><b>${esc(G.proj)}</b><br><span class="sub">PL nº ${G.num}/${G.ano} · ${esc(tit() + ' ' + G.nome)} · parou em ${etapa().nome}</span></div></div>
<div>${cargoFinal}${res}${bt}${rev}</div></div>`;
}

// --- Desenho: redesenha a tela inteira a partir de G ---
// Nas telas de entrada (início e Como jogar) o cabeçalho fica escondido.
function render() {
  document.body.classList.toggle('home', G.tela == 'inicio' || G.tela == 'como');
  app.innerHTML = { inicio: vInicio, como: vComo, menu: vMenu, fim: vFim, jogo: vJogo }[G.tela]();
  rolarParaPalco();
}

// No celular (uma coluna), painel e tabuleiro ficam acima da pergunta. A
// cada etapa, pergunta, carta ou resposta nova, a tela rola até a faixa da
// etapa. Redesenhos da mesma situação (consulta, fechar o pop-up) não
// mexem na rolagem. O atraso espera o teclado do celular fechar.
let ultimaCena = '';
function rolarParaPalco() {
  if (G.tela != 'jogo') return (ultimaCena = '');
  const chave = [G.pos, G.fase, G.q && G.q.k, G.q && G.q.src].join('|');
  if (chave == ultimaCena) return;
  ultimaCena = chave;
  if (innerWidth >= 860) return;
  setTimeout(() => {
    const alvo = $('.st .cena'),
      sobra = document.documentElement.scrollHeight - innerHeight;
    if (!alvo || sobra <= 4) return scrollTo(0, 0); // a página cabe na tela
    scrollTo(0, Math.min(sobra, alvo.getBoundingClientRect().top + scrollY - 8));
  }, 120);
}


/* ======================================================================
   8. AÇÕES E EVENTOS
   ----------------------------------------------------------------------
   Cada botão tem data-a="ação" (e, se precisar, data-v="valor"). Um
   único ouvinte de cliques chama ACT[ação](valor). Como a tela é
   redesenhada a cada passo, os botões mudam, mas o ouvinte continua.
   ====================================================================== */
const ACT = {
  // gabinete
  trat(v) { G.trat = v; G.err = ''; render(); }, // Vereadora (a) ou Vereador (o)
  exemplo(v) { G.proj = EXEMPLOS[+v]; G.err = ''; render(); }, // preenche o projeto
  // partida
  abrir() { G.etapaVista = casa().e; G.vidaEtapa = null; beep(520); desafio(); }, // sai da apresentação da etapa
  veto() { novaPergunta('veto'); beep(520); render(); }, // responde à pergunta do veto
  resp: v => responder(+v), // clicou numa alternativa
  ok: fecharPop, // OK do pop-up de erro
  continuar,
  consultar,
  menu() { // botão Início do cabeçalho: na partida, pergunta antes de sair
    if (G.corr) return; // com o pop-up aberto, só o OK funciona
    if (G.tela == 'jogo') { G.sair = true; render(); } else ACT.sair();
  },
  ficar() { G.sair = false; render(); },
  sair(destino = 'inicio') { // volta mantendo nome e tratamento
    G = { tela: destino, passo: 0, trat: G.trat, nome: G.nome, proj: '', err: '' };
    render();
    scrollTo(0, 0);
  },
  denovo() { // tela final: Novo mandato (vitória) ou Tentar de novo (derrota)
    if (G.win) return ACT.sair('menu');
    G.err = '';
    iniciar();
  },
  // telas de entrada
  inicio: () => ACT.sair('inicio'),
  iniciar() { G.tela = 'menu'; G.err = ''; render(); scrollTo(0, 0); }, // Iniciar, Pular e Começar
  como() { G.tela = 'como'; G.passo = 0; render(); scrollTo(0, 0); },
  passo(v) { G.passo = Math.max(0, Math.min(COMO_JOGAR.length - 1, G.passo + +v)); render(); },
  apagar() { // "Apagar meus dados": limpa a caderneta deste aparelho (LGPD)
    try {
      localStorage.removeItem('jv1');
    } catch (e) {}
    P = { ...P_VAZIA };
    Object.assign(G, { nome: '', trat: 'a', apagou: true });
    render();
  },
  instalar() {
    if (pedidoInstalar) {
      pedidoInstalar.prompt();
      pedidoInstalar.userChoice.finally(() => { pedidoInstalar = null; render(); });
    } else { G.dicaInst = !G.dicaInst; render(); } // mostra/esconde como instalar pelo menu
  },
};

// Porteiro dos cliques.
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (b && !b.disabled) ACT[b.dataset.a](b.dataset.v);
});

// Formulário do gabinete: guarda o texto enquanto digita (sem redesenhar,
// para não perder o foco); Enter no projeto ou o botão Protocolar enviam.
app.addEventListener('input', e => {
  if (e.target.id == 'nome') G.nome = e.target.value;
  if (e.target.id == 'proj') G.proj = e.target.value;
});
app.addEventListener('keydown', e => {
  if (e.target.id == 'proj' && e.key == 'Enter') {
    e.preventDefault(); // Enter não pula linha: envia
    e.target.form.requestSubmit();
  }
});
app.addEventListener('submit', e => {
  e.preventDefault();
  if (document.activeElement) document.activeElement.blur(); // fecha o teclado do celular
  iniciar();
});

// Pop-up aberto: o Tab fica preso no OK (e o Esc não fecha nada).
document.addEventListener('keydown', e => {
  if (G.corr && e.key == 'Tab') {
    e.preventDefault();
    const ok = $('#okp');
    if (ok) ok.focus();
  }
});

// Como jogar: deslizar o dedo para o lado troca de cartão.
let toqueX = null;
app.addEventListener('touchstart', e => (toqueX = G.tela == 'como' ? e.touches[0].clientX : null));
app.addEventListener('touchend', e => {
  if (toqueX == null) return;
  const dx = e.changedTouches[0].clientX - toqueX;
  if (Math.abs(dx) > 50) ACT.passo(dx < 0 ? 1 : -1);
  toqueX = null;
});

// Girar o celular ou mudar o tamanho da janela: ajusta os recortes das cenas.
addEventListener('resize', () => {
  const g = $('.cena-gab'),
    f = $('[data-vb="faixa"]');
  if (g) g.setAttribute('viewBox', vbGabinete());
  if (f) f.setAttribute('viewBox', vbFaixa());
});

// Primeira tela: espera o arquivo inteiro carregar (as imagens ficam no
// último bloco <script>).
addEventListener('DOMContentLoaded', render);
    </script>
