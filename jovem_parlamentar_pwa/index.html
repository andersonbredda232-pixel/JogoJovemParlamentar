<div class="por"><small>Por que não?</small><p id="pd">${esc(com)}</p><span class="rf">📖 ${esc(q[6])}</span></div>
${chips(p.fx, 0)}
<button class="go" id="okp" data-a="ok">${G.perdeu ? 'VER RESULTADO' : 'OK'}</button></div></div></div>`;
}
/*
========================================================================
vJogo(): tela de jogo
========================================================================
Quando aparece: do início ao fim da partida (G.tela = 'jogo').
Papel: montar a tela de jogo juntando hud(), tab() e vPalco().
Informações exibidas: as das três partes, o pop-up de correção (vPop)
depois de um erro e, quando o botão MENU é clicado, o aviso "Sair da
partida?".
========================================================================
*/
// Tela de jogo completa: painel e tabuleiro à esquerda, palco à direita, aviso de saída.
function vJogo() {
  return (
    `<div class="jg"><aside class="pl">${hud()}${tab()}</aside><section class="st">${vPalco()}</section></div>` +
    (G.corr ? vPop() : '') +
    (G.sair
      ? `<div class="ov"><div class="card"><b>Sair da partida?</b><span class="sub">O andamento do projeto será perdido.</span><button class="go" data-a="ficar">CONTINUAR JOGANDO</button><button data-a="sair">Sair para o início</button></div></div>`
      : '')
  );
}

/*
========================================================================
vFim(): tela final
========================================================================
Quando aparece: quando a partida termina (G.tela = 'fim').
Papel: mostrar o resultado e reforçar o aprendizado.
Informações exibidas: na vitória, "SANÇÃO!", a mensagem de parabéns e o
certificado da lei com o projeto e o autor; na derrota, o motivo e o
projeto. Nos dois casos: cargo alcançado, estrelas, acertos de 1ª tentativa,
meses restantes,
casa alcançada, botões para jogar de novo ou voltar ao menu e a lista
"Para rever" com as perguntas erradas, as alternativas que o jogador
marcou, a resposta certa e a fonte.
========================================================================
*/
// Tela final: certificado da lei ou motivo da derrota, números da partida e erros para rever.
function vFim() {
  const res = `<div class="rs"><div><b>⭐ ${G.estrelas}</b>estrelas${G.novoRecorde ? ' · recorde!' : ''}</div><div><b>${G.acertos}/${G.perguntas}</b>acertos de 1ª</div><div><b>${G.mes}</b>meses restantes</div><div><b>${Math.min(G.pos, FIM) + 1}/${FIM + 1}</b>casa alcançada</div></div>`;
  const rev = G.erros.length
    ? `<div class="rv"><h2 class="t">Para rever</h2>${G.erros.map(e => `<div><b>${esc(e[0])}</b>Você marcou: ${e[3].map(esc).join(' · ')}<br>Certa: ${esc(e[1])} <span class="rf">${esc(e[2])}</span></div>`).join('')}</div>`
    : '';
  const bt = `<div class="bt"><button class="go" data-a="denovo">${G.win ? 'NOVO MANDATO' : 'TENTAR DE NOVO'}</button><button data-a="sair">Início</button></div>`;
  // vitória: certificado da lei; derrota: motivo e projeto
  if (G.win)
    return `<div class="fimg"><div><div class="big">SANÇÃO!</div>${msb('Parabéns. Seu projeto foi transformado em lei municipal.', 'h')}
<div class="lei"><span class="lt">LEI MUNICIPAL</span><q>${esc(G.proj)}</q><span class="au">Projeto de Lei nº ${G.num}/${G.ano} · Autoria: ${esc(tit() + ' ' + G.nome)}</span><span class="sel">SANCIONADA</span></div></div>
<div><span class="rb" style="align-self:flex-start">${nomeCargo(cargo())}</span>${res}<p class="sub">Bônus da sanção: +${G.bonus} ⭐ (uma por vida que sobrou).</p>${bt}${rev}</div></div>`;
  return `<div class="fimg"><div><div class="big dr">${G.motivo[0]}</div>${msb(G.motivo[1] + ' Todo projeto pode ser reapresentado: tente outra vez!', 's')}
<div class="card"><b>${esc(G.proj)}</b><br><span class="sub">PL nº ${G.num}/${G.ano} · ${esc(tit() + ' ' + G.nome)} · parou em ${etapa().nome}</span></div></div>
<div><span class="rb" style="align-self:flex-start">${nomeCargo(cargo())}</span>${res}${bt}${rev}</div></div>`;
}

/*
========================================================================
render(): desenho da tela
========================================================================
Quando é chamada: depois de qualquer ação que mude a comanda G, e uma vez
quando a página termina de carregar.
Papel: escolher a tela certa e redesenhá-la por inteiro.
Como funciona: conforme G.tela, usa vMenu(), vJogo() ou vFim() e coloca o
resultado dentro da área #app. No menu, esconde o botão MENU do cabeçalho.
Por que existe: redesenhar tudo a partir de G garante que a tela nunca
mostre informação desatualizada.
========================================================================
*/
// Redesenha a tela inteira a partir da comanda G. É chamada depois de cada ação.
function render() {
  document.body.classList.toggle('home', G.tela == 'inicio' || G.tela == 'como'); // boas-vindas: sem cabeçalho
  const T = { inicio: vInicio, como: vComo, menu: vMenu, fim: vFim, jogo: vJogo };
  app.innerHTML = T[G.tela]();
  placaNome(); // no gabinete, preenche a plaquinha da mesa
  rolarParaPalco();
}
// No celular (tela estreita, uma coluna), o painel e o tabuleiro ficam acima da pergunta.
// A cada nova etapa, pergunta, carta ou resposta, a tela rola até a faixa da etapa, para
// que a pergunta e as alternativas apareçam sem o jogador precisar rolar. Redesenhos da
// mesma situação (consulta, fechar o pop-up) não mexem na rolagem.
let ultimaCena = '';
function rolarParaPalco() {
  if (G.tela != 'jogo') return (ultimaCena = '');
  const chave = [G.pos, G.fase, G.q && G.q.k, G.q && G.q.src].join('|');
  if (chave == ultimaCena) return;
  ultimaCena = chave;
  if (innerWidth >= 860) return;
  const alvo = document.querySelector('.st .cena');
  if (alvo) alvo.scrollIntoView({ block: 'start' });
}

/* ---------- ações ---------- */
// Ações dos botões. Cada botão indica a sua no atributo data-a (e o parâmetro em data-v).
// Como funciona: cada botão do HTML tem data-a="nome da ação"; o porteiro de cliques, logo abaixo, chama ACT[nome].
// Por que existe: um único lugar reúne tudo o que os botões fazem, o que facilita encontrar e mudar ações.
const ACT = {
  trat(v) { // escolhe Vereadora (a) ou Vereador (o)
    G.trat = v;
    G.err = '';
    render();
  },
  exemplo(v) { // preenche o projeto com um dos exemplos
    G.proj = EXEMPLOS[+v];
    G.err = '';
    render();
  },
  abrir() { // sai da apresentação da etapa e abre o desafio
    G.etapaVista = casa().e;
    beep(520);
    desafio();
  },
  resp(v) { // clicou numa alternativa
    responder(+v);
  },
  ok: fecharPop, // botão OK do pop-up de erro
  continuar,
  consultar,
  menu() { // botão INÍCIO do cabeçalho: durante o jogo, pergunta antes de sair
    if (G.corr) return; // com o pop-up aberto, só o OK funciona
    if (G.tela == 'jogo') {
      G.sair = true;
      render();
    } else ACT.sair();
  },
  ficar() { // continua a partida
    G.sair = false;
    render();
  },
  sair(destino = 'inicio') { // sai da partida mantendo nome e tratamento
    G = { tela: destino, passo: 0, trat: G.trat, nome: G.nome, proj: '', err: '' };
    render();
    scrollTo(0, 0);
  },
  inicio() { // volta à tela de boas-vindas
    ACT.sair('inicio');
  },
  iniciar() { // INICIAR, Pular e COMEÇAR: vai ao gabinete
    G.tela = 'menu';
    G.err = '';
    render();
    scrollTo(0, 0);
  },
  como() { // abre os cartões do Como jogar
    G.tela = 'como';
    G.passo = 0;
    render();
    scrollTo(0, 0);
  },
  passo(v) { // avança ou volta um cartão do Como jogar
    G.passo = Math.max(0, Math.min(COMO_JOGAR.length - 1, G.passo + +v));
    render();
  },
  instalar() { // link discreto de instalação (PWA)
    if (pedidoInstalar) {
      pedidoInstalar.prompt();
      pedidoInstalar.userChoice.finally(() => {
        pedidoInstalar = null;
        render();
      });
    } else {
      G.dicaInst = !G.dicaInst; // mostra ou esconde como instalar pelo menu do navegador
      render();
    }
  },
  denovo() { // tela final: novo mandato (vitória) ou tentar de novo (derrota)
    if (G.win) return ACT.sair('menu');
    G.err = '';
    iniciar();
  },
};
// Porteiro: um único ouvinte para todos os cliques; chama ACT[data-a](data-v).
// Por que existe: como a tela é redesenhada a cada passo, os botões são recriados; um ouvinte único na página continua funcionando.
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return; // clique fora de um botão ou em botão desativado
  ACT[b.dataset.a](b.dataset.v);
});
// Gabinete: ao girar o celular ou redimensionar a janela, ajusta o recorte da cena da tribuna.
addEventListener('resize', () => {
  const c = document.querySelector('.cena-gab'); // gabinete ou boas-vindas
  if (c) c.setAttribute('viewBox', c.dataset.vb == 'gab' ? vbGabinete() : vbCena());
  const fx = document.querySelector('[data-vb="faixa"]'); // faixa da etapa
  if (fx) fx.setAttribute('viewBox', vbFaixa());
});
// Como jogar: deslizar o dedo para o lado troca de cartão.
let toqueX = null;
app.addEventListener('touchstart', e => {
  toqueX = G.tela == 'como' ? e.touches[0].clientX : null;
});
app.addEventListener('touchend', e => {
  if (toqueX == null) return;
  const dx = e.changedTouches[0].clientX - toqueX;
  if (Math.abs(dx) > 50) ACT.passo(dx < 0 ? 1 : -1);
  toqueX = null;
});
// Com o pop-up de erro aberto, o Tab fica no botão OK e o Esc não fecha nada (só o OK fecha).
document.addEventListener('keydown', e => {
  if (G.corr && e.key == 'Tab') {
    e.preventDefault();
    const ok = $('#okp');
    if (ok) ok.focus();
  }
});
// Guarda nome e projeto enquanto o jogador digita (sem redesenhar, para não perder o foco).
app.addEventListener('input', e => {
  if (e.target.id == 'nome') {
    G.nome = e.target.value;
    placaNome(); // a plaquinha da mesa acompanha o nome
  }
  if (e.target.id == 'proj') G.proj = e.target.value;
});
// Botão PROTOCOLAR O PROJETO e tecla Enter no campo do projeto iniciam a partida.
app.addEventListener('submit', e => {
  e.preventDefault();
  iniciar();
});
// O que faz: Enter no campo do projeto inicia a partida em vez de pular linha.
app.addEventListener('keydown', e => {
  if (e.target.id == 'proj' && e.key == 'Enter') {
    e.preventDefault();
    iniciar();
  }
});

/* ---------- inicialização ---------- */
// Desenha a primeira tela quando a página termina de carregar
// (as imagens ficam no último bloco <script>, no fim do arquivo).
// Por que existe: espera o navegador ler o arquivo inteiro, inclusive o bloco de imagens no fim, antes de desenhar.
window.addEventListener('DOMContentLoaded', render);
