<!--
Comentários feitos pelo Copilot para ajudar Paulucci
 JOGO JOVEM PARLAMENTAR · Câmara Municipal de Campinas 
  Jogo de tabuleiro sobre o processo legislativo municipal.
  HTML, CSS e JavaScript puros, em um único arquivo, sem servidor.

  Como este arquivo está organizado:
    1. <head>    título, fontes e estilos (CSS)
    2. <body>    cabeçalho com o logo e a área do jogo (#app)
    3. <script>  CONTEÚDO DO JOGO: perguntas, eventos, cartas e regras  <- edite aqui
    4. <script>  MOTOR DO JOGO: regras, telas e botões
    5. <script>  IMAGENS embutidas (logo e mascote) - não editar
-->
<!--
========================================================================
CABEÇALHO GERAL DO PROJETO
========================================================================
OBJETIVO DO JOGO
  Ensinar, de forma lúdica, o caminho que um projeto de lei percorre na
  Câmara Municipal de Campinas até ser sancionado pelo Prefeito. O jogador
  assume o papel de vereador(a), dá um título ao seu projeto e precisa
  levá-lo do Protocolo à Sanção respondendo a perguntas sobre as regras
  reais da tramitação.

BASE LEGAL UTILIZADA
  RI  = Regimento Interno da Câmara Municipal de Campinas (Resolução
        nº 842/2009, texto compilado até a Resolução nº 1.028/2025).
  LOM = Lei Orgânica do Município de Campinas.
  Cada pergunta cita o artigo de onde foi tirada (último campo da pergunta).

ESTRUTURA GERAL DO SISTEMA
  Página única feita com HTML, CSS e JavaScript puros: não usa servidor,
  banco de dados nem inteligência artificial para funcionar.
    1. ESTILOS (CSS, dentro de <head>): aparência de todas as telas.
    2. HTML MÍNIMO (<body>): cabeçalho com o logo e a área #app, onde o
       jogo é desenhado.
    3. CONTEÚDO (1º <script>): listas com etapas, casas, perguntas,
       eventos, cartas, cargos e regras. É a única parte que precisa ser
       editada para mudar o conteúdo do jogo.
    4. MOTOR (2º <script>): funções que aplicam as regras, guardam o
       estado da partida e desenham as telas.
    5. IMAGENS (3º <script>): logo e mascote convertidos em texto (base64).

FLUXO DO JOGO
  MENU
    O jogador escolhe Vereadora ou Vereador e digita nome e projeto.
   ↓
  Criação do Projeto
    O jogo cria a partida: projeto de lei com número fictício, 5 vidas,
    48 meses de mandato e as barras de apoio pela metade.
   ↓
  Tramitação Legislativa
    7 etapas e 21 casas: Protocolo, Procuradoria, Constituição e
    Legalidade, Comissões Temáticas, Finanças e Orçamento, Plenário e
    Prefeitura. Cada etapa começa com uma explicação do mascote.
   ↓
  Perguntas
    Duas casas por etapa. Acertar avança; errar custa uma vida.
   ↓
  Eventos
    Três casas, ao longo do percurso, sorteiam um imprevisto com pergunta
    (oposição, imprensa, audiência pública, pedido de vista, emenda...).
   ↓
  Cartas
    Quatro casas sorteiam uma carta de sorte ou revés, com efeito imediato.
   ↓
  Votação
    Etapa Plenário: 1ª discussão (legalidade) e 2ª discussão (mérito).
   ↓
  Prefeitura
    Autógrafo enviado ao Prefeito, que sanciona ou veta.
   ↓
  Sanção
    Vitória: certificado da lei municipal. Em qualquer momento, a partida
    termina em derrota se as vidas, a legalidade, o apoio político ou o
    mandato chegarem a zero.
========================================================================
-->
<!--
========================================================================
MODELO CONCEITUAL DO JOGO
========================================================================
GAMIFICAÇÃO
  O jogo usa elementos de jogos (pontos, cargos que funcionam como níveis,
  vidas, barras de recursos, sorte e revés, recompensa imediata) para
  motivar o estudo de um conteúdo considerado técnico. O multiplicador de
  acertos seguidos premia a constância, e a subida de cargo dá sensação de
  progresso a cada etapa.

APRENDIZAGEM BASEADA EM PROBLEMAS
  O jogador não assiste a uma aula antes de jogar: recebe um problema
  concreto (aprovar o próprio projeto) e enfrenta situações que surgem no
  caminho, como um colega que pede vista, a Procuradoria que aponta um
  problema de iniciativa ou a imprensa que pede entrevista. O erro faz
  parte do aprendizado: toda resposta errada mostra a explicação e o
  artigo correspondente.

EDUCAÇÃO PARA A CIDADANIA
  O jogo mostra que a lei municipal nasce de um processo com etapas,
  controles e participação. A população aparece na iniciativa popular, nas
  audiências públicas e no apoio popular; a imprensa e a oposição aparecem
  como parte normal da vida democrática.

ENSINO DO PROCESSO LEGISLATIVO
  O tabuleiro segue a ordem da tramitação: protocolo e admissibilidade
  (RI, arts. 125 a 128); assessoramento jurídico (LOM, art. 59); Comissão
  de Constituição e Legalidade (RI, art. 40); comissões de mérito (RI,
  arts. 39 e 42 a 56-E); Comissão de Finanças e Orçamento (RI, art. 41);
  duas discussões no Plenário (RI, art. 160); autógrafo (RI, art. 159);
  sanção ou veto do Prefeito (LOM, arts. 50 e 51).

RELAÇÃO COM O REGIMENTO INTERNO E A LEI ORGÂNICA
  As regras do jogo simplificam regras reais. Exemplos:
    - o parecer pela inconstitucionalidade leva o projeto ao arquivo (RI,
      art. 170, § 1º); no jogo, legalidade zero arquiva o projeto;
    - a legislatura dura quatro anos (LOM, art. 6º, § 1º); no jogo, o
      mandato tem 48 meses;
    - o pedido de vista atrasa a tramitação (RI, arts. 77 e 166); no jogo,
      custa meses ou faz voltar uma casa;
    - a Procuradoria presta assessoramento técnico-jurídico (LOM, art. 59);
      no jogo, a consulta à Procuradoria elimina alternativas erradas.
  Simplificação assumida: um projeto real nem sempre passa por todas as
  comissões e não depende de perguntas, mas a ordem das etapas e as regras
  citadas nas perguntas são as do texto legal.
========================================================================
-->

    <meta name="theme-color" content="#1f3a6b">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@500;700&display=swap">
    <style>
      /*
      ========================================================================
      ESTILOS (CSS)
      ========================================================================
      O que faz: define a aparência de todas as telas: cores, fontes, tamanhos,
      posições e animações.
      Como funciona: as cores e medidas ficam em variáveis no bloco :root (por
      exemplo, --a é o amarelo do mascote) e o restante do CSS usa essas
      variáveis. O layout é feito primeiro para celular e, a partir de 860 px de
      largura, ganha duas colunas (bloco @media no fim dos estilos).
      Por que existe: separar a aparência da lógica permite mudar o visual sem
      tocar nas regras do jogo.
      Como interage: o MOTOR gera o HTML das telas com nomes de classe (por
      exemplo, "card", "cs aqui", "okb"); cada classe tem aqui a sua aparência.
      ========================================================================
      */
      /* ---------- base: medidas da página ---------- */
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        padding: 0;
      }
      img {
        max-width: 100%;
      }
      [hidden]:not([hidden='until-found' i]) {
        display: none !important;
      }

      /* ---------- visual do jogo ---------- */
      /* Layout: cabeçalho com o logo; no jogo, painel do mandato + tabuleiro em serpente à esquerda e a cena da etapa à direita; coluna única no celular.
         Visual único e claro, o mesmo do Quiz do Memorial (azul do logotipo, amarelo do mascote, laranja nos detalhes). */
      /* ---------- cores, fontes e medidas (mude aqui para trocar o visual) ---------- */
      :root {
        --bg: #eaf1ff; /* fundo da página */
        --g: #0b2a6618; /* pontinhos do fundo */
        --pn: #fff; /* fundo dos painéis */
        --tx: #1f3a6b; /* texto */
        --mu: #4a64a0; /* texto secundário */
        --a: #ffd800; /* amarelo do mascote (destaques) */
        --h: #34588f; /* títulos */
        --b: #e0531f; /* laranja (erros e alertas) */
        --c: #0a7fb8; /* azul (seleção e legalidade) */
        --k: #1f3a6b; /* bordas e sombras */
        --nv: #16294d; /* faixa escura da cena */
        --nt: #fff; /* texto na faixa escura */
        --ok: #35d07f; /* verde (acertos) */
        --ln: #b7c7ea; /* linhas do tabuleiro */
        --su: #c9f5dc; /* fundo da etiqueta de ganho */
        --de: #ffd9cb; /* fundo da etiqueta de perda */
        --on: #000; /* texto sobre amarelo */
        --vl: rgba(22, 41, 77, 0.62); /* véu escuro do aviso de saída */
        --fd: Bungee, Impact, sans-serif; /* fonte dos títulos */
        --fb: 'Space Grotesk', system-ui, sans-serif; /* fonte do texto */
        --cz: clamp(34px, 5.4vh, 50px); /* tamanho das casas do tabuleiro */
        --rg: clamp(8px, 1.5vh, 14px); /* espaço entre as linhas do tabuleiro */
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scrollbar-width: none;
      }
      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        display: none;
      }
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        background-image: radial-gradient(var(--g) 2px, transparent 2px);
        background-size: 22px 22px;
        color: var(--tx);
        font: 500 16px/1.45 var(--fb);
      }
      .t {
        font-family: var(--fd);
        letter-spacing: 1px;
        font-weight: 400;
      }
      h1,
      h2,
      p,
      ul {
        margin: 0;
      }
      h1,
      h2 {
        text-wrap: balance;
      }
      :focus-visible {
        outline: 3px solid var(--b);
        outline-offset: 2px;
      }
      #top {
        max-width: 560px;
        margin: 0 auto;
        padding: 12px 16px 0;
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
      }
      .lg {
        min-width: 0;
      }
      .lg img {
        display: block;
        height: 44px;
        max-width: 100%;
        width: auto;
        object-fit: contain;
      }
      #app {
        max-width: 560px;
        margin: 0 auto;
        padding-block: 12px 20px;
        padding-inline: 16px;
      }
      /* ---------- botões ---------- */
      button {
        font: 700 16px var(--fb);
        color: var(--tx);
        background: var(--pn);
        border: 3px solid var(--k);
        border-radius: 14px;
        padding: 12px;
        width: 100%;
        margin: 0;
        cursor: pointer;
        box-shadow: 4px 4px 0 var(--k);
        text-align: left;
        transition: transform 0.08s;
      }
      button:active:not(:disabled) {
        transform: translate(3px, 3px);
        box-shadow: 1px 1px 0 var(--k);
      }
      button:disabled {
        opacity: 0.7;
        cursor: default;
      }
      .go {
        background: var(--a);
        color: var(--on);
        border-color: var(--on);
        box-shadow: 4px 4px 0 var(--b);
        text-align: center;
      }
      #mn {
        width: auto;
        padding: 9px 14px;
        text-align: center;
        white-space: nowrap;
        font-size: 14px;
        background: var(--a);
        color: var(--on);
        border-color: var(--on);
        box-shadow: 3px 3px 0 var(--b);
      }
      .home #mn {
        display: none;
      }
      .home .lg img {
        height: 54px;
      }
      /* ---------- etiquetas, cartões e barras ---------- */
      .rb {
        display: inline-block;
        background: var(--a);
        color: var(--on);
        font: 700 12px var(--fb);
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 3px 10px;
        border-radius: 99px;
        border: 2px solid var(--on);
      }
      .sub {
        color: var(--mu);
        font-size: 14px;
      }
      .card {
        background: var(--pn);
        border: 3px solid var(--k);
        border-radius: 16px;
        padding: 16px;
        box-shadow: 5px 5px 0 var(--c);
      }
      .bx {
        height: 12px;
        border: 2px solid var(--k);
        border-radius: 8px;
        background: var(--pn);
        overflow: hidden;
      }
      .bx i {
        display: block;
        height: 100%;
        background: var(--a);
        transition: width 0.4s;
      }
      .bx.leg i {
        background: var(--c);
      }
      .bx.pop i {
        background: var(--b);
      }
      .bx.pol i {
        background: var(--ok);
      }
      /* ---------- mascote e balão de fala ---------- */
      .ms {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .ms img {
        flex: none;
      }
      .mc {
        display: block;
        filter: drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.35));
        animation: bo 2.2s ease-in-out infinite;
        transform-origin: 50% 100%;
      }
      .mc.xh {
        animation: pu 0.6s ease-out 2;
      }
      .mc.xs {
        animation: tl 0.5s ease-out 1;
        transform: rotate(-8deg);
      }
      @keyframes pu {
        0%,
        100% {
          transform: translateY(0) rotate(0);
        }
        30% {
          transform: translateY(-14px) rotate(-6deg);
        }
        60% {
          transform: translateY(-6px) rotate(6deg);
        }
      }
      @keyframes tl {
        0% {
          transform: rotate(0);
        }
        30% {
          transform: rotate(-14deg);
        }
        60% {
          transform: rotate(-2deg);
        }
        100% {
          transform: rotate(-8deg);
        }
      }
      @keyframes bo {
        50% {
          transform: translateY(-4px);
        }
      }
      .bb {
        flex: 1;
        min-width: 0;
        background: var(--pn);
        border: 3px solid var(--k);
        border-radius: 16px;
        padding: 10px 12px;
        font-size: 15px;
      }
      .rf {
        display: inline-block;
        margin-top: 6px;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--mu);
        border: 2px solid var(--ln);
        border-radius: 8px;
        padding: 1px 8px;
      }
      /* ---------- menu inicial ---------- */
      .hub {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .hl {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }
      h1 {
        font-size: 34px;
        line-height: 1.05;
        color: var(--h);
        text-shadow: 3px 3px 0 var(--a);
      }
      .how {
        font-size: 14.5px;
        box-shadow: none;
        background: var(--pn);
        padding: 12px 14px;
      }
      .how ul {
        padding-left: 18px;
        display: grid;
        gap: 4px;
        margin-top: 4px;
      }
      .fm {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      .fm h2 {
        font-size: 22px;
        color: var(--h);
      }
      .lb {
        font-weight: 700;
        font-size: 14px;
        display: block;
        margin-bottom: 4px;
      }
      input,
      textarea {
        font: 500 17px/1.35 var(--fb);
        color: var(--tx);
        background: var(--pn);
        border: 3px solid var(--k);
        border-radius: 12px;
        padding: 10px 12px;
        width: 100%;
        resize: none;
        display: block;
      }
      input::placeholder,
      textarea::placeholder {
        color: var(--mu);
        opacity: 0.75;
      }
      .sg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .sg button {
        text-align: center;
        padding: 10px;
      }
      .on {
        background: var(--c);
        color: var(--on);
        border-color: var(--on);
      }
      .ex {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        font-size: 13.5px;
        color: var(--mu);
      }
      .ex span {
        flex-basis: 100%;
      }
      .ex button {
        width: auto;
        font-size: 13px;
        font-weight: 500;
        padding: 5px 10px;
        border-width: 2px;
        border-radius: 99px;
        box-shadow: 2px 2px 0 var(--k);
        text-align: left;
      }
      .er {
        color: var(--b);
        font-weight: 700;
        font-size: 14px;
        min-height: 1.4em;
      }
      /* ---------- tela de jogo: painel do mandato e barras ---------- */
      .jg {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .pl {
        background: var(--pn);
        border: 3px solid var(--k);
        border-radius: 18px;
        box-shadow: 5px 5px 0 var(--a);
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      .st {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .hud {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .hj {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
      }
      .hn {
        min-width: 0;
      }
      .hn b {
        display: block;
        font-size: 17px;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }
      .hn span {
        display: block;
        font-size: 13px;
        color: var(--mu);
        overflow-wrap: anywhere;
      }
      .hv {
        flex: none;
        font-size: 15px;
        letter-spacing: 1px;
        white-space: nowrap;
      }
      .hc {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .hc .bx {
        flex: 1;
        min-width: 60px;
      }
      .xv {
        font-weight: 700;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .ms4 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 12px;
      }
      .md {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 6px;
        font-size: 13px;
        min-width: 0;
      }
      .md span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .md b {
        font-variant-numeric: tabular-nums;
      }
      .md .bx {
        grid-column: 1/-1;
        height: 10px;
      }
      .md.lo b,
      .md.lo span {
        color: var(--b);
      }
      /* ---------- tabuleiro (no celular, uma faixa de progresso por etapa) ---------- */
      .tab {
        display: flex;
        gap: 5px;
      }
      .et {
        flex: 3;
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
      }
      .et.fim {
        flex: 1.6;
      }
      .en {
        text-align: center;
        font-size: 15px;
        line-height: 1.2;
        opacity: 0.45;
      }
      .en b {
        font-weight: 400;
      }
      .en span {
        display: none;
      }
      .et.atual .en,
      .et.feita .en {
        opacity: 1;
      }
      .tr {
        display: flex;
        gap: 2px;
      }
      .cs {
        flex: 1;
        height: 14px;
        border: 2px solid var(--k);
        border-radius: 5px;
        background: var(--pn);
        font-size: 0;
        font-style: normal;
        position: relative;
      }
      .cs img {
        display: none;
      }
      .cs.ok {
        background: var(--ok);
      }
      .cs.aqui {
        background: var(--a);
        border-color: var(--on);
        box-shadow: 0 0 0 2px var(--b);
      }
      .cs.sn {
        background: var(--bg);
      }
      .cs.sn.aqui {
        background: var(--a);
      }
      /* ---------- cena da etapa, pergunta, evento e carta ---------- */
      .cena {
        background-color: var(--nv);
        background-image: repeating-linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.055) 0 14px,
          transparent 14px 28px
        );
        background-size: cover;
        background-position: center;
        color: var(--nt);
        border: 3px solid var(--k);
        border-radius: 16px;
        padding: 12px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        box-shadow: 5px 5px 0 var(--a);
      }
      .cena > div {
        min-width: 0;
      }
      .ce,
      .cc {
        display: block;
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing: 0.8px;
      }
      .ce {
        text-transform: uppercase;
        opacity: 0.85;
      }
      .cena h2 {
        font-size: 21px;
        line-height: 1.1;
        color: var(--a);
        margin: 2px 0;
      }
      .ci {
        font-size: 38px;
        line-height: 1;
        font-weight: 400;
        flex: none;
      }
      .cena.gr {
        padding: 20px 16px;
      }
      .cena.gr h2 {
        font-size: 28px;
      }
      .cena.gr .ci {
        font-size: 56px;
      }
      .qc {
        font-size: 18px;
        font-weight: 700;
        line-height: 1.3;
      }
      .evb {
        display: flex;
        gap: 10px;
        align-items: center;
        background: var(--a);
        color: var(--on);
        border: 3px solid var(--on);
        border-radius: 14px;
        padding: 8px 12px;
        font-size: 14.5px;
        box-shadow: 4px 4px 0 var(--b);
      }
      .evb b {
        font: 400 13px var(--fd);
        letter-spacing: 1px;

/*
========================================================================
DOCUMENTAÇÃO PARA MANUTENÇÃO FUTURA
========================================================================
Todo o conteúdo do jogo está nas listas abaixo. Para mudar o conteúdo NÃO é
preciso alterar o MOTOR (o segundo bloco <script>).

COMO ADICIONAR UMA PERGUNTA
  1. Procure a etapa em const Q (protocolo, procuradoria, ccl, tematicas,
     financas, plenario ou prefeitura).
  2. Copie uma linha inteira de pergunta e cole logo abaixo da linha
     "nome_da_etapa:[".
  3. Troque os sete textos: enunciado, resposta CERTA, três erradas,
     explicação e fonte. A certa é SEMPRE o segundo texto.
  4. Cada texto fica entre aspas duplas, separado por vírgula, e a linha
     termina com "],". Não use aspas duplas dentro do texto.

COMO ADICIONAR UM EVENTO
  1. Em const EVENTOS, copie um evento inteiro (da chave { até a chave },).
  2. Troque id (palavra única, sem espaços), nome, ic (emoji), txt, ok, no
     e as perguntas em qs (mesmo formato de Q).
  3. Para só acrescentar uma pergunta a um evento que já existe, cole a
     linha dentro da lista qs dele.

COMO ADICIONAR UMA CARTA
  1. Em const CARTAS, copie uma linha e troque bom (1 sorte, 0 revés), ic,
     nome, txt e fx.
  2. fx aceita casa (2 avança, -1 volta), pop, pol, leg, mes, vida e
     extra:1 (pergunta jurídica extra).

COMO ADICIONAR OU MUDAR UMA ETAPA
  1. Em const ETAPAS, acrescente um objeto com id, nome, ic, local, intro,
     ok e no.
  2. Crie em const Q uma lista com a MESMA chave do id, com pelo menos seis
     perguntas.
  3. Em const CASAS, acrescente as casas da etapa (e = posição da etapa em

     foi pensado para três casas por etapa.
  4. Em const FOTOS, acrescente a chave com o mesmo id (pode ficar vazia).

COMO ADICIONAR FOTOS DE CENÁRIO
  1. Converta a foto (JPG ou PNG, de preferência com menos de 200 KB) para
     "data URI" em qualquer conversor de imagem para base64.
  2. Cole o texto, que começa com data:image/, entre as aspas da etapa em
     const FOTOS. A camada escura é aplicada automaticamente.

COMO MUDAR OS CARGOS
  Em const CARGOS, cada item é [XP mínimo, nome masculino, nome feminino].
  Mantenha os valores de XP em ordem crescente.

DEPOIS DE QUALQUER MUDANÇA
  Abra o jogo e jogue até a parte alterada. Tela em branco indica erro de

*/

/*
========================================================================
DOCUMENTAÇÃO DAS REGRAS PEDAGÓGICAS
========================================================================
Cada indicador do painel do jogo representa uma condição real para que um
projeto de lei avance.

LEGALIDADE (0 a 100, começa em 50)
  O projeto precisa respeitar a Constituição, as leis e o Regimento. Sobe
  com acertos, sobretudo nas etapas jurídicas (Procuradoria e Constituição
  e Legalidade). Se chegar a zero, o projeto é arquivado, como acontece
  quando a CCL conclui pela inconstitucionalidade (RI, art. 170, § 1º).

APOIO POPULAR (0 a 100, começa em 50)
  Representa a opinião da população e da imprensa. Muda com os eventos de
  imprensa e audiência pública, com algumas cartas e na etapa Prefeitura.
  Se zerar, os colegas recuam: ele volta a 15 e o apoio político perde 15.

APOIO POLÍTICO (0 a 100, começa em 50)
  Representa os votos dos colegas nas comissões e no Plenário (RI, art. 168;
  LOM, arts. 41 e 43). Se chegar a zero, o projeto é rejeitado.

XP (pontos de experiência)
  Mede o domínio do conteúdo. Cada acerto vale 10 XP (15 nos eventos),
  multiplicados pela sequência de acertos (x1 a x5). O XP define o cargo,
  de Vereador(a) Iniciante a Mestre(a) do Processo Legislativo.

MANDATO (48 meses)
  A legislatura dura quatro anos (LOM, art. 6º, § 1º). Cada pergunta
  consome 2 meses; pedido de vista, recesso e falta de quórum consomem
  mais. Se o tempo acabar antes da sanção, a partida termina.

  Representam o assessoramento técnico-jurídico da Procuradoria da Câmara
  (LOM, art. 59): eliminam duas alternativas erradas, ao custo de 1 mês de
  mandato. Ensinam que a consulta jurídica ajuda, mas também leva tempo.

VIDAS (5)
  A margem de erro do gabinete. Cada erro em casa de pergunta custa uma
  vida; sem vidas, a partida termina.
========================================================================
*/

    <script>
/* ============================ MOTOR DO JOGO ============================
   Lê as listas de conteúdo acima e aplica as regras. Não é preciso mexer

/* ---------- utilitários ---------- */
// Atalho para encontrar um elemento da página; app = a área onde o jogo é desenhado.
// Como funciona: $("#app") devolve o elemento da página com id "app".
// Por que existe: evita repetir document.querySelector em todo o código.
const $ = s => document.querySelector(s),
  app = $('#app');
// Troca & < > " ' por códigos seguros: texto digitado ou do banco de perguntas nunca vira código.
// Como funciona: substitui cada caractere especial pelo seu código de HTML (por exemplo, < vira &lt;).
// Por que existe: segurança. Usado por vMenu(), hud(), vPalco() e vFim() ao exibir nome, projeto e perguntas.
const esc = s =>
  String(s).replace(
    /[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
  );
// Sorteia um número inteiro de 0 a n − 1.
// Como funciona: Math.random() dá um número entre 0 e 1; multiplicado e arredondado para baixo, vira um inteiro.
// Por que existe: base de todos os sorteios (perguntas, eventos, cartas, número do projeto).
const rnd = n => Math.floor(Math.random() * n);
// Devolve uma cópia embaralhada da lista (usada nas alternativas).
// Como funciona: método de Fisher-Yates, que troca cada item com outro de posição sorteada.
// Por que existe: impede que a resposta certa apareça sempre no mesmo lugar.
const sh = a => {
  a = [...a];
  for (let i = a.length - 1; i > 0; i--) {
    const j = rnd(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
// O que faz: guarda o número de casas (21). Chegar a essa posição significa chegar à Sanção.
// Por que existe: se casas forem acrescentadas em CASAS, a Sanção se ajusta sozinha.

// Como funciona: começa com valores padrão e, se o navegador tiver dados salvos na chave "jv1", eles são copiados por cima.
// Por que existe: lembra o recorde e o nome entre uma visita e outra, sem enviar nada para fora do aparelho.
// Como interage: iniciar() grava o nome e o tratamento; vitoria() soma uma lei; fimDeJogo() atualiza o recorde; vMenu() exibe o recorde.
let P = { best: 0, leis: 0, nome: '', trat: 'a' };
try {
  Object.assign(P, JSON.parse(localStorage.getItem('jv1') || '{}'));
} catch (e) {}
// Grava a caderneta no navegador. Se o navegador não permitir, o jogo segue sem gravar.
// Como funciona: transforma P em texto (JSON) e grava no localStorage do navegador.

const save = () => {

/*

O que faz: guarda tudo o que o jogo precisa lembrar naquele momento.

/* ---------- utilitários de tela ---------- */
// Bipe curto gerado pelo próprio navegador (f = frequência em Hz, d = duração em segundos).
// Como funciona: cria um oscilador de som (onda quadrada) por uma fração de segundo; AC guarda o gerador de áudio para reutilizá-lo.

    o.frequency.value = f;
    o.type = 'square';
    g.gain.value = 0.05;
    o.connect(g);
    g.connect(AC.destination);
    o.start();
    o.stop(AC.currentTime + d);

};

const tit = () => (G.trat == 'a' ? 'Vereadora' : 'Vereador');

const cargo = (xp = G.xp) => {

const mul = () => 1 + Math.min(4, Math.floor(G.cb / 3));

const casa = () => CASAS[Math.min(G.pos, FIM - 1)];

/* ---------- pergunta atual ---------- */
// Pergunta que está na tela agora.
// Como funciona: lê G.q (origem, lista e posição) e busca a pergunta em Q ou em EVENTOS.
// Como interage: usada por responder() e vPalco().
function cur() {
  const q = G.q;
  return q.src == 'evento' ? EVENTOS[q.ev].qs[q.k] : Q[q.pool][q.k];
}
// Sorteia um índice ainda não usado da lista; quando todos saíram, recomeça.
// Por que existe: evita que a mesma pergunta se repita na partida antes de a lista acabar.
// Como interage: guarda os índices usados em G.vistos[chave].
function sorteia(chave, total) {
  // v = índices já sorteados desta lista
  const v = G.vistos[chave] || (G.vistos[chave] = []);
  // se todos já saíram, esvazia a lista e recomeça
  if (v.length >= total) v.length = 0;
  // entre os que ainda não saíram, escolhe um ao acaso e o marca como usado
  const livres = [...Array(total).keys()].filter(i => !v.includes(i));
  const k = livres[rnd(livres.length)];
  v.push(k);
  return k;
}
/*
========================================================================
novaPergunta(): preparação da pergunta
========================================================================
Quando é chamada: por desafio() (pergunta da etapa ou de evento) e por
continuar() (pergunta extra da carta Questionamento jurídico).
Fluxo:
  Origem da pergunta
  ↓
  Etapa → lista da etapa em Q
  Extra → lista procuradoria ou ccl (sorteio entre as duas)
  Evento → lista qs do evento
  ↓
  sorteia() uma pergunta ainda não usada daquela lista
  ↓
  Embaralha a ordem das alternativas e limpa ajuda e resposta anteriores
  ↓
  fase 'q': pergunta aberta na tela
========================================================================
*/
// Prepara a próxima pergunta (da etapa, de um evento ou extra) e embaralha as alternativas.
function novaPergunta(src, extra) {
  // de onde vem a pergunta: da etapa atual, das etapas jurídicas (carta extra) ou de um evento
  if (src == 'etapa') {
    const pool = etapa().id;
    G.q = { src, pool, k: sorteia(pool, Q[pool].length) };
  } else if (src == 'extra') {
    const pool = rnd(2) ? 'procuradoria' : 'ccl';
    G.q = { src, pool, k: sorteia(pool, Q[pool].length) };
  } else {
    const ev = extra;
    G.q = { src, ev, k: sorteia('ev' + ev, EVENTOS[ev].qs.length) };
  }
  // ordem embaralhada das quatro alternativas (1 = certa); limpa ajuda e resposta anteriores
  G.q.ops = sh([1, 2, 3, 4]);
  G.hid = [];
  G.resp = null;
  G.fase = 'q';
}

/* ---------- efeitos ---------- */
// Mantém um valor entre 0 e 100.
// Por que existe: legalidade e apoios são medidos de 0 a 100.
const lim = v => Math.max(0, Math.min(100, v));
/*
========================================================================
aplicar(): aplicação dos efeitos
========================================================================
Quando é chamada: por responder() e por desafio() (cartas).
O que faz: lança na comanda G cada item da ficha de efeitos fx.
Fluxo:
  Ficha de efeitos (exemplo: xp 20, leg 12, mes -2)
  ↓
  Soma cada item: XP; barras limitadas entre 0 e 100; meses nunca abaixo
  de 0; vidas entre 0 e o máximo de REGRAS
  ↓
  Apoio popular zerou? → sim → volta a 15 e o apoio político perde 15
  ↓
  Subiu de cargo? → guarda o novo cargo em G.subiu para o aviso na tela
========================================================================
*/
// Lança na comanda os efeitos de uma resposta ou carta (fx = { xp, leg, pop, pol, mes, vida }).
function aplicar(fx) {
  // guarda o cargo atual para saber, no fim, se o jogador subiu
  const antes = cargo();
  // soma cada efeito presente na ficha; as barras ficam sempre entre 0 e 100
  if (fx.xp) G.xp += fx.xp;
  if (fx.leg) G.leg = lim(G.leg + fx.leg);
  if (fx.pop) G.pop = lim(G.pop + fx.pop);
  if (fx.pol) G.pol = lim(G.pol + fx.pol);
  if (fx.mes) G.mes = Math.max(0, G.mes + fx.mes);
  if (fx.vida) G.vidas = Math.max(0, Math.min(REGRAS.vidas, G.vidas + fx.vida));
  // regra especial: apoio popular zerado volta a 15 e custa 15 de apoio político
  G.aviso = '';
  if (G.pop <= 0) {
    G.pop = 15;
    G.pol = lim(G.pol - 15);
    G.aviso = 'Sem apoio popular, os colegas recuaram: −15 de apoio político.';
  }
  // -1 = não subiu; senão, guarda o índice do novo cargo para o aviso na tela
  G.subiu = cargo() > antes ? cargo() : -1;
}
/*
========================================================================
derrota(): verificação de derrota
========================================================================
Quando é chamada: depois de cada resposta e de cada carta.
Fluxo:
  Vidas = 0?           → SEM VIDAS
  ↓ não
  Legalidade = 0?      → PROJETO ARQUIVADO (RI, art. 170, § 1º)
  ↓ não
  Apoio político = 0?  → PROJETO REJEITADO
  ↓ não
  Mandato = 0?         → FIM DO MANDATO (LOM, art. 6º, § 1º)
  ↓ não
  null: o jogo continua
O resultado fica em G.perdeu; continuar() leva à tela final quando houver
derrota.
========================================================================
*/
// Verifica as quatro condições de derrota. Devolve [título, texto] ou null (jogo segue).
function derrota() {
  // testa nesta ordem: vidas, legalidade, apoio político e mandato
  if (G.vidas <= 0)
    return [
      'SEM VIDAS',
      'Seu gabinete errou demais e perdeu o fôlego. O projeto ficou parado na casa ' +
        (G.pos + 1) +
        '.',
    ];
  if (G.leg <= 0)
    return [
      'PROJETO ARQUIVADO',
      'A legalidade chegou a zero. Com parecer pela inconstitucionalidade ou ilegalidade, a proposição vai ao arquivo (RI, art. 170, § 1º).',
    ];
  if (G.pol <= 0)
    return [
      'PROJETO REJEITADO',
      'Sem apoio político, o projeto não teve votos suficientes e foi arquivado.',
    ];
  if (G.mes <= 0)
    return [
      'FIM DO MANDATO',
      'Os 48 meses de mandato acabaram antes da sanção. Uma legislatura dura quatro anos (LOM, art. 6º, § 1º).',
    ];
  return null;
}
// Etiquetas coloridas com os efeitos da resposta (+XP, −vida, ±barras, casas).
// Quando aparece: depois de cada resposta e em cada carta.
// Por que existe: mostra ao jogador a consequência de cada decisão, que é o centro do aprendizado.
function chips(fx, mov) {
  // o = etiquetas; s = número com sinal (+3, −2); c = classe verde (up) ou laranja (dn)
  const o = [],
    s = (v, u = '') => (v > 0 ? '+' : '−') + Math.abs(v) + u,
    c = v => (v > 0 ? 'up' : 'dn');
  if (fx.xp) o.push(`<span class="up">+${fx.xp} XP</span>`);
  if (fx.vida) o.push(`<span class="${c(fx.vida)}">❤️ ${s(fx.vida)}</span>`);
  if (fx.leg) o.push(`<span class="${c(fx.leg)}">⚖️ ${s(fx.leg)}</span>`);
  if (fx.pop) o.push(`<span class="${c(fx.pop)}">📣 ${s(fx.pop)}</span>`);
  if (fx.pol) o.push(`<span class="${c(fx.pol)}">🤝 ${s(fx.pol)}</span>`);
  if (fx.mes)
    o.push(
      `<span class="${c(fx.mes)}">⏳ ${s(fx.mes, Math.abs(fx.mes) == 1 ? ' mês' : ' meses')}</span>`,
    );
  if (mov > 1) o.push(`<span class="up">Avance ${mov} casas</span>`);
  if (mov < 0) o.push(`<span class="dn">Volte 1 casa</span>`);
  if (G.subiu >= 0) o.push(`<span class="nv">Novo cargo: ${nomeCargo(G.subiu)}</span>`);
  return `<div class="fx">${o.join('')}</div>` + (G.aviso ? `<p class="sub">${G.aviso}</p>` : '');
}

/*
========================================================================
DOCUMENTAÇÃO DE FLUXO: visão geral das funções principais
========================================================================
Ordem em que as funções se chamam durante uma partida:

  iniciar()           o jogador clica em PROTOCOLAR O PROJETO
     ↓
  entrar()            chega a uma casa
     ↓
  desafio()           decide o que a casa traz
     ↓
  novaPergunta()      (pergunta ou evento)      ou      carta aplicada
     ↓                                                    ↓
  responder()         corrige e aplica efeitos            ↓
     ↓                                                    ↓
  continuar()  ←──────────────────────────────────────────┘
     ↓
  entrar()            próxima casa (o ciclo se repete)
     ↓
  vitoria()  ou  derrota()  →  fimDeJogo()  →  tela final

aplicar() é chamada sempre que algo muda os indicadores; consultar() pode
ser usada enquanto uma pergunta está aberta.
========================================================================
*/
/* ---------- fluxo ---------- */
/*
========================================================================
iniciar(): começo da partida
========================================================================
Quando é chamada: ao clicar em PROTOCOLAR O PROJETO, ao teclar Enter no
campo do projeto ou ao escolher TENTAR DE NOVO depois de uma derrota.
O que faz: confere o formulário, grava o nome no aparelho e cria a comanda.
Fluxo:
  Formulário do menu
  ↓
  Nome tem pelo menos 2 letras e projeto pelo menos 5?
  ↓ não → mostra o aviso no menu e para
  ↓ sim
  Grava nome e tratamento na caderneta P
  ↓
  Cria a comanda G com os valores de REGRAS (5 vidas, 48 meses...)
  ↓
  entrar() na casa 0
========================================================================
*/
// Valida o formulário do menu e cria uma comanda nova para a partida.
function iniciar() {
  // tira espaços sobrando do nome e do projeto
  const nome = G.nome.trim().replace(/\s+/g, ' '),
    proj = G.proj.trim().replace(/\s+/g, ' ');
  // sem nome ou sem projeto: mostra o aviso e não começa
  if (nome.length < 2) {
    G.err = 'Escreva o seu nome para assumir o mandato.';
    return render();
  }
  if (proj.length < 5) {
    G.err = 'Escreva o seu projeto de lei ou toque em um exemplo.';
    return render();
  }
  // lembra nome e tratamento para a próxima visita
  P.nome = nome;
  P.trat = G.trat;
  save();
  G = {
    tela: 'jogo',
    trat: G.trat,
    nome,
    proj,
    num: 1 + rnd(300), // número fictício do projeto de lei
    ano: new Date().getFullYear(),
    pos: 0,
    vidas: REGRAS.vidas,
    mes: REGRAS.meses,
    leg: REGRAS.leg,
    pop: REGRAS.pop,
    pol: REGRAS.pol,
    xp: 0,
    cb: 0, // acertos seguidos
    cons: REGRAS.consultas, // consultas à Procuradoria restantes
    vistos: {}, // perguntas já sorteadas, por lista
    feitos: [], // casas especiais já resolvidas
    evUsados: [], // eventos já sorteados
    ctUsadas: [], // cartas já sorteadas
    etapaVista: -1, // última etapa cuja apresentação já foi mostrada
    acertos: 0,
    erros: [], // perguntas erradas, para a lista Para rever
    subiu: -1,
    aviso: '',
    sair: false,
  };
  // bipe de início e primeira casa
  beep(520);
  entrar();
}
/*
========================================================================
entrar(): chegada a uma casa
========================================================================
Quando é chamada: no início da partida e depois de cada movimento do peão.
Fluxo:
  Posição atual
  ↓
  Passou da última casa? → sim → vitoria()
  ↓ não
  É a primeira casa de uma etapa nova? → sim → mostra a apresentação da
  etapa (fase 'etapa'); o botão ENTRAR chama desafio()
  ↓ não
  desafio()
========================================================================
*/
// Chega a uma casa: vitória (Sanção), apresentação da etapa nova ou desafio.
function entrar() {
  // passou da última casa: chegou à Sanção
  if (G.pos >= FIM) return vitoria();
  // primeira casa de uma etapa nova: mostra a apresentação antes do desafio
  if (casa().e > G.etapaVista) {
    G.fase = 'etapa';
    return render();
  }
  desafio();
}
/*
========================================================================
desafio(): o que a casa traz
========================================================================
Quando é chamada: por entrar() ou pelo botão ENTRAR da apresentação.
Fluxo:
  Tipo da casa (campo t de CASAS)
  ↓
  Evento ou carta já resolvidos? → sim → pula para a casa seguinte
  ↓ não
  'q'  → novaPergunta('etapa')
  'ev' → sorteia um evento não usado → novaPergunta('evento')
  'ct' → sorteia uma carta não usada → aplicar() os efeitos
         → calcula o movimento → derrota()? → mostra a carta
  ↓
  render()
========================================================================
*/
// Resolve a casa atual: pergunta da etapa, evento sorteado ou carta sorteada.
function desafio() {
  const c = casa();
  // casa especial já resolvida (acontece ao voltar uma casa): pula para a próxima
  if (c.t != 'q' && G.feitos.includes(G.pos)) {
    G.pos++;
    return entrar();
  }
  // casa de pergunta
  if (c.t == 'q') novaPergunta('etapa');
  // casa de evento: sorteia um evento ainda não usado nesta partida
  else if (c.t == 'ev') {
    let l = EVENTOS.map((x, i) => i).filter(i => !G.evUsados.includes(i));
    if (!l.length) {
      G.evUsados = [];
      l = EVENTOS.map((x, i) => i);
    }
    const ev = l[rnd(l.length)];
    G.evUsados.push(ev);
    novaPergunta('evento', ev);
  } else {
    // casa de carta: sorteia uma carta ainda não usada e aplica o efeito na hora
    let l = CARTAS.map((x, i) => i).filter(i => !G.ctUsadas.includes(i));
    if (!l.length) {
      G.ctUsadas = [];
      l = CARTAS.map((x, i) => i);
    }
    const k = l[rnd(l.length)];
    G.ctUsadas.push(k);
    G.carta = k;
    G.feitos.push(G.pos);
    const fx = CARTAS[k].fx;
    aplicar(fx);
    // casas a andar: 0 se houver pergunta extra; até 2 à frente sem pular a última pergunta; 1 para trás; ou 1
    G.mov = fx.extra
      ? 0
      : fx.casa > 0
        ? Math.max(1, Math.min(fx.casa, FIM - 1 - G.pos))
        : fx.casa < 0
          ? -1
          : 1;
    G.perdeu = derrota();
    G.fase = 'carta';
    beep(CARTAS[k].bom ? 700 : 200, 0.18);
  }
  render();
}
/*
========================================================================
responder(): correção da resposta
========================================================================
Quando é chamada: ao clicar numa alternativa (ação resp de ACT).
Fluxo:
  Pergunta
  ↓
  Resposta (alternativa clicada)
  ↓
  Correção (certa = posição 1 da pergunta)
  ↓
  Monta a ficha de efeitos fx e o movimento mov:
    pergunta da etapa: acerto → XP + efeitos ok da etapa, anda 1 casa;
                       erro   → perde 1 vida + efeitos no, fica na casa
    evento:            acerto → XP + efeitos ok; erro → efeitos no
                       (pode voltar 1 casa), sem perder vida
    extra:             acerto → XP e +8 de legalidade; erro → -20
  ↓
  Desconta os meses da resposta (REGRAS.custoPergunta)
  ↓
  Aplicação de Efeitos: aplicar(fx)
  ↓
  Verificação de Derrota: derrota() (exceto quando o acerto leva à Sanção)
  ↓
  Mostra a resposta comentada; o botão chama continuar() → Próxima Casa
========================================================================
*/
// Corrige a resposta (a certa é sempre o índice 1), aplica os efeitos e verifica a derrota.
function responder(i) {
  // só aceita resposta enquanto a pergunta está aberta
  if (G.fase != 'q') return;
  const q = cur(),
    ok = i == 1, // a certa é sempre o índice 1
    src = G.q.src;
  let fx = {},
    mov = 0;
  // conta os acertos seguidos e guarda os erros para a lista Para rever
  if (ok) {
    G.cb++;
    G.acertos++;
  } else {
    G.cb = 0;
    G.erros.push([q[0], q[1], q[6]]);
  }
  // monta a ficha de efeitos (fx) e o movimento (mov) conforme a origem da pergunta
  if (src == 'etapa') {
    if (ok) {
      fx = { xp: REGRAS.xpPergunta * mul(), ...etapa().ok };
      mov = 1;
    } else fx = { vida: -1, ...etapa().no };
  } else if (src == 'evento') {
    const ev = EVENTOS[G.q.ev];
    G.feitos.push(G.pos);
    if (ok) {
      fx = { xp: REGRAS.xpEvento * mul(), ...ev.ok };
      mov = 1;
    } else {
      fx = { ...ev.no };
      mov = fx.casa < 0 ? -1 : 1;
      delete fx.casa;
    }
  } else {
    if (ok) fx = { xp: REGRAS.xpPergunta * mul(), leg: 8 };
    else fx = { leg: -20 };
    mov = 1;
  }
  // toda resposta custa meses de mandato
  fx.mes = (fx.mes || 0) - REGRAS.custoPergunta;
  aplicar(fx);
  G.mov = mov;
  G.resp = { i, ok, fx };
  // se o acerto leva à Sanção, a vitória vale mesmo com o mandato zerado
  G.perdeu = ok && G.pos + mov >= FIM ? null : derrota();
  G.fase = 'resp';
  beep(ok ? 660 + G.cb * 30 : 150, ok ? 0.1 : 0.25);
  render();
  // erro: a tela treme por um instante
  if (!ok) {
    app.classList.add('shk');
    setTimeout(() => app.classList.remove('shk'), 260);
  }
}
/*
========================================================================
continuar(): depois da resposta ou da carta
========================================================================
Quando é chamada: pelo botão abaixo da resposta comentada ou da carta.
Fluxo:
  Houve derrota? → sim → fimDeJogo(derrota)
  ↓ não
  Carta de questionamento jurídico? → sim → novaPergunta('extra')
  ↓ não
  Move o peão: posição + mov (nunca abaixo de 0)
  ↓
  entrar() na nova casa
========================================================================
*/
// Depois da resposta ou da carta: encerra, abre a pergunta extra ou move o peão.
function continuar() {
  // houve derrota: vai para a tela final
  if (G.perdeu) return fimDeJogo(false, G.perdeu);
  // carta de questionamento jurídico: abre a pergunta extra
  if (G.fase == 'carta' && CARTAS[G.carta].fx.extra) {
    novaPergunta('extra');
    return render();
  }
  // move o peão e chega à nova casa
  G.pos = Math.max(0, G.pos + G.mov);
  entrar();
}
/*
========================================================================
consultar(): ajuda da Procuradoria
========================================================================
Quando é chamada: pelo botão Consultar a Procuradoria, com uma pergunta
aberta.
Fluxo:
  Pode consultar? (pergunta aberta, consultas restantes, ainda não usada
  nesta pergunta e meses suficientes)
  ↓ não → nada acontece (o botão já aparece desativado)
  ↓ sim
  Gasta 1 consulta e 1 mês
  ↓
  Esconde duas das três alternativas erradas, ao acaso
  ↓
  render()
========================================================================
*/
// Ajuda da Procuradoria: esconde duas alternativas erradas e custa 1 mês.
function consultar() {
  if (
    G.fase != 'q' ||
    G.cons <= 0 ||
    G.hid.length ||
    G.mes <= REGRAS.custoPergunta + REGRAS.custoConsulta
  )
    return;
  G.cons--;
  G.mes -= REGRAS.custoConsulta;
  // esconde duas das três alternativas erradas, ao acaso
  G.hid = sh([2, 3, 4]).slice(0, 2);
  beep(440);
  render();
}
/*
========================================================================
vitoria(): chegada à Sanção
========================================================================
Quando é chamada: por entrar(), quando o peão passa da última casa.
Fluxo:
  Calcula o bônus: 100 + 5 por mês restante + 20 por vida restante
  ↓
  Soma o bônus ao XP e uma lei à caderneta P
  ↓
  fimDeJogo(vitória)
========================================================================
*/
// Bônus da sanção: 100 + 5 por mês restante + 20 por vida.
function vitoria() {
  const bonus = 100 + G.mes * 5 + G.vidas * 20;
  G.bonus = bonus;
  G.xp += bonus;
  P.leis = (P.leis || 0) + 1;
  fimDeJogo(true);
}
/*
========================================================================
fimDeJogo(): encerramento da partida
========================================================================
Quando é chamada: por vitoria() ou por continuar() (derrota).
Fluxo:
  Marca a tela 'fim' e guarda se foi vitória e o motivo da derrota
  ↓
  XP maior que o recorde? → sim → novo recorde na caderneta P
  ↓
  Grava a caderneta no navegador (save)
  ↓
  Toca o bipe final e desenha a tela final (render → vFim)
========================================================================
*/
// Encerra a partida, atualiza o recorde e mostra a tela final.
function fimDeJogo(win, motivo) {
  G.tela = 'fim';
  G.win = win;
  G.motivo = motivo || null;
  G.novoRecorde = G.xp > (P.best || 0);
  if (G.novoRecorde) P.best = G.xp;
  save();
  beep(win ? 880 : 120, win ? 0.3 : 0.4);
  render();
}

/* ---------- telas ---------- */
/*
========================================================================
vMenu(): tela do menu inicial
========================================================================
Quando aparece: ao abrir o jogo e ao voltar ao menu (G.tela = 'menu').
Papel: receber os dados do jogador e iniciar a partida.
Informações exibidas: título do jogo, mascote com mensagem de boas-vindas,
instruções "Como se joga", escolha Vereadora/Vereador, campos de nome e de
projeto, exemplos de projeto, aviso de erro do formulário, botão
PROTOCOLAR O PROJETO e recorde do aparelho.
========================================================================
*/
// Tela do menu inicial: título, mascote, instruções e formulário do gabinete.
function vMenu() {
  // O HTML das telas é montado como texto; cada ${...} insere um valor da comanda G.
  return `<div class="hub"><div class="hl"><span class="rb">Câmara Municipal de Campinas</span><h1 class="t" style="font-size:clamp(30px,4vw,48px)">JOGO<br>JOVEM PARLAMENTAR</h1>
${msb('Você ganhou um mandato! Leve o seu projeto de lei do Protocolo até a sanção do Prefeito.', 'h')}

// Uma barra do painel (ic = ícone, v = valor de 0 a 100, txt = texto opcional no lugar do número).
// Como interage: chamada quatro vezes por hud(), uma para cada barra; barras com 25 ou menos ficam em laranja.
function med(ic, nome, v, k, txt) {
  return `<div class="md ${v <= 25 ? 'lo' : ''}"><span>${ic} ${nome}</span><b>${txt ?? Math.round(v)}</b><div class="bx ${k}"><i style="width:${v}%"></i></div></div>`;
}
/*
========================================================================
hud(): painel do mandato
========================================================================
Quando aparece: durante toda a partida, no topo da coluna esquerda (no
celular, no topo da tela).
Papel: mostrar a situação do jogador de relance.
Informações exibidas: tratamento e nome, número e título do projeto, vidas
(corações), cargo atual, barra de progresso até o próximo cargo, XP e
multiplicador, e as barras de legalidade, apoio popular, apoio político e
mandato. Barras com 25 ou menos ficam em laranja.
========================================================================
*/
// Painel do mandato: nome, projeto, vidas, cargo, XP e as quatro barras.
function hud() {
  const c = cargo(),
    nx = CARGOS[c + 1],
    pc = nx ? ((G.xp - CARGOS[c][0]) / (nx[0] - CARGOS[c][0])) * 100 : 100;
  return `<div class="hud"><div class="hj"><div class="hn"><b>${esc(tit() + ' ' + G.nome)}</b><span>PL nº ${G.num}/${G.ano} · ${esc(G.proj)}</span></div><div class="hv" role="img" aria-label="${G.vidas} de ${REGRAS.vidas} vidas">${'❤️'.repeat(G.vidas)}${'🖤'.repeat(REGRAS.vidas - G.vidas)}</div></div>
<div class="hc"><span class="rb">${nomeCargo(c)}</span><div class="bx"><i style="width:${pc}%"></i></div><span class="xv">${G.xp} XP${mul() > 1 ? ` · x${mul()} 🔥` : ''}</span></div>
<div class="ms4">${med('⚖️', 'Legalidade', G.leg, 'leg')}${med('📣', 'Apoio popular', G.pop, 'pop')}${med('🤝', 'Apoio político', G.pol, 'pol')}${med('⏳', 'Mandato', (G.mes / REGRAS.meses) * 100, 'mes', G.mes + (G.mes == 1 ? ' mês' : ' meses'))}</div></div>`;
}
/*
========================================================================
tab(): tabuleiro
========================================================================
Quando aparece: durante toda a partida, abaixo do painel.
Papel: mostrar onde o projeto está na tramitação.
Informações exibidas: as 7 etapas com suas casas (verde = concluída,
amarela com o mascote = atual, ❗ = evento, 🃏 = carta, número = pergunta)
e a casa final da Sanção. Em tela larga forma uma serpente; no celular,
uma faixa de progresso.
========================================================================
*/
// Tabuleiro: casas concluídas, casa atual (com o peão) e casas futuras.
function tab() {
  const at = casa().e;
  let h =
    '<div class="tab" role="img" aria-label="Tabuleiro: casa ' +
    (Math.min(G.pos, FIM) + 1) +
    ' de ' +
    (FIM + 1) +
    '">';
  // uma linha por etapa com suas casas; a casa atual mostra o peão (o mascote)
  ETAPAS.forEach((et, e) => {
    h += `<div class="et ${G.pos >= FIM || e < at ? 'feita' : e == at ? 'atual' : ''}"><div class="en"><b>${et.ic}</b><span>${et.nome}</span></div><div class="tr">${CASAS.map((c, i) => (c.e != e ? '' : `<i class="cs ${i == G.pos ? 'aqui' : i < G.pos || G.feitos.includes(i) ? 'ok' : ''}" title="${c.n}">${i == G.pos ? `<img src="${MIMG}" alt="">` : i < G.pos || G.feitos.includes(i) ? '✓' : c.t == 'ev' ? '❗' : c.t == 'ct' ? '🃏' : i + 1}</i>`)).join('')}</div></div>`;
  });
  return (
    h +
    `<div class="et fim ${G.pos >= FIM ? 'atual' : ''}"><div class="en"><b>🏛️</b><span>Sanção do Prefeito</span></div><div class="tr"><i class="cs sn ${G.pos >= FIM ? 'aqui' : ''}">SANÇÃO</i></div></div></div>`
  );
}
/*
========================================================================
cena(): faixa da etapa
========================================================================
Quando aparece: no topo da área central, em todas as fases do jogo.
Papel: situar o jogador no cenário da etapa.
Informações exibidas: número da etapa, local, nome da etapa, número e nome
da casa e o ícone. Usa a foto de FOTOS como fundo, quando houver.
========================================================================
*/
// Faixa escura com o nome da etapa e da casa (usa a foto de FOTOS, se houver).
function cena(gr) {
  const et = etapa(),
    f = FOTOS[et.id];
  return `<div class="cena ${gr ? 'gr' : ''}"${f ? ` style="background-image:linear-gradient(rgba(12,22,48,.74),rgba(12,22,48,.74)),url('${f}')"` : ''}><div><span class="ce">Etapa ${casa().e + 1} de ${ETAPAS.length} · 📍 ${et.local}</span><h2 class="t">${et.nome}</h2><span class="cc">Casa ${G.pos + 1} de ${FIM} · ${casa().n}</span></div><b class="ci">${et.ic}</b></div>`;
}

/*
========================================================================
vPalco(): centro da tela de jogo
========================================================================
Quando aparece: durante toda a partida, à direita do tabuleiro (no
celular, abaixo dele).
Papel: mostrar o desafio da vez, conforme G.fase:
  'etapa'  apresentação da etapa pelo mascote e botão ENTRAR;
  'carta'  carta de sorte ou revés com seus efeitos;
  'q'      pergunta com quatro alternativas e botão de consulta;
  'resp'   alternativas coloridas (verde = certa, laranja = escolhida
           errada), explicação com a fonte, efeitos e botão de continuar.
Nos eventos, mostra também a faixa amarela com a situação narrada.
========================================================================
*/
// Centro da tela de jogo, conforme a fase: apresentação, pergunta, resposta ou carta.
function vPalco() {
  // fase 'etapa': apresentação da etapa
  if (G.fase == 'etapa')
    return (
      cena(1) +
      msb(etapa().intro, 'h') +
      `<button class="go" data-a="abrir">${G.pos == 0 ? 'COMEÇAR A TRAMITAÇÃO' : 'ENTRAR'}</button>`
    );
  // fase 'carta': carta sorteada e seus efeitos
  if (G.fase == 'carta') {
    const c = CARTAS[G.carta];
    return (
      cena() +
      `<div class="cr ${c.bom ? 'bom' : 'mau'}"><span class="tp">${c.bom ? 'CARTA DE SORTE' : 'CARTA DE REVÉS'}</span><span class="ic">${c.ic}</span><h2 class="t">${c.nome}</h2><p>${c.txt}</p>${chips(c.fx, G.mov)}</div><button class="go" data-a="continuar">${G.perdeu ? 'VER RESULTADO' : c.fx.extra ? 'RESPONDER' : 'CONTINUAR'}</button>`
    );
  }
  // fases 'q' (pergunta aberta) e 'resp' (resposta comentada)
  const q = cur(),
    r = G.resp,
    src = G.q.src,
    ev = src == 'evento' ? EVENTOS[G.q.ev] : null;
  // texto do balão do mascote
  const fala = r
    ? `<b>${r.ok ? 'Isso mesmo!' : 'Não foi desta vez.'}</b> ${esc(q[5])}<br><span class="rf">${esc(q[6])}</span>`
    : src == 'evento'
      ? 'Evento! Responda bem para sair fortalecido.'
      : src == 'extra'
        ? 'Questionamento jurídico! Responda para o projeto seguir.'
        : `${casa().n}: acerte para avançar uma casa.`;
  return (
    cena() +
    (ev
      ? `<div class="evb"><i>${ev.ic}</i><div><b>EVENTO · ${ev.nome.toUpperCase()}</b>${ev.txt}</div></div>`
      : '') +
    msb(fala, r ? (r.ok ? 'h' : 's') : 'n') +
    `<div class="card qc">${esc(q[0])}</div>
<div id="o">${G.q.ops.map(i => `<button data-a="resp" data-v="${i}" ${r || G.hid.includes(i) ? 'disabled' : ''} class="${r ? (i == 1 ? 'okb' : i == r.i ? 'nob' : '') : G.hid.includes(i) ? 'hid' : ''}">${esc(q[i])}</button>`).join('')}</div>` +
    (r
      ? chips(r.fx, src == 'etapa' ? 0 : G.mov) +
        `<button class="go" data-a="continuar">${G.perdeu ? 'VER RESULTADO' : G.pos + G.mov >= FIM ? 'RECEBER A SANÇÃO' : G.mov > 0 ? 'AVANÇAR' : G.mov < 0 ? 'VOLTAR UMA CASA' : 'TENTAR OUTRA PERGUNTA'}</button>`
      : `<button class="lf" data-a="consultar" ${G.cons > 0 && !G.hid.length && G.mes > REGRAS.custoPergunta + REGRAS.custoConsulta ? '' : 'disabled'}>💡 Consultar a Procuradoria (${G.cons}) · custa 1 mês</button>`)
  );
}
/*
========================================================================
vJogo(): tela de jogo
========================================================================
Quando aparece: do início ao fim da partida (G.tela = 'jogo').
Papel: montar a tela de jogo juntando hud(), tab() e vPalco().
Informações exibidas: as das três partes e, quando o botão MENU é clicado,
o aviso "Sair da partida?".
========================================================================
*/
// Tela de jogo completa: painel e tabuleiro à esquerda, palco à direita, aviso de saída.
function vJogo() {
  return (
    `<div class="jg"><aside class="pl">${hud()}${tab()}</aside><section class="st">${vPalco()}</section></div>` +
    (G.sair
      ? `<div class="ov"><div class="card"><b>Sair da partida?</b><span class="sub">O andamento do projeto será perdido.</span><button class="go" data-a="ficar">CONTINUAR JOGANDO</button><button data-a="sair">Sair para o menu</button></div></div>`
      : '')
  );
}

/*
========================================================================
vFim(): tela final
========================================================================
Quando aparece: quando a partida termina (G.tela = 'fim').
Papel: mostrar o resultado e reforçar o aprendizado.
Informações exibidas: na vitória, "SANÇÃO!", a mensagem de parabéns e o
certificado da lei com o projeto e o autor; na derrota, o motivo e o
projeto. Nos dois casos: cargo alcançado, XP, acertos, meses restantes,
casa alcançada, botões para jogar de novo ou voltar ao menu e a lista
"Para rever" com as perguntas erradas, a resposta certa e a fonte.
========================================================================
*/
// Tela final: certificado da lei ou motivo da derrota, números da partida e erros para rever.
function vFim() {
  const total = G.acertos + G.erros.length;
  const res = `<div class="rs"><div><b>${G.xp}</b>XP${G.novoRecorde ? ' · recorde!' : ''}</div><div><b>${G.acertos}/${total}</b>acertos</div><div><b>${G.mes}</b>meses restantes</div><div><b>${Math.min(G.pos, FIM) + 1}/${FIM + 1}</b>casa alcançada</div></div>`;
  const rev = G.erros.length
    ? `<div class="rv"><h2 class="t">Para rever</h2>${G.erros.map(e => `<div><b>${esc(e[0])}</b>${esc(e[1])} <span class="rf">${esc(e[2])}</span></div>`).join('')}</div>`
    : '';
  const bt = `<div class="bt"><button class="go" data-a="denovo">${G.win ? 'NOVO MANDATO' : 'TENTAR DE NOVO'}</button><button data-a="sair">Menu</button></div>`;
  // vitória: certificado da lei; derrota: motivo e projeto
  if (G.win)
    return `<div class="fimg"><div><div class="big">SANÇÃO!</div>${msb('Parabéns. Seu projeto foi transformado em lei municipal.', 'h')}
<div class="lei"><span class="lt">LEI MUNICIPAL</span><q>${esc(G.proj)}</q><span class="au">Projeto de Lei nº ${G.num}/${G.ano} · Autoria: ${esc(tit() + ' ' + G.nome)}</span><span class="sel">SANCIONADA</span></div></div>
<div><span class="rb" style="align-self:flex-start">${nomeCargo(cargo())}</span>${res}<p class="sub">Bônus da sanção: +${G.bonus} XP (mandato e vidas que sobraram).</p>${bt}${rev}</div></div>`;
  return `<div class="fimg"><div><div class="big dr">${G.motivo[0]}</div>${msb(G.motivo[1] + ' Todo projeto pode ser reapresentado: tente outra vez!', 's')}
<div class="card"><b>${esc(G.proj)}</b><br><span class="sub">PL nº ${G.num}/${G.ano} · ${esc(tit() + ' ' + G.nome)} · parou em ${etapa().nome}</span></div></div>
<div><span class="rb" style="align-self:flex-start">${nomeCargo(cargo())}</span>${res}${bt}${rev}</div></div>`;
}

/*
========================================================================
render(): desenho da tela
========================================================================
Quando é chamada: depois de qualquer ação que mude a comanda G, e uma vez
quando a página termina de carregar.
Papel: escolher a tela certa e redesenhá-la por inteiro.
Como funciona: conforme G.tela, usa vMenu(), vJogo() ou vFim() e coloca o
resultado dentro da área #app. No menu, esconde o botão MENU do cabeçalho.
Por que existe: redesenhar tudo a partir de G garante que a tela nunca
mostre informação desatualizada.
========================================================================
*/
// Redesenha a tela inteira a partir da comanda G. É chamada depois de cada ação.
function render() {
  document.body.classList.toggle('home', G.tela == 'menu'); // no menu, esconde o botão MENU
  app.innerHTML = G.tela == 'menu' ? vMenu() : G.tela == 'fim' ? vFim() : vJogo();
}

/* ---------- ações ---------- */
// Ações dos botões. Cada botão indica a sua no atributo data-a (e o parâmetro em data-v).
// Como funciona: cada botão do HTML tem data-a="nome da ação"; o porteiro de cliques, logo abaixo, chama ACT[nome].
// Por que existe: um único lugar reúne tudo o que os botões fazem, o que facilita encontrar e mudar ações.
const ACT = {
  trat(v) { // escolhe Vereadora (a) ou Vereador (o)
    G.trat = v;
    G.err = '';
    render();
  },
  exemplo(v) { // preenche o projeto com um dos exemplos
    G.proj = EXEMPLOS[+v];
    G.err = '';
    render();
  },
  abrir() { // sai da apresentação da etapa e abre o desafio
    G.etapaVista = casa().e;
    beep(520);
    desafio();
  },
  resp(v) { // clicou numa alternativa
    responder(+v);
  },
  continuar,
  consultar,
  menu() { // botão MENU: durante o jogo, pergunta antes de sair
    if (G.tela == 'jogo') {
      G.sair = true;
      render();
    } else ACT.sair();
  },
  ficar() { // continua a partida
    G.sair = false;
    render();
  },
  sair() { // volta ao menu mantendo nome e tratamento
    G = { tela: 'menu', trat: G.trat, nome: G.nome, proj: '', err: '' };
    render();
  },
  denovo() { // tela final: novo mandato (vitória) ou tentar de novo (derrota)
    if (G.win) return ACT.sair();
    G.err = '';
    iniciar();
  },
};
// Porteiro: um único ouvinte para todos os cliques; chama ACT[data-a](data-v).
// Por que existe: como a tela é redesenhada a cada passo, os botões são recriados; um ouvinte único na página continua funcionando.
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return; // clique fora de um botão ou em botão desativado
  ACT[b.dataset.a](b.dataset.v);
});
// Guarda nome e projeto enquanto o jogador digita (sem redesenhar, para não perder o foco).
app.addEventListener('input', e => {
  if (e.target.id == 'nome') G.nome = e.target.value;
  if (e.target.id == 'proj') G.proj = e.target.value;
});
// Botão PROTOCOLAR O PROJETO e tecla Enter no campo do projeto iniciam a partida.
app.addEventListener('submit', e => {
  e.preventDefault();
  iniciar();
});
// O que faz: Enter no campo do projeto inicia a partida em vez de pular linha.
app.addEventListener('keydown', e => {
  if (e.target.id == 'proj' && e.key == 'Enter') {
    e.preventDefault();
    iniciar();
  }
});

/* ---------- inicialização ---------- */
// Desenha a primeira tela quando a página termina de carregar
// (as imagens ficam no último bloco <script>, no fim do arquivo).
// Por que existe: espera o navegador ler o arquivo inteiro, inclusive o bloco de imagens no fim, antes de desenhar.
window.addEventListener('DOMContentLoaded', render);
