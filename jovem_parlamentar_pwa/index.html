<!DOCTYPE html>
<!--

 JOGO JOVEM PARLAMENTAR · Câmara Municipal de Campinas 
  Jogo de tabuleiro sobre o processo legislativo municipal.
  HTML, CSS e JavaScript puros, em um único arquivo, sem servidor.

  Como este arquivo está organizado:
    1. <head>    título, fontes e estilos (CSS)
    2. <body>    cabeçalho com o logo e a área do jogo (#app)
    3. <script>  CONTEÚDO DO JOGO: perguntas, eventos, cartas e regras  <- edite aqui
    4. <script>  MOTOR DO JOGO: regras, telas e botões
    5. <script>  IMAGENS embutidas (logo e mascote) - não editar
-->
<!--
========================================================================
CABEÇALHO GERAL DO PROJETO
========================================================================
OBJETIVO DO JOGO
  Ensinar, de forma lúdica, o caminho que um projeto de lei percorre na
  Câmara Municipal de Campinas até ser sancionado pelo Prefeito. O jogador
  assume o papel de vereador(a), dá um título ao seu projeto e precisa
  levá-lo do Protocolo à Sanção respondendo a perguntas sobre as regras
  reais da tramitação.

BASE LEGAL UTILIZADA
  RI  = Regimento Interno da Câmara Municipal de Campinas (Resolução
        nº 842/2009, texto compilado até a Resolução nº 1.028/2025).
  LOM = Lei Orgânica do Município de Campinas.
  Cada pergunta cita o artigo de onde foi tirada (último campo da pergunta).

ESTRUTURA GERAL DO SISTEMA
  Página única feita com HTML, CSS e JavaScript puros: não usa servidor,
  banco de dados nem inteligência artificial para funcionar.
    1. ESTILOS (CSS, dentro de <head>): aparência de todas as telas.
    2. HTML MÍNIMO (<body>): cabeçalho com o logo e a área #app, onde o
       jogo é desenhado.
    3. CONTEÚDO (1º <script>): listas com etapas, casas, perguntas,
       eventos, cartas, cargos e regras. É a única parte que precisa ser
       editada para mudar o conteúdo do jogo.
    4. MOTOR (2º <script>): funções que aplicam as regras, guardam o
       estado da partida e desenham as telas.
    5. IMAGENS (3º <script>): logo e mascote convertidos em texto (base64).

FLUXO DO JOGO
  BOAS-VINDAS
    Tela de entrada com dois botões: INICIAR e COMO JOGAR (4 cartões que
    explicam o jogo) e um link discreto para instalar o jogo como app.
   ↓
  GABINETE
    O jogador escolhe Vereadora ou Vereador e digita nome e projeto.
   ↓
  Criação do Projeto
    O jogo cria a partida: projeto de lei com número fictício, 5 vidas,
    48 meses de mandato e nenhuma estrela.
   ↓
  Tramitação Legislativa
    7 etapas e 21 casas: Protocolo, Procuradoria, Constituição e
    Legalidade, Comissões Temáticas, Finanças e Orçamento, Plenário e
    Prefeitura. Cada etapa começa com uma explicação do mascote.
   ↓
  Perguntas (modelo ramificado de Norman Crowder)
    Duas casas por etapa. Acertar avança. Errar abre um pop-up que explica
    por que AQUELA alternativa está errada; só o botão OK o fecha, e o
    jogador volta à MESMA pergunta, com a alternativa descartada riscada.
    O 1º erro de cada pergunta custa uma vida. O acerto vale 3 ⭐ de
    primeira, 2 ⭐ na 2ª tentativa e 1 ⭐ na 3ª. O peão só anda quando o
    jogador acerta, e sempre para a frente.
   ↓
  Eventos
    Três casas, ao longo do percurso, sorteiam um imprevisto com pergunta
    (oposição, imprensa, audiência pública, pedido de vista, emenda...).
   ↓
  Cartas
    Quatro casas sorteiam uma carta de Sorte ou Azar, com efeito imediato
    (estrelas, vidas, meses ou avançar 2 casas; nenhuma carta faz voltar).
   ↓
  Votação
    Etapa Plenário: 1ª discussão (legalidade) e 2ª discussão (mérito).
   ↓
  Prefeitura
    Autógrafo enviado ao Prefeito, que sanciona ou veta.
   ↓
  Sanção
    Vitória: certificado da lei municipal e +1 ⭐ por vida que sobrou. Em
    qualquer momento, a partida termina em derrota se as vidas ou o
    mandato chegarem a zero.
========================================================================
-->
<!--
========================================================================
MODELO CONCEITUAL DO JOGO
========================================================================
GAMIFICAÇÃO
  O jogo usa poucos elementos de jogos, fáceis de entender (estrelas,
  cargos que funcionam como níveis, vidas, mandato, sorte e azar) para
  motivar o estudo de um conteúdo considerado técnico. As estrelas premiam
  quem acerta de primeira, e a subida de cargo dá sensação de progresso.

APRENDIZAGEM BASEADA EM PROBLEMAS
  O jogador não assiste a uma aula antes de jogar: recebe um problema
  concreto (aprovar o próprio projeto) e enfrenta situações que surgem no
  caminho, como um colega que pede vista, a Procuradoria que aponta um
  problema de iniciativa ou a imprensa que pede entrevista. O erro faz
  parte do aprendizado: toda resposta errada abre um pop-up com o
  comentário daquela alternativa e o artigo correspondente, e o jogador
  tenta de novo a mesma pergunta.

INSTRUÇÃO PROGRAMADA RAMIFICADA (NORMAN CROWDER)
  Na instrução ramificada de Crowder, cada resposta errada leva a uma
  explicação feita para aquele engano específico, e o aluno então volta
  à mesma pergunta. O jogo aplica o modelo assim: cada alternativa errada
  tem o seu comentário; o pop-up só fecha no OK; a alternativa descartada
  fica riscada; e as estrelas caem a cada nova tentativa, premiando quem acerta
  de primeira sem punir quem precisa do desvio para aprender.

EDUCAÇÃO PARA A CIDADANIA
  O jogo mostra que a lei municipal nasce de um processo com etapas,
  controles e participação. A população aparece na iniciativa popular, nas
  audiências públicas e no apoio popular; a imprensa e a oposição aparecem
  como parte normal da vida democrática.

ENSINO DO PROCESSO LEGISLATIVO
  O tabuleiro segue a ordem da tramitação: protocolo e admissibilidade
  (RI, arts. 125 a 128); assessoramento jurídico (LOM, art. 59); Comissão
  de Constituição e Legalidade (RI, art. 40); comissões de mérito (RI,
  arts. 39 e 42 a 56-E); Comissão de Finanças e Orçamento (RI, art. 41);
  duas discussões no Plenário (RI, art. 160); autógrafo (RI, art. 159);
  sanção ou veto do Prefeito (LOM, arts. 50 e 51).

RELAÇÃO COM O REGIMENTO INTERNO E A LEI ORGÂNICA
  As regras do jogo simplificam regras reais. Exemplos:
    - o parecer pela inconstitucionalidade leva o projeto ao arquivo (RI,
      art. 170, § 1º); no jogo, legalidade zero arquiva o projeto;
    - a legislatura dura quatro anos (LOM, art. 6º, § 1º); no jogo, o
      mandato tem 48 meses;
    - o pedido de vista atrasa a tramitação (RI, arts. 77 e 166); no jogo,
      custa meses ou faz voltar uma casa;
    - a Procuradoria presta assessoramento técnico-jurídico (LOM, art. 59);
      no jogo, a consulta à Procuradoria elimina alternativas erradas.
  Simplificação assumida: um projeto real nem sempre passa por todas as
  comissões e não depende de perguntas, mas a ordem das etapas e as regras
  citadas nas perguntas são as do texto legal.
========================================================================
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="theme-color" content="#323380">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <title>Jovem Parlamentar</title>
    <style>
      /* Fontes do informativo Notícias da Casa, guardadas na pasta fontes/
         (licença SIL OFL, arquivos OFL-*.txt na mesma pasta). */
      @font-face {
        font-family: 'Bebas Neue';
        src: url('./fontes/bebas-neue.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: Montserrat;
        src: url('./fontes/montserrat.woff2') format('woff2');
        font-weight: 300 800;
        font-display: swap;
      }
      /*
      ========================================================================
      ESTILOS (CSS)
      ========================================================================
      O que faz: define a aparência de todas as telas: cores, fontes, tamanhos,
      posições e animações.
      Como funciona: as cores e medidas ficam em variáveis no bloco :root (por
      exemplo, --a é o amarelo do mascote) e o restante do CSS usa essas
      variáveis. O layout é feito primeiro para celular e, a partir de 860 px de
      largura, ganha duas colunas (bloco @media no fim dos estilos).
      Por que existe: separar a aparência da lógica permite mudar o visual sem
      tocar nas regras do jogo.
      Como interage: o MOTOR gera o HTML das telas com nomes de classe (por
      exemplo, "card", "cs aqui", "okb"); cada classe tem aqui a sua aparência.
      ========================================================================
      */
      /* ---------- base: medidas da página ---------- */
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        padding: 0;
      }
      img {
        max-width: 100%;
      }
      [hidden]:not([hidden='until-found' i]) {
        display: none !important;
      }

      /* ---------- visual do jogo ---------- */
      /* Layout: cabeçalho com o logo; no jogo, painel do mandato + tabuleiro em serpente à esquerda e a cena da etapa à direita; coluna única no celular.
         Visual único e claro, o mesmo do Quiz do Memorial (azul do logotipo, amarelo do mascote, laranja nos detalhes). */
      /* ---------- cores, fontes e medidas (mude aqui para trocar o visual) ---------- */
      :root {
        /* paleta: azul-anil #323380 (pedido de Anderson, tom do portal da Câmara),
           com os tons claros derivados dele; fontes e layout do boletim Notícias da Casa */
        --bg: #ffffff; /* fundo da página (branco, como o boletim) */
        --g: transparent; /* pontinhos do fundo (desligados) */
        --pn: #fff; /* fundo dos painéis */
        --cx: #ebebf7; /* caixas claras (balão, quadros) */
        --cx2: #c9cbea; /* anil claro (casa atual, destaque do título) */
        --tx: #1f2133; /* texto */
        --mu: #555772; /* texto secundário */
        --a: #323380; /* azul-anil principal (faixas e botões) */
        --h: #323380; /* títulos */
        --b: #c0392b; /* vermelho (erros e alertas) */
        --c: #4a4db3; /* anil médio (destaques, casas feitas, filetes) */
        --c2: #6b6fd0; /* anil claro das faixas inferiores */
        --k: #d3d4e8; /* bordas finas */
        --nv: #323380; /* faixa da etapa */
        --nt: #fff; /* texto na faixa escura */
        --ok: #2e8b57; /* verde (acertos) */
        --ln: #dcdcec; /* linhas do tabuleiro */
        --su: #e3f2e8; /* fundo da etiqueta de ganho */
        --de: #f8e1dc; /* fundo da etiqueta de perda */
        --on: #fff; /* texto sobre o azul dos botões */
        --vl: rgba(26, 27, 70, 0.62); /* véu escuro do pop-up e do aviso de saída */
        --fd: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; /* títulos (como no boletim) */
        --fb: Montserrat, Arial, Helvetica, sans-serif; /* texto (como no boletim) */
        --cz: clamp(34px, 5.4vh, 50px); /* tamanho das casas do tabuleiro */
        --rg: clamp(8px, 1.5vh, 14px); /* espaço entre as linhas do tabuleiro */
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scrollbar-width: none;
      }
      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        display: none;
      }
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        background-image: radial-gradient(var(--g) 2px, transparent 2px);
        background-size: 22px 22px;
        color: var(--tx);
        font: 500 16px/1.45 var(--fb);
      }
      .t {
        font-family: var(--fd);
        letter-spacing: 1px;
        font-weight: 400;
      }
      h1,
      h2,
      p,
      ul {
        margin: 0;
      }
      h1,
      h2 {
        text-wrap: balance;
      }
      :focus-visible {
        outline: 3px solid var(--b);
        outline-offset: 2px;
      }
      #top {
        max-width: 560px;
        margin: 0 auto;
        padding: 12px 16px 0;
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
      }
      .lg {
        min-width: 0;
      }
      .lg img {
        display: block;
        height: 44px;
        max-width: 100%;
        width: auto;
        object-fit: contain;
      }
      #app {
        max-width: 560px;
        margin: 0 auto;
        padding-block: 12px 20px;
        padding-inline: 16px;
      }
      /* ---------- botões ---------- */
      button {
        font: 700 16px var(--fb);
        color: var(--tx);
        background: var(--pn);
        border: 1px solid var(--k);
        border-radius: 4px;
        padding: 12px;
        width: 100%;
        margin: 0;
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(30, 30, 60, 0.08);
        text-align: left;
        transition: transform 0.08s;
      }
      button:active:not(:disabled) {
        transform: translate(3px, 3px);
        box-shadow: 0 1px 2px rgba(30, 30, 60, 0.08);
      }
      button:disabled {
        opacity: 0.7;
        cursor: default;
      }
      .go {
        background: var(--a);
        color: var(--on);
        border-color: var(--on);
        box-shadow: 0 1px 2px rgba(30, 30, 60, 0.08);
        text-align: center;
      }
      #mn {
        width: auto;
        padding: 9px 14px;
        text-align: center;
        white-space: nowrap;
        font-size: 14px;
        background: var(--a);
        color: var(--on);
        border-color: var(--on);
        box-shadow: 0 1px 2px rgba(30, 30, 60, 0.08);
      }
      .home #mn {
        display: none;
      }
      .home .lg img {
        height: 54px;
      }
      /* ---------- etiquetas, cartões e barras ---------- */
      .rb {
        display: inline-block;
        background: var(--a);
        color: var(--on);
        font: 700 12px var(--fb);
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 3px 10px;
        border-radius: 99px;
        border: 1px solid var(--on);
      }
      .sub {
        color: var(--mu);
        font-size: 14px;
      }
      .card {
        background: var(--pn);
        border: 1px solid var(--k);
        border-radius: 4px;
        padding: 16px;
        box-shadow: 0 1px 2px rgba(30, 30, 60, 0.08);
      }
      .bx {
        height: 12px;
        border: 1px solid var(--k);
        border-radius: 8px;
        background: var(--pn);
        overflow: hidden;
      }
      .bx i {
        display: block;
        height: 100%;
        background: var(--a);
        transition: width 0.4s;
      }
      .bx.leg i {
        background: var(--c);
      }
      .bx.pop i {
        background: var(--b);
      }
      .bx.pol i {
        background: var(--ok);
      }
      /* ---------- mascote e balão de fala ---------- */
      .ms {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .ms img {
        flex: none;
      }
      .mc {
        display: block;
        filter: drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.35));
        animation: bo 2.2s ease-in-out infinite;
        transform-origin: 50% 100%;
      }
      .mc.xh {
        animation: pu 0.6s ease-out 2;
      }
      .mc.xs {
        animation: tl 0.5s ease-out 1;
        transform: rotate(-8deg);
      }
      @keyframes pu {
        0%,
        100% {
          transform: translateY(0) rotate(0);
        }
        30% {
          transform: translateY(-14px) rotate(-6deg);
        }
        60% {
          transform: translateY(-6px) rotate(6deg);
        }
      }
      @keyframes tl {
        0% {
          transform: rotate(0);
        }
        30% {
          transform: rotate(-14deg);
        }
        60% {
          transform: rotate(-2deg);
        }
        100% {
          transform: rotate(-8deg);
        }
      }
      @keyframes bo {
        50% {
          transform: translateY(-4px);
        }
      }
      .bb {
        flex: 1;
        min-width: 0;
        background: var(--pn);
        border: 1px solid var(--k);
        border-radius: 4px;
        padding: 10px 12px;
        font-size: 15px;
      }
      .rf {
        display: inline-block;
        margin-top: 6px;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--mu);
        border: 1px solid var(--ln);
        border-radius: 8px;
        padding: 1px 8px;
      }
      /* ---------- menu inicial ---------- */
      .hub {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .hl {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }
      h1 {
        font-size: 34px;
        line-height: 1.05;
        color: var(--h);
        text-shadow: none;
      }
      .how {
        font-size: 14.5px;
        box-shadow: none;
        background: var(--pn);
        padding: 12px 14px;
      }
      .how ul {
        padding-left: 18px;
        display: grid;
        gap: 4px;
        margin-top: 4px;
      }
      .fm {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      .fm h2 {
        font-size: 22px;
        color: var(--h);
      }
      .lb {
        font-weight: 700;
        font-size: 14px;
        display: block;
        margin-bottom: 4px;
      }
      input,
      textarea {
        font: 500 17px/1.35 var(--fb);
        color: var(--tx);
        background: var(--pn);
        border: 1px solid var(--k);
        border-radius: 4px;
        padding: 10px 12px;
        width: 100%;
        resize: none;
        display: block;
      }
      input::placeholder,
      textarea::placeholder {
        color: var(--mu);
        opacity: 0.75;
      }
      .sg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .sg button {
        text-align: center;
        padding: 10px;
      }
      .on {
        background: var(--c);
        color: var(--on);
        border-color: var(--on);
      }
      .ex {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        font-size: 13.5px;
        color: var(--mu);
      }
      .ex span {
        flex-basis: 100%;
      }
      .ex button {
        width: auto;
        font-size: 13px;
        font-weight: 500;
        padding: 5px 10px;
        border-width: 2px;
        border-radius: 99px;
        box-shadow: 0 1px 2px rgba(30, 30, 60, 0.08);
        text-align: left;
      }
      .er {
        color: var(--b);
        font-weight: 700;
        font-size: 14px;
        min-height: 1.4em;
      }
      /* ---------- tela de jogo: painel do mandato e barras ---------- */
      .jg {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .pl {
        background: var(--pn);
        border: 1px solid var(--k);
        border-radius: 4px;
        box-shadow: 0 1px 2px rgba(30, 30, 60, 0.08);
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      .st {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .hud {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .hj {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
      }
      .hn {
        min-width: 0;
      }
      .hn b {
        display: block;
        font-size: 17px;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }
      .hn span {
        display: block;
        font-size: 13px;
        color: var(--mu);
        overflow-wrap: anywhere;
      }
      .hv {
        flex: none;
        font-size: 15px;
        letter-spacing: 1px;
        white-space: nowrap;
      }
      .hc {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .hc .bx {
        flex: 1;
        min-width: 60px;
      }
      .xv {
        font-weight: 700;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .ms4 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 12px;
      }
      .md {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 6px;
        font-size: 13px;
        min-width: 0;
      }
      .md span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .md b {
        font-variant-numeric: tabular-nums;
      }
      .md .bx {
        grid-column: 1/-1;
        height: 10px;
      }
      .md.lo b,
      .md.lo span {
        color: var(--b);
      }
      /* ---------- tabuleiro (no celular, uma faixa de progresso por etapa) ---------- */
      .tab {
        display: flex;
        gap: 5px;
      }
      .et {
        flex: 3;
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
      }
      .et.fim {
        flex: 1.6;
      }
      .en {
        text-align: center;
        font-size: 15px;
        line-height: 1.2;
        opacity: 0.45;
      }
      .en b {
        font-weight: 400;
      }
      .en span {
        display: none;
      }
      .et.atual .en,
      .et.feita .en {
        opacity: 1;
      }
      .tr {
        display: flex;
        gap: 2px;
      }
      .cs {
        flex: 1;
        height: 14px;
        border: 1px solid var(--k);
        border-radius: 5px;
        background: var(--pn);
        font-size: 0;
        font-style: normal;
        position: relative;
      }
      .cs img {
        display: none;
      }
      .cs.ok {
        background: var(--ok);
      }
      .cs.aqui {
        background: var(--a);
        border-color: var(--on);
        box-shadow: 0 0 0 2px var(--b);
      }
      .cs.sn {
        background: var(--bg);
      }
      .cs.sn.aqui {
        background: var(--a);
      }
      /* ---------- cena da etapa, pergunta, evento e carta ---------- */
      .cena {
        background-color: var(--nv);
        background-image: none;
        background-size: cover;
        background-position: center;
        color: var(--nt);
        border: 1px solid var(--k);
        border-radius: 4px;
        padding: 12px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        box-shadow: 0 1px 2px rgba(30, 30, 60, 0.08);
      }
      .cena > div {
        min-width: 0;
      }
      .ce,
      .cc {
        display: block;
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing: 0.8px;
      }
      .ce {
        text-transform: uppercase;
        opacity: 0.85;
      }
      .cena h2 {
        font-size: 21px;
        line-height: 1.1;
        color: var(--a);
        margin: 2px 0;
      }
      .ci {
        font-size: 38px;
        line-height: 1;
        font-weight: 400;
        flex: none;
      }
      .cena.gr {
        padding: 20px 16px;
      }
      .cena.gr h2 {
        font-size: 28px;
      }
      .cena.gr .ci {
        font-size: 56px;
      }
      .qc {
        font-size: 18px;
        font-weight: 700;
        line-height: 1.3;
      }
      .evb {
        display: flex;
        gap: 10px;
        align-items: center;
        background: var(--a);
        color: var(--on);
        border: 1px solid var(--on);
        border-radius: 4px;
        padding: 8px 12px;
        font-size: 14.5px;
        box-shadow: 0 1px 2px rgba(30, 30, 60, 0.08);
      }
      .evb b {
        font: 400 13px var(--fd);
        letter-spacing: 1px;
        display: block;
      }
      .evb i {
        font-size: 28px;
        font-style: normal;
        flex: none;
      }
      #o {
        display: grid;
        gap: 10px;
      }
      .okb {
        background: var(--ok) !important;
        color: var(--on) !important;
      }
      .nob {
        background: var(--b) !important;
        color: var(--on) !important;
      }
      #o .hid {
        opacity: 0.35;
        text-decoration: line-through;
        box-shadow: none;
      }
      /* alternativa já tentada e errada (modelo Crowder): fica riscada no lugar */
      #o .x {
        opacity: 0.55;
        text-decoration: line-through;
        background: var(--de);
      }
      #o .x::after {
        content: ' · já descartada';
        font-weight: 500;
        font-size: 13px;
      }
      .lf {
        width: auto;
        align-self: flex-start;
        font-size: 14px;
        padding: 8px 12px;
        border-width: 2px;
        box-shadow: 0 1px 2px rgba(30, 30, 60, 0.08);
      }
      .fx {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .fx span {
        border: 1px solid var(--k);
        border-radius: 99px;
        padding: 2px 10px;
        font-weight: 700;
        font-size: 13.5px;
        background: var(--pn);
        font-variant-numeric: tabular-nums;
      }
      .fx .up {
        background: var(--su);
      }
      .fx .dn {
        background: var(--de);
      }
      .fx .nv {
        background: var(--a);
        color: var(--on);
        border-color: var(--on);
      }
      .cr {
        background: var(--pn);
        border: 1px solid var(--k);
        border-radius: 4px;
        padding: 20px 16px;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
        animation: fl 0.45s ease-out;
      }
      .cr.bom {
        box-shadow: 0 1px 2px rgba(30, 30, 60, 0.08);
      }
      .cr.mau {
        box-shadow: 0 1px 2px rgba(30, 30, 60, 0.08);
      }
      .cr .tp {
        font: 400 13px var(--fd);
        letter-spacing: 2px;
      }
      .cr.bom .tp {
        color: var(--c);
      }
      .cr.mau .tp {
        color: var(--b);
      }
      .cr .ic {
        font-size: 52px;
        line-height: 1;
      }
      .cr h2 {
        font-size: 22px;
        color: var(--h);
      }
      .cr .fx {
        justify-content: center;
      }
      @keyframes fl {
        from {
          transform: rotateY(90deg) scale(0.9);
          opacity: 0.3;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      .shk {
        animation: sk 0.25s;
      }
      @keyframes sk {
        30% {
          transform: translateX(-7px);
        }
        70% {
          transform: translateX(7px);
        }
      }
      /* ---------- tela final ---------- */
      .lei {
        background: var(--pn);
        border: 1px solid var(--k);
        outline: 2px solid var(--k);
        outline-offset: -10px;
        border-radius: 6px;
        padding: 26px 22px;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 8px;
        position: relative;
        box-shadow: 0 1px 2px rgba(30, 30, 60, 0.08);
      }
      .lei .lt {
        font: 400 20px var(--fd);
        letter-spacing: 2px;
        color: var(--h);
      }
      .lei q {
        font-size: 19px;
        font-weight: 700;
        line-height: 1.3;
        quotes: '“' '”';
        overflow-wrap: anywhere;
      }
      .lei .au {
        font-size: 14.5px;
        color: var(--mu);
        overflow-wrap: anywhere;
      }
      .sel {
        align-self: center;
        font: 400 15px var(--fd);
        letter-spacing: 2px;
        color: var(--b);
        border: 1px solid var(--b);
        border-radius: 8px;
        padding: 3px 12px;
        transform: rotate(-5deg);
        margin-top: 4px;
      }
      .big {
        font: 400 30px/1.1 var(--fd);
        letter-spacing: 1px;
        color: var(--h);
        text-align: center;
        text-shadow: none;
      }
      .big.dr {
        text-shadow: none;
      }
      .rs {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .rs div {
        background: var(--pn);
        border: 1px solid var(--k);
        border-radius: 4px;
        padding: 8px;
        text-align: center;
        font-size: 13px;
      }
      .rs b {
        display: block;
        font: 400 22px var(--fd);
        color: var(--h);
        font-variant-numeric: tabular-nums;
      }
      .rv {
        display: grid;
        gap: 8px;
      }
      .rv h2 {
        font-size: 17px;
        color: var(--h);
      }
      .rv div {
        background: var(--pn);
        border: 1px solid var(--k);
        border-radius: 4px;
        padding: 8px 12px;
        font-size: 14px;
      }
      .rv b {
        display: block;
      }
      .bt {
        display: grid;
        gap: 10px;
      }
      .bt button {
        text-align: center;
      }
      .ov {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        background: var(--vl);
        display: flex;
        padding: 16px;
        z-index: 20;
        overflow-y: auto; /* pop-up mais alto que a tela: o véu rola e o OK continua alcançável */
        -webkit-overflow-scrolling: touch;
      }
      .ov > * {
        margin: auto; /* centraliza; se não couber, começa do topo e rola */
      }
      .ov .card {
        max-width: 380px;
        width: 100%;
        display: grid;
        gap: 12px;
        text-align: center;
      }
      .ov button {
        text-align: center;
      }
      .fimg {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .fimg > div {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }
      /* ---------- acessibilidade: sem animações para quem pediu menos movimento ---------- */
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
      /* ---------- celulares muito estreitos ---------- */
      @media (max-width: 380px) {
        .lg img {
          height: 36px;
        }
        h1 {
          font-size: 30px;
        }
      }

      /* ---------- telas a partir de 860 px: duas colunas e tabuleiro em serpente ---------- */
      @media (min-width: 860px) {
        #top {
          max-width: 1100px;
          padding: clamp(10px, 2vh, 20px) 20px clamp(8px, 1.6vh, 14px);
          border-bottom: 3px solid var(--h);
        }
        .lg img,
        .home .lg img {

        }

        }

        }

        }
        .fm {

          gap: clamp(10px, 1.8vh, 16px);
          justify-content: center;
        }
        .fm h2 {
          font-size: clamp(22px, 3.4vh, 30px);
        }
        .fm .go {

        }
        .jg {

        }
        .pl {
          padding: 16px;

        }
        .hn b {
          font-size: 19px;
        }
        .hv {
          font-size: 18px;
        }
        .tab {
          flex-direction: column;
          gap: var(--rg);
          padding-top: calc(var(--cz) * 0.3);
        }
        .et,
        .et.fim {

        .en {

        .en span {

        .et.atual .en span {

        }
        .tr {

        }

        }

          content: '';

          margin-top: -3px;

        }
        .et:not(.fim) .tr::after {
          content: '';
          position: absolute;
          top: 50%;

          height: calc(100% + var(--rg));
          background: var(--ln);
          right: calc(var(--cz) / 2 - 3px);
        }
        .et:nth-child(even) .tr::after {
          right: auto;
          left: calc(var(--cz) / 2 - 3px);

      /* ---------- identidade visual: informativo "Notícias da Casa" ----------
         Inspirada nos boletins internos da Câmara Municipal de Campinas:
         títulos em Bebas Neue (maiúsculas condensadas), texto em Montserrat,
         faixas, quadros e fundo branco como no boletim, mas no azul-anil
         #323380 (mais vivo que o marinho do boletim). O amarelo fica só
         no mascote, como as fotos no boletim. */
      body {
        border-top: 6px solid var(--a);
        font-weight: 500;
      }
      #top {
        background: var(--pn);
        max-width: none;
        border-bottom: 3px solid var(--c);
        padding: 10px max(16px, calc((100% - 1180px) / 2));
      }
      .home #top {
        display: none; /* na boas-vindas o logo fica dentro do quadro do título */
      }
      #mn {
        font-family: var(--fb);
        letter-spacing: 0.5px;
      }
      /* títulos: Bebas Neue, como as manchetes do boletim */
      .t,
      h1,
      h2 {
        font-family: var(--fd);
        font-weight: 400;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      button {
        box-shadow: none;
      }
      .go {
        font-weight: 700;
        letter-spacing: 0.5px;
        border-radius: 4px;
      }
      .go:hover:not(:disabled) {
        background: var(--c);
      }
      .rb {
        background: var(--cx);
        color: var(--a);
        border-color: var(--k);
      }
      /* botão secundário (borda azul) e link discreto */
      .sec2 {
        background: var(--pn);
        color: var(--a);
        border: 2px solid var(--a);
        text-align: center;
        font-weight: 700;
      }
      .lk {
        width: auto;
        background: none;
        border: 0;
        padding: 4px 2px;
        color: var(--c);
        font: 600 14px var(--fb);
        text-decoration: underline;
        text-underline-offset: 3px;
        text-align: center;
      }
      .cen {
        text-align: center;
      }
      /* balão do mascote: quadro claro com filete azul, como o Você sabia? */
      .bb {
        background: var(--cx);
        border: 0;
        border-left: 4px solid var(--c);
        border-radius: 0 4px 4px 0;
      }
      /* faixa da etapa: como o cabeçalho do boletim (linha pequena em maiúsculas + manchete) */
      .cena {
        background: var(--nv);
        border: 0;
        border-radius: 0;
        border-bottom: 4px solid var(--c2);
        box-shadow: none;
      }
      .cena h2 {
        color: #fff;
        font-size: 32px;
        line-height: 1;
        margin: 4px 0 2px;
      }
      .cena .ce {
        opacity: 0.85;
        letter-spacing: 1.5px;
      }
      .cena .ci {
        background: rgba(255, 255, 255, 0.14);
        border-radius: 50%;
        width: 60px;
        height: 60px;
        display: grid;
        place-items: center;
        font-size: 32px;
      }
      .cena.gr .ci {
        width: 84px;
        height: 84px;
        font-size: 46px;
      }
      .evb {
        background: var(--c);
        border: 0;
        border-radius: 0;
      }
      .evb b {
        font: 400 17px var(--fd);
        letter-spacing: 1px;
      }
      /* tabuleiro: casa atual em azul-claro com borda marinho; casas feitas em azul médio */
      .cs.ok {
        background: var(--c);
        border-color: var(--c);
      }
      .cs.aqui {
        background: var(--cx2);
        border-color: var(--a);
        box-shadow: 0 0 0 2px var(--a);
      }
      .cs.sn {
        font-family: var(--fd);
      }
      .bx i,
      .bx.mes i {
        background: var(--a);
      }
      .md.lo .bx i {
        background: var(--b);
      }
      .xv {
        color: var(--a);
      }
      .mdm {
        grid-column: 1 / -1;
      }
      /* pop-up de correção: faixa vermelha com manchete e aspas azuis no comentário */
      /* cartas e tela final com títulos do boletim */
      .cr .tp,
      .lei .lt,
      .sel,
      .big {
        font-family: var(--fd);
      }
      .cr h2 {
        font-size: 30px;
      }
      .big {
        font-size: 48px;
      }
      .rs b {
        font: 700 22px var(--fb);
        color: var(--a);
      }
      .rv h2 {
        font-size: 24px;
      }
      .fm h2.t {
        font-size: 34px;
        color: var(--a);
        border-bottom: 3px solid var(--c);
        padding-bottom: 2px;
      }
      .on {
        background: var(--a);
      }

      /* ---------- boas-vindas, Como jogar e gabinete ---------- */
      .boas,
      .como,
      .gab {
        max-width: 560px;
        margin: 0 auto;
      }
      .boas {
        display: grid;
        gap: 14px;
        padding-top: 8px;
      }
      .boas-foto {
        order: 2; /* no celular, a imagem fica entre o título e os botões */
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 10px 28px rgba(26, 27, 70, 0.22);
        height: 250px;
      }
      .boas-foto img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 36% 32%; /* mantém o Legis no centro do recorte */
      }
      .boas-lado {
        display: contents; /* no celular, os itens entram direto no grid da página */
      }
      .boas .tit {
        order: 1;
      }
      /* título no estilo do mockup: quadro azul arredondado, letras fortes, PARLAMENTAR em azul-claro */
      .boas .tbox {
        background: linear-gradient(180deg, #2b3a96 0%, #1f2b80 100%);
        border-radius: 12px;
        border-bottom: 5px solid #6b6fd0;
        padding: 14px 12px 16px;
        text-align: center;
        color: #fff;
      }
      .boas .tbox .je,
      .boas .tbox h1 {
        background: none; /* sem as faixas do título antigo */
        border: 0;
        padding: 0;
      }
      .boas .tbox .je {
        display: block;
        font: 600 11px var(--fb);
        letter-spacing: 4px;
        opacity: 0.92;
      }
      .boas .tbox h1 {
        margin: 6px 0 0;
        font: 800 clamp(34px, 10vw, 64px) / 0.98 var(--fb);
        letter-spacing: -0.5px;
        text-transform: uppercase;
        color: #fff;

   Fontes: Regimento Interno da Câmara Municipal de Campinas (Resolução nº 842/2009,

/*
========================================================================
DOCUMENTAÇÃO PARA MANUTENÇÃO FUTURA
========================================================================
Todo o conteúdo do jogo está nas listas abaixo. Para mudar o conteúdo NÃO é
preciso alterar o MOTOR (o segundo bloco <script>).

COMO ADICIONAR UMA PERGUNTA
  1. Procure a etapa em const Q (protocolo, procuradoria, ccl, tematicas,
     financas, plenario ou prefeitura).
  2. Copie uma linha inteira de pergunta e cole logo abaixo da linha
     "nome_da_etapa:[".
  3. Troque os dez textos: enunciado, resposta CERTA, três erradas,

  4. Cada texto fica entre aspas duplas, separado por vírgula, e a linha

COMO ADICIONAR UM EVENTO
  1. Em const EVENTOS, copie um evento inteiro (da chave { até a chave },).
  2. Troque id (palavra única, sem espaços), nome, ic (emoji), txt, ok, no

COMO ADICIONAR UMA CARTA

  2. fx aceita casa:2 (avança 2 casas), estrela, mes, vida e extra:1

COMO ADICIONAR OU MUDAR UMA ETAPA

  2. Crie em const Q uma lista com a MESMA chave do id, com pelo menos seis

COMO ADICIONAR FOTOS DE CENÁRIO

/*
========================================================================
DOCUMENTAÇÃO DAS REGRAS PEDAGÓGICAS
========================================================================
O painel tem só três indicadores, pensados para um público jovem.

ESTRELAS ⭐
  Medem o domínio do conteúdo. Cada acerto vale 3 ⭐ de primeira, 2 ⭐ na
  2ª tentativa, 1 ⭐ na 3ª e 0 depois (REGRAS.estrelas). Na sanção, cada
  vida que sobrou vale +1 ⭐. As estrelas definem o cargo, de Vereador(a)
  Iniciante a Mestre(a) do Processo Legislativo.

VIDAS ❤️ (5)
  A margem de erro do gabinete. O 1º erro em cada pergunta de etapa (e na
  pergunta extra) custa uma vida; as novas tentativas na mesma pergunta
  não tiram vida. Erro em evento não tira vida. Sem vidas, a partida
  termina.

MANDATO ⏳ (48 meses)
  A legislatura dura quatro anos (LOM, art. 6º, § 1º). Cada tentativa de
  resposta consome 2 meses; pedido de vista, recesso, falta de quórum e
  os erros nos eventos Comissão, Emenda e Pedido de Vista consomem mais.
  Se o tempo acabar antes da sanção, a partida termina.

CONSULTAS À PROCURADORIA (3 por partida)
  Representam o assessoramento técnico-jurídico da Procuradoria da Câmara
  (LOM, art. 59): eliminam até duas alternativas erradas ainda não
  tentadas (sempre sobra uma errada), ao custo de 1 mês de mandato.
  Ensinam que a consulta jurídica ajuda, mas também leva tempo.

MODELO DE CROWDER (instrução programada ramificada)
  Cada alternativa errada tem o seu comentário (posições 7 a 9 da
  pergunta). Ao errar, o jogador lê, em pop-up, por que aquela escolha
  está errada, clica em OK e tenta de novo a mesma pergunta. As estrelas
  do acerto caem conforme a tentativa (3, 2, 1).

    <!-- 4. MOTOR DO JOGO =================================================== -->
    <script>
/* ============================ MOTOR DO JOGO ============================
   Lê as listas de conteúdo acima e aplica as regras. Não é preciso mexer
   aqui para acrescentar perguntas, eventos ou cartas.
   Seções: utilitários · estado · pergunta atual · efeitos · fluxo · telas
           · ações · inicialização
   ======================================================================= */

/* ---------- utilitários ---------- */
// Atalho para encontrar um elemento da página; app = a área onde o jogo é desenhado.
// Como funciona: $("#app") devolve o elemento da página com id "app".
// Por que existe: evita repetir document.querySelector em todo o código.
const $ = s => document.querySelector(s),
  app = $('#app');
// Troca & < > " ' por códigos seguros: texto digitado ou do banco de perguntas nunca vira código.
// Como funciona: substitui cada caractere especial pelo seu código de HTML (por exemplo, < vira &lt;).
// Por que existe: segurança. Usado por vMenu(), hud(), vPalco() e vFim() ao exibir nome, projeto e perguntas.
const esc = s =>
  String(s).replace(
    /[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
  );
// Sorteia um número inteiro de 0 a n − 1.
// Como funciona: Math.random() dá um número entre 0 e 1; multiplicado e arredondado para baixo, vira um inteiro.
// Por que existe: base de todos os sorteios (perguntas, eventos, cartas, número do projeto).
const rnd = n => Math.floor(Math.random() * n);
// Devolve uma cópia embaralhada da lista (usada nas alternativas).
// Como funciona: método de Fisher-Yates, que troca cada item com outro de posição sorteada.
// Por que existe: impede que a resposta certa apareça sempre no mesmo lugar.
const sh = a => {
  a = [...a];
  for (let i = a.length - 1; i > 0; i--) {
    const j = rnd(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
// O que faz: guarda o número de casas (21). Chegar a essa posição significa chegar à Sanção.
// Por que existe: se casas forem acrescentadas em CASAS, a Sanção se ajusta sozinha.
const FIM = CASAS.length; /* posição da Sanção */

/* ---------- estado ---------- */
// Caderneta do aparelho: recorde, leis aprovadas e último nome. Lida do navegador ao abrir a página.
// Como funciona: começa com valores padrão e, se o navegador tiver dados salvos na chave "jv1", eles são copiados por cima.
// Por que existe: lembra o recorde e o nome entre uma visita e outra, sem enviar nada para fora do aparelho.
// Como interage: iniciar() grava o nome e o tratamento; vitoria() soma uma lei; fimDeJogo() atualiza o recorde; vMenu() exibe o recorde.
let P = { best: 0, leis: 0, nome: '', trat: 'a' };
try {
  Object.assign(P, JSON.parse(localStorage.getItem('jv1') || '{}'));
} catch (e) {}
// Grava a caderneta no navegador. Se o navegador não permitir, o jogo segue sem gravar.
// Como funciona: transforma P em texto (JSON) e grava no localStorage do navegador.
// Por que existe: o try/catch evita erro em janela anônima ou com o armazenamento bloqueado.
const save = () => {
  try {
    localStorage.setItem('jv1', JSON.stringify(P));
  } catch (e) {}
};
/*
========================================================================
ESTADO GLOBAL (G): a "comanda" da partida
========================================================================
O que faz: guarda tudo o que o jogo precisa lembrar naquele momento.
Por que existe: com um único lugar para o estado, a tela é sempre um
retrato fiel da partida. Toda ação muda G e, em seguida, render() redesenha
a tela a partir dele.
Como funciona: aqui G nasce só com os dados do menu. Ao começar a partida,
iniciar() o substitui por uma comanda completa; ao voltar ao menu, a ação
sair() o recria.

Propriedades:
  tela        qual tela mostrar: 'menu', 'jogo' ou 'fim'.
  fase        dentro do jogo: 'etapa' (apresentação), 'q' (pergunta
              aberta), 'resp' (resposta comentada) ou 'carta'.
  trat        'a' = Vereadora; 'o' = Vereador.
  nome        nome digitado pelo jogador.
  proj        título do projeto de lei digitado.
  err         mensagem de erro do formulário do menu.
  num         número fictício do projeto de lei (1 a 300).
  ano         ano atual, exibido junto ao número do projeto.

  vidas       vidas restantes (0 a 5).
  mes         meses de mandato restantes.

  cons        consultas à Procuradoria restantes.
  vistos      perguntas já sorteadas, por lista (exemplo: protocolo: [0, 3]).
  feitos      casas especiais (evento ou carta) já resolvidas.
  evUsados    eventos já sorteados nesta partida.

  sair        true enquanto o aviso "Sair da partida?" está aberto.
Criadas durante o jogo:

              posição na lista (k) e ordem embaralhada das alternativas (ops).
              Também guarda tent (tentativas feitas), desc (alternativas
              erradas já escolhidas) e err (entrada em G.erros).

  resp        resposta certa: alternativa, tentativa e efeitos.
  mov         quantas casas andar ao continuar (-1, 0, 1 ou 2).
  perdeu      motivo da derrota [título, texto], ou null.
  carta       posição da carta sorteada em CARTAS.
  win, motivo, bonus, novoRecorde   dados usados na tela final.
========================================================================
*/
// Comanda da partida: TODO o estado do jogo mora aqui. Começa na tela do menu.
let G = { tela: 'inicio', passo: 0, trat: P.trat == 'o' ? 'o' : 'a', nome: P.nome || '', proj: '', err: '' };


/* ---------- utilitários de tela ---------- */
// Bipe curto gerado pelo próprio navegador (f = frequência em Hz, d = duração em segundos).
// Como funciona: cria um oscilador de som (onda quadrada) por uma fração de segundo; AC guarda o gerador de áudio para reutilizá-lo.
// Por que existe: reforço sonoro de acerto (agudo) e erro (grave), sem arquivos de som.
let AC;
const beep = (f, d = 0.1) => {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(),
      g = AC.createGain();
    o.frequency.value = f;
    o.type = 'square';
    g.gain.value = 0.05;
    o.connect(g);
    g.connect(AC.destination);
    o.start();
    o.stop(AC.currentTime + d);
  } catch (e) {}
};
// Imagem do mascote (m = humor: n normal, h feliz, s triste; s = altura base).
// Como funciona: devolve o HTML de uma imagem com a classe da animação correspondente ao humor.
// Como interage: usada por msb(); a imagem MIMG vem do último bloco <script>.
const MAS = (m = 'n', s = 70) =>
  `<img class="mc x${m}" src="${MIMG}" alt="" style="height:${Math.round(s * 1.35)}px">`;
// Mascote com balão de fala (t = texto do balão).
// Por que existe: o mascote é o narrador do jogo; aparece no menu, nas etapas, nas respostas e na tela final.
const msb = (t, m = 'n') => `<div class="ms">${MAS(m)}<div class="bb">${t}</div></div>`;
// "Vereadora" ou "Vereador", conforme a escolha do menu.
// Como interage: usada no painel, no certificado e na tela final.
const tit = () => (G.trat == 'a' ? 'Vereadora' : 'Vereador');
// Índice do cargo atual em CARGOS, pelas estrelas acumuladas.
// Como funciona: percorre CARGOS e guarda o último degrau cujo mínimo de estrelas já foi alcançado.
// Como interage: aplicar() compara o cargo antes e depois para avisar a subida.
const cargo = (e = G.estrelas) => {
  let i = 0;
  CARGOS.forEach((r, k) => {
    if (e >= r[0]) i = k;
  });
  return i;
};
// Nome do cargo no masculino ou no feminino.
const nomeCargo = i => CARGOS[i][G.trat == 'a' ? 2 : 1];
// Estrelas de um acerto, conforme a tentativa (1ª = 3, 2ª = 2, 3ª = 1, depois 0).
const estrelasDaTentativa = t => REGRAS.estrelas[Math.min(t, REGRAS.estrelas.length) - 1];
// Casa atual do tabuleiro.
// Como funciona: Math.min impede ler além da última casa quando o peão está na Sanção.
const casa = () => CASAS[Math.min(G.pos, FIM - 1)];
// Etapa da casa atual.
const etapa = () => ETAPAS[casa().e];

/* ---------- pergunta atual ---------- */
// Pergunta que está na tela agora.
// Como funciona: lê G.q (origem, lista e posição) e busca a pergunta em Q ou em EVENTOS.
// Como interage: usada por responder() e vPalco().
function cur() {
  const q = G.q;
  return q.src == 'evento' ? EVENTOS[q.ev].qs[q.k] : Q[q.pool][q.k];
}
// Sorteia um índice ainda não usado da lista; quando todos saíram, recomeça.
// Por que existe: evita que a mesma pergunta se repita na partida antes de a lista acabar.
// Como interage: guarda os índices usados em G.vistos[chave].
function sorteia(chave, total) {
  // v = índices já sorteados desta lista
  const v = G.vistos[chave] || (G.vistos[chave] = []);
  // se todos já saíram, esvazia a lista e recomeça
  if (v.length >= total) v.length = 0;
  // entre os que ainda não saíram, escolhe um ao acaso e o marca como usado
  const livres = [...Array(total).keys()].filter(i => !v.includes(i));
  const k = livres[rnd(livres.length)];
  v.push(k);
  return k;
}
/*
========================================================================
novaPergunta(): preparação da pergunta
========================================================================
Quando é chamada: por desafio() (pergunta da etapa ou de evento) e por
continuar() (pergunta extra da carta Questionamento jurídico).
Fluxo:
  Origem da pergunta
  ↓
  Etapa → lista da etapa em Q
  Extra → lista procuradoria ou ccl (sorteio entre as duas)
  Evento → lista qs do evento
  ↓
  sorteia() uma pergunta ainda não usada daquela lista
  ↓
  Embaralha a ordem das alternativas e limpa ajuda e resposta anteriores
  ↓
  fase 'q': pergunta aberta na tela
========================================================================
*/
// Prepara a próxima pergunta (da etapa, de um evento ou extra) e embaralha as alternativas.
function novaPergunta(src, extra) {
  // de onde vem a pergunta: da etapa atual, das etapas jurídicas (carta extra) ou de um evento
  if (src == 'etapa') {
    const pool = etapa().id;
    G.q = { src, pool, k: sorteia(pool, Q[pool].length) };
  } else if (src == 'extra') {
    const pool = rnd(2) ? 'procuradoria' : 'ccl';
    G.q = { src, pool, k: sorteia(pool, Q[pool].length) };
  } else {
    const ev = extra;
    G.q = { src, ev, k: sorteia('ev' + ev, EVENTOS[ev].qs.length) };
  }
  // ordem embaralhada das quatro alternativas (1 = certa), sorteada uma vez e mantida nas
  // novas tentativas; tent = tentativas feitas; desc = erradas já escolhidas (modelo Crowder)
  G.q.ops = sh([1, 2, 3, 4]);
  G.q.tent = 0;
  G.q.desc = [];
  G.q.err = null;
  G.hid = [];
  G.resp = null;
  G.corr = null;
  G.fase = 'q';
}

/* ---------- efeitos ---------- */
/*
========================================================================
aplicar(): aplicação dos efeitos
========================================================================
Quando é chamada: por responder() e por desafio() (cartas).
O que faz: lança na comanda G cada item da ficha de efeitos fx e devolve
o que REALMENTE mudou (por exemplo, ganhar 1 vida com as vidas cheias
não muda nada, e as estrelas nunca ficam negativas). As etiquetas da tela
mostram esse valor real, para a conta sempre bater com o painel.
Fluxo:
  Ficha de efeitos (exemplo: estrela 3, mes -2)
  ↓
  Soma cada item: estrelas (nunca abaixo de 0), meses (nunca abaixo de 0)
  e vidas (entre 0 e o máximo de REGRAS)
  ↓
  Subiu de cargo? → guarda o novo cargo em G.subiu para o aviso na tela
========================================================================
*/
// Lança os efeitos (fx = { estrela, mes, vida }) e devolve o que de fato mudou.
function aplicar(fx) {
  // guarda o cargo e os valores atuais para comparar depois
  const antes = cargo(),
    e0 = G.estrelas,
    m0 = G.mes,
    v0 = G.vidas;
  if (fx.estrela) G.estrelas = Math.max(0, G.estrelas + fx.estrela);
  if (fx.mes) G.mes = Math.max(0, G.mes + fx.mes);
  if (fx.vida) G.vidas = Math.max(0, Math.min(REGRAS.vidas, G.vidas + fx.vida));
  // -1 = não subiu; senão, guarda o índice do novo cargo para o aviso na tela
  G.subiu = cargo() > antes ? cargo() : -1;
  return { estrela: G.estrelas - e0, mes: G.mes - m0, vida: G.vidas - v0, cheio: fx.vida > 0 && G.vidas == v0 };
}
/*
========================================================================
derrota(): verificação de derrota
========================================================================
Quando é chamada: depois de cada resposta e de cada carta.
Fluxo:
  Vidas = 0?    → SEM VIDAS
  ↓ não
  Mandato = 0?  → FIM DO MANDATO (LOM, art. 6º, § 1º)
  ↓ não
  null: o jogo continua
O resultado fica em G.perdeu; o botão seguinte leva à tela final.
========================================================================
*/
// Verifica as duas condições de derrota. Devolve [título, texto] ou null (jogo segue).
function derrota() {
  if (G.vidas <= 0)
    return [
      'SEM VIDAS',
      'Seu gabinete errou demais e perdeu o fôlego. O projeto ficou parado na casa ' + (G.pos + 1) + '.',
    ];
  if (G.mes <= 0)
    return [
      'FIM DO MANDATO',
      'Os 48 meses de mandato acabaram antes da sanção. Uma legislatura dura quatro anos (LOM, art. 6º, § 1º).',
    ];
  return null;
}
// Etiquetas com os efeitos REAIS de uma resposta ou carta (⭐, ❤️, ⏳, casas, novo cargo).
// Quando aparece: depois de cada resposta, no pop-up de erro e em cada carta.
// Por que existe: mostra ao jogador a consequência de cada decisão, que é o centro do aprendizado.
function chips(fx, mov) {
  // o = etiquetas; s = número com sinal (+3, −2); c = classe verde (up) ou vermelha (dn)
  const o = [],
    s = v => (v > 0 ? '+' : '−') + Math.abs(v),
    c = v => (v > 0 ? 'up' : 'dn');
  if (fx.estrela) o.push(`<span class="${c(fx.estrela)}">⭐ ${s(fx.estrela)}</span>`);
  if (fx.vida) o.push(`<span class="${c(fx.vida)}">❤️ ${s(fx.vida)}</span>`);
  if (fx.cheio) o.push(`<span>❤️ vidas já estão cheias</span>`);
  if (fx.mes) o.push(`<span class="${c(fx.mes)}">⏳ ${s(fx.mes)} ${Math.abs(fx.mes) == 1 ? 'mês' : 'meses'}</span>`);
  if (mov > 1) o.push(`<span class="up">Avance ${mov} casas</span>`);
  if (G.subiu >= 0) o.push(`<span class="nv">Novo cargo: ${nomeCargo(G.subiu)}</span>`);
  return `<div class="fx">${o.join('')}</div>`;
}

/*
========================================================================
DOCUMENTAÇÃO DE FLUXO: visão geral das funções principais
========================================================================
Ordem em que as funções se chamam durante uma partida:

  iniciar()           o jogador clica em PROTOCOLAR O PROJETO
     ↓
  entrar()            chega a uma casa
     ↓
  desafio()           decide o que a casa traz
     ↓
  novaPergunta()      (pergunta ou evento)      ou      carta aplicada
     ↓                                                    ↓
  responder()         corrige e aplica efeitos            ↓
     ↓                                                    ↓
  continuar()  ←──────────────────────────────────────────┘
     ↓
  entrar()            próxima casa (o ciclo se repete)
     ↓
  vitoria()  ou  derrota()  →  fimDeJogo()  →  tela final

aplicar() é chamada sempre que algo muda os indicadores; consultar() pode
ser usada enquanto uma pergunta está aberta.
========================================================================
*/
/* ---------- fluxo ---------- */
/*
========================================================================
iniciar(): começo da partida
========================================================================
Quando é chamada: ao clicar em PROTOCOLAR O PROJETO, ao teclar Enter no
campo do projeto ou ao escolher TENTAR DE NOVO depois de uma derrota.
O que faz: confere o formulário, grava o nome no aparelho e cria a comanda.
Fluxo:
  Formulário do menu
  ↓
  Nome tem pelo menos 2 letras e projeto pelo menos 5?
  ↓ não → mostra o aviso no menu e para
  ↓ sim
  Grava nome e tratamento na caderneta P
  ↓
  Cria a comanda G com os valores de REGRAS (5 vidas, 48 meses...)
  ↓
  entrar() na casa 0
========================================================================
*/
// Valida o formulário do menu e cria uma comanda nova para a partida.
function iniciar() {
  // tira espaços sobrando do nome e do projeto
  const nome = G.nome.trim().replace(/\s+/g, ' '),
    proj = G.proj.trim().replace(/\s+/g, ' ');
  // sem nome ou sem projeto: mostra o aviso e não começa
  if (nome.length < 2) {
    G.err = 'Escreva o seu nome para assumir o mandato.';
    return render();
  }
  if (proj.length < 5) {
    G.err = 'Escreva o seu projeto de lei ou toque em um exemplo.';
    return render();
  }
  // lembra nome e tratamento para a próxima visita
  P.nome = nome;
  P.trat = G.trat;
  save();
  G = {
    tela: 'jogo',
    trat: G.trat,
    nome,
    proj,
    num: 1 + rnd(300), // número fictício do projeto de lei
    ano: new Date().getFullYear(),
    pos: 0,
    vidas: REGRAS.vidas,
    mes: REGRAS.meses,
    estrelas: 0, // ⭐ ganhas: 3, 2 ou 1 por acerto, conforme a tentativa
    cons: REGRAS.consultas, // consultas à Procuradoria restantes
    vistos: {}, // perguntas já sorteadas, por lista
    feitos: [], // casas especiais já resolvidas
    evUsados: [], // eventos já sorteados
    ctUsadas: [], // cartas já sorteadas
    etapaVista: -1, // última etapa cuja apresentação já foi mostrada
    acertos: 0, // acertos na 1ª tentativa
    perguntas: 0, // perguntas respondidas
    erros: [], // perguntas erradas e alternativas descartadas, para a lista Para rever
    corr: null, // pop-up de erro aberto (modelo Crowder)
    subiu: -1,
    sair: false,
  };
  // bipe de início e primeira casa
  beep(520);
  entrar();
}
/*
========================================================================
entrar(): chegada a uma casa
========================================================================
Quando é chamada: no início da partida e depois de cada movimento do peão.
Fluxo:
  Posição atual
  ↓
  Passou da última casa? → sim → vitoria()
  ↓ não
  É a primeira casa de uma etapa nova? → sim → mostra a apresentação da
  etapa (fase 'etapa'); o botão ENTRAR chama desafio()
  ↓ não
  desafio()
========================================================================
*/
// Chega a uma casa: vitória (Sanção), apresentação da etapa nova ou desafio.
function entrar() {
  // passou da última casa: chegou à Sanção
  if (G.pos >= FIM) return vitoria();
  // primeira casa de uma etapa nova: mostra a apresentação antes do desafio
  if (casa().e > G.etapaVista) {
    G.fase = 'etapa';
    return render();
  }
  desafio();
}
/*
========================================================================
desafio(): o que a casa traz
========================================================================
Quando é chamada: por entrar() ou pelo botão ENTRAR da apresentação.
Fluxo:
  Tipo da casa (campo t de CASAS)
  ↓
  Evento ou carta já resolvidos? → sim → pula para a casa seguinte
  ↓ não
  'q'  → novaPergunta('etapa')
  'ev' → sorteia um evento não usado → novaPergunta('evento')
  'ct' → sorteia uma carta não usada → aplicar() os efeitos
         → calcula o movimento → derrota()? → mostra a carta
  ↓
  render()
========================================================================
*/
// Resolve a casa atual: pergunta da etapa, evento sorteado ou carta sorteada.
function desafio() {
  const c = casa();
  // casa especial já resolvida (acontece ao voltar uma casa): pula para a próxima
  if (c.t != 'q' && G.feitos.includes(G.pos)) {
    G.pos++;
    return entrar();
  }
  // casa de pergunta
  if (c.t == 'q') novaPergunta('etapa');
  // casa de evento: sorteia um evento ainda não usado nesta partida
  else if (c.t == 'ev') {
    let l = EVENTOS.map((x, i) => i).filter(i => !G.evUsados.includes(i));
    if (!l.length) {
      G.evUsados = [];
      l = EVENTOS.map((x, i) => i);
    }
    const ev = l[rnd(l.length)];
    G.evUsados.push(ev);
    novaPergunta('evento', ev);
  } else {
    // casa de carta: sorteia uma carta ainda não usada e aplica o efeito na hora
    let l = CARTAS.map((x, i) => i).filter(i => !G.ctUsadas.includes(i));
    if (!l.length) {
      G.ctUsadas = [];
      l = CARTAS.map((x, i) => i);
    }
    const k = l[rnd(l.length)];
    G.ctUsadas.push(k);
    G.carta = k;
    G.feitos.push(G.pos);
    const fx = CARTAS[k].fx;
    G.cartaFx = aplicar(fx); // efeitos reais, para as etiquetas da carta
    // casas a andar: 0 se houver pergunta extra; até 2 à frente sem pular a última pergunta; 1 para trás; ou 1
    G.mov = fx.extra
      ? 0
      : fx.casa > 0
        ? Math.max(1, Math.min(fx.casa, FIM - 1 - G.pos))
        : fx.casa < 0
          ? -1
          : 1;
    G.perdeu = derrota();
    G.fase = 'carta';
    beep(CARTAS[k].bom ? 700 : 200, 0.18);
  }
  render();
}
/*
========================================================================
responder(): correção da resposta (modelo ramificado de Crowder)
========================================================================
Quando é chamada: ao clicar numa alternativa (ação resp de ACT).
Fluxo:
  Pergunta
  ↓
  Resposta (alternativa clicada) · conta a tentativa · gasta os meses
  (REGRAS.custoPergunta) de toda tentativa
  ↓
  Correção (certa = posição 1 da pergunta)
  ↓
  ERRO (ramo de Crowder)
    1º erro nesta pergunta:
      etapa e extra → perde 1 vida
      evento        → só os meses do campo no do evento, sem perder vida
    erros seguintes: só os meses da tentativa
    ↓
    Risca a alternativa (G.q.desc), guarda-a em Para rever e abre o
    pop-up com o comentário DAQUELA alternativa (posição i + 5)
    ↓
    Derrota? → o OK do pop-up leva à tela final
    Senão    → o OK fecha o pop-up e o jogador tenta de novo a MESMA pergunta
  ↓
  ACERTO
    Estrelas pela tentativa (REGRAS.estrelas: 3, 2, 1, depois 0); o peão
    anda 1 casa para a frente
    ↓
    Mostra a resposta comentada; o botão chama continuar() → Próxima Casa
========================================================================
*/
// Corrige a resposta (a certa é sempre o índice 1). Erro abre o pop-up e mantém a pergunta.
function responder(i) {
  // só aceita resposta enquanto a pergunta está aberta e sem pop-up
  if (G.fase != 'q' || G.corr) return;
  const q = cur(),
    ok = i == 1, // a certa é sempre o índice 1
    src = G.q.src,
    primeira = G.q.tent == 0;
  G.q.tent++;
  if (primeira) G.perguntas++;
  // casa de evento: fica marcada como resolvida desde a primeira tentativa
  if (src == 'evento' && !G.feitos.includes(G.pos)) G.feitos.push(G.pos);
  let fx = {},
    mov = 0;

  if (!ok) {
    // ---------- ERRO: ramo de Crowder ----------
    const primeiroErro = !G.q.desc.length;
    if (primeiroErro) {
      // etapa e pergunta extra: o 1º erro custa 1 vida; evento: só o efeito no (meses), sem vida
      if (src == 'evento') fx = { ...EVENTOS[G.q.ev].no };
      else fx = { vida: -1 };
      // entra na lista Para rever uma vez por pergunta
      G.q.err = [q[0], q[1], q[6], []];
      G.erros.push(G.q.err);
    }
    G.q.desc.push(i);
    G.q.err[3].push(q[i]);
    fx.mes = (fx.mes || 0) - REGRAS.custoPergunta;
    G.corr = { i, fx: aplicar(fx), primeiroErro };
    G.perdeu = derrota();
    beep(150, 0.25);
    render();
    // a tela treme por um instante e o foco vai para o botão OK
    app.classList.add('shk');
    setTimeout(() => app.classList.remove('shk'), 260);
    focar('#okp');
    return;
  }

  // ---------- ACERTO ----------
  if (primeira) G.acertos++;
  // estrelas pela tentativa (3, 2, 1, depois 0); toda tentativa gasta os meses
  fx = { estrela: estrelasDaTentativa(G.q.tent), mes: -REGRAS.custoPergunta };
  // o peão só anda com acerto, e sempre para a frente
  mov = 1;
  G.mov = mov;
  G.resp = { i, ok, fx: aplicar(fx), tent: G.q.tent };
  // se o acerto leva à Sanção, a vitória vale mesmo com o mandato zerado
  G.perdeu = G.pos + mov >= FIM ? null : derrota();
  G.fase = 'resp';
  beep(660, 0.1);
  render();
}
/*
========================================================================
fecharPop(): botão OK do pop-up de erro
========================================================================
Único jeito de fechar o pop-up (não fecha com Esc nem clicando fora).
Se o erro causou derrota, leva à tela final; senão, volta à mesma
pergunta, com a alternativa errada riscada.
========================================================================
*/
function fecharPop() {
  if (!G.corr) return;
  G.corr = null;
  if (G.perdeu) return fimDeJogo(false, G.perdeu);
  render();
  focar('#o button:not(:disabled)');
}
// Põe o foco num elemento depois que a tela é redesenhada (acessibilidade pelo teclado).
const focar = sel =>
  setTimeout(() => {
    const el = document.querySelector(sel);
    if (el) el.focus();
  }, 0);
/*
========================================================================
continuar(): depois da resposta ou da carta
========================================================================
Quando é chamada: pelo botão abaixo da resposta comentada ou da carta.
Fluxo:
  Houve derrota? → sim → fimDeJogo(derrota)
  ↓ não
  Carta de questionamento jurídico? → sim → novaPergunta('extra')
  ↓ não
  Move o peão: posição + mov (nunca abaixo de 0)
  ↓
  entrar() na nova casa
========================================================================
*/
// Depois da resposta ou da carta: encerra, abre a pergunta extra ou move o peão.
function continuar() {
  // houve derrota: vai para a tela final
  if (G.perdeu) return fimDeJogo(false, G.perdeu);
  // carta de questionamento jurídico: abre a pergunta extra
  if (G.fase == 'carta' && CARTAS[G.carta].fx.extra) {
    novaPergunta('extra');
    return render();
  }
  // move o peão e chega à nova casa
  G.pos = Math.max(0, G.pos + G.mov);
  entrar();
}
/*
========================================================================
consultar(): ajuda da Procuradoria
========================================================================
Quando é chamada: pelo botão Consultar a Procuradoria, com uma pergunta
aberta.
Fluxo:
  Pode consultar? podeConsultar(): pergunta aberta, sem pop-up, consultas
  restantes, ainda não usada nesta pergunta, ao menos duas erradas não
  tentadas e meses suficientes
  ↓ não → nada acontece (o botão já aparece desativado)
  ↓ sim
  Gasta 1 consulta e 1 mês
  ↓
  Esconde, ao acaso, até duas erradas ainda não tentadas (sempre sobra
  uma errada, para a pergunta não se responder sozinha)
  ↓
  render()
========================================================================
*/
// Ajuda da Procuradoria: esconde até duas erradas ainda não tentadas e custa 1 mês.
// Alternativas que a consulta ainda pode esconder (erradas não tentadas, sempre deixando uma).
const escondiveis = () => [2, 3, 4].filter(i => !G.q.desc.includes(i));
const podeConsultar = () =>
  G.fase == 'q' &&
  !G.corr &&
  G.cons > 0 &&
  !G.hid.length &&
  escondiveis().length >= 2 &&
  G.mes > REGRAS.custoPergunta + REGRAS.custoConsulta;
function consultar() {
  if (!podeConsultar()) return;
  G.cons--;
  G.mes -= REGRAS.custoConsulta;
  // esconde, ao acaso, até duas erradas ainda não tentadas, deixando sempre uma errada
  const l = escondiveis();
  G.hid = sh(l).slice(0, Math.min(2, l.length - 1));
  beep(440);
  render();
}
/*
========================================================================
vitoria(): chegada à Sanção
========================================================================
Quando é chamada: por entrar(), quando o peão passa da última casa.
Fluxo:
  Bônus: +1 ⭐ por vida que sobrou
  ↓
  Soma o bônus às estrelas e uma lei à caderneta P
  ↓
  fimDeJogo(vitória)
========================================================================
*/
// Bônus da sanção: +1 ⭐ por vida que sobrou.
function vitoria() {
  G.bonus = G.vidas;
  G.estrelas += G.bonus;
  P.leis = (P.leis || 0) + 1;
  fimDeJogo(true);
}
/*
========================================================================
fimDeJogo(): encerramento da partida
========================================================================
Quando é chamada: por vitoria() ou por continuar() (derrota).
Fluxo:
  Marca a tela 'fim' e guarda se foi vitória e o motivo da derrota
  ↓
  Estrelas acima do recorde? → sim → novo recorde na caderneta P (bestE)
  ↓
  Grava a caderneta no navegador (save)
  ↓
  Toca o bipe final e desenha a tela final (render → vFim)
========================================================================
*/
// Encerra a partida, atualiza o recorde e mostra a tela final.
function fimDeJogo(win, motivo) {
  G.tela = 'fim';
  G.win = win;
  G.motivo = motivo || null;
  // recorde em estrelas (bestE); o antigo recorde em XP (best) deixou de ser usado
  G.novoRecorde = G.estrelas > (P.bestE || 0);
  if (G.novoRecorde) P.bestE = G.estrelas;
  save();
  beep(win ? 880 : 120, win ? 0.3 : 0.4);
  render();
}

*/
let pedidoInstalar = null; // pedido de instalação guardado pelo navegador (beforeinstallprompt)
const instalado = () =>
  (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
function vInstalar() {
  if (instalado()) return '';
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const dica = ios
    ? 'No Safari, toque em Compartilhar (quadrado com seta) e depois em <b>Adicionar à Tela de Início</b>.'
    : 'No menu ⋮ do navegador, toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.';
  return `<p class="inst"><button class="lk" data-a="instalar"><svg class="cel" viewBox="0 0 16 24" aria-hidden="true"><rect x="2" y="1" width="12" height="22" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6.5 19.5h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Instalar o jogo no celular</button>${G.dicaInst ? `<span class="sub">${dica}</span>` : ''}</p>`;
}
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  pedidoInstalar = e;
});
window.addEventListener('appinstalled', () => {
  pedidoInstalar = null;
  render();
});

/*

========================================================================

(corações), cargo atual, estrelas com a barra até o próximo cargo e a
barra do mandato (vermelha com 12 meses ou menos).

// Painel do mandato: nome, projeto, vidas, cargo, estrelas e mandato.
function hud() {
  const c = cargo(),
    nx = CARGOS[c + 1],
    pc = nx ? ((G.estrelas - CARGOS[c][0]) / (nx[0] - CARGOS[c][0])) * 100 : 100,
    pm = (G.mes / REGRAS.meses) * 100;
  return `<div class="hud"><div class="hj"><div class="hn"><b>${esc(tit() + ' ' + G.nome)}</b><span>PL nº ${G.num}/${G.ano} · ${esc(G.proj)}</span></div><div class="hv" role="img" aria-label="${G.vidas} de ${REGRAS.vidas} vidas">${'❤️'.repeat(G.vidas)}${'🖤'.repeat(REGRAS.vidas - G.vidas)}</div></div>
<div class="hc"><span class="rb">${nomeCargo(c)}</span><div class="bx" title="${nx ? `Faltam ${nx[0] - G.estrelas} ⭐ para ${nomeCargo(c + 1)}` : 'Cargo máximo'}"><i style="width:${pc}%"></i></div><span class="xv">⭐ ${G.estrelas}</span></div>

/*

// Tabuleiro: casas concluídas, casa atual (com o peão) e casas futuras.
function tab() {
  const at = casa().e;
  let h =
    '<div class="tab" role="img" aria-label="Tabuleiro: casa ' +
    (Math.min(G.pos, FIM) + 1) +
    ' de ' +
    (FIM + 1) +

  ETAPAS.forEach((et, e) => {

  });
  return (
    h +
    `<div class="et fim ${G.pos >= FIM ? 'atual' : ''}"><div class="en"><b>🏛️</b><span>Sanção do Prefeito</span></div><div class="tr"><i class="cs sn ${G.pos >= FIM ? 'aqui' : ''}">SANÇÃO</i></div></div></div>`

function cena(gr) {

/*
========================================================================
vPalco(): centro da tela de jogo
========================================================================
Quando aparece: durante toda a partida, à direita do tabuleiro (no
celular, abaixo dele).
Papel: mostrar o desafio da vez, conforme G.fase:
  'etapa'  apresentação da etapa pelo mascote e botão ENTRAR;
  'carta'  carta de Sorte ou Azar com seus efeitos;
  'q'      pergunta com quatro alternativas e botão de consulta; as
           alternativas já tentadas e erradas aparecem riscadas;
  'resp'   depois do acerto: certa em verde, explicação com a fonte,
           efeitos e botão de continuar.
Os erros não têm fase própria: abrem o pop-up vPop() sobre a pergunta.
Nos eventos, mostra também a faixa amarela com a situação narrada.
========================================================================
*/
// Centro da tela de jogo, conforme a fase: apresentação, pergunta, resposta ou carta.
function vPalco() {
  // fase 'etapa': apresentação da etapa
  if (G.fase == 'etapa')
    return (
      cena(1) +
      msb(etapa().intro, 'h') +
      `<button class="go" data-a="abrir">${G.pos == 0 ? 'COMEÇAR A TRAMITAÇÃO' : 'ENTRAR'}</button>`
    );
  // fase 'carta': carta sorteada e seus efeitos
  if (G.fase == 'carta') {
    const c = CARTAS[G.carta];
    return (
      cena() +
      `<div class="cr ${c.bom ? 'bom' : 'mau'}"><span class="tp">${c.bom ? 'CARTA DE SORTE' : 'CARTA DE AZAR'}</span><span class="ic">${c.ic}</span><h2 class="t">${c.nome}</h2><p>${c.txt}</p>${chips(G.cartaFx, G.mov)}</div><button class="go" data-a="continuar">${G.perdeu ? 'VER RESULTADO' : c.fx.extra ? 'RESPONDER' : 'CONTINUAR'}</button>`
    );
  }
  // fases 'q' (pergunta aberta) e 'resp' (resposta comentada)
  const q = cur(),
    r = G.resp,
    src = G.q.src,
    desc = G.q.desc,
    ev = src == 'evento' ? EVENTOS[G.q.ev] : null;
  // texto do balão do mascote
  const fala = r
    ? `<b>Isso mesmo!</b> ${r.tent > 1 ? `Você acertou na ${r.tent}ª tentativa. ` : ''}${esc(q[5])}<br><span class="rf">${esc(q[6])}</span>`
    : desc.length
      ? `Você já descartou ${desc.length == 1 ? 'uma alternativa' : desc.length + ' alternativas'}. Releia a pergunta e tente de novo.`
      : src == 'evento'
        ? 'Imprevisto! Responda bem para sair fortalecido.'
        : src == 'extra'
          ? 'Questionamento jurídico! Responda para o projeto seguir.'
          : `${casa().n}: acerte para avançar uma casa.`;
  // aparência de cada alternativa: certa (verde, após o acerto), descartada (riscada) ou escondida pela consulta
  const classe = i =>
    r && i == 1 ? 'okb' : desc.includes(i) ? 'x' : G.hid.includes(i) ? 'hid' : '';
  const travada = i => r || G.corr || desc.includes(i) || G.hid.includes(i);

    cena() +
    (ev

      : '') +
    msb(fala, r ? 'h' : desc.length ? 's' : 'n') +
    `<div class="card qc">${esc(q[0])}</div>
<div id="o">${G.q.ops.map(i => `<button data-a="resp" data-v="${i}" ${travada(i) ? 'disabled' : ''} class="${classe(i)}">${esc(q[i])}</button>`).join('')}</div>` +

      ? chips(r.fx, src == 'etapa' ? 0 : G.mov) +
        `<button class="go" data-a="continuar">${G.perdeu ? 'VER RESULTADO' : G.pos + G.mov >= FIM ? 'RECEBER A SANÇÃO' : G.mov < 0 ? 'VOLTAR UMA CASA' : 'AVANÇAR'}</button>`
      : `<button class="lf" data-a="consultar" ${podeConsultar() ? '' : 'disabled'}>💡 Consultar a Procuradoria (${G.cons}) · custa 1 mês</button>`)
  );
}
/*

function vPop() {
